<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102f27">
<link rel="manifest" href="manifest.webmanifest">
<title>My Money</title>
<style>
:root{--green:#102f27;--green2:#17483a;--gold:#b08d57;--cream:#f5f1e8;--paper:#fffdf8;--ink:#101713;--muted:#39443f;--line:#ded8cb;--red:#b63f45;--blue:#315d8c;--mint:#e7f0ea;--shadow:0 10px 28px rgba(36,48,42,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at top,#fbfaf6 0,#f5f1e8 48%,#eee9dd 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:88px}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:12px 15px;background:var(--green);color:#fff;font-weight:750;cursor:pointer}button:active{transform:scale(.98)}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--gold)}
.wrap{max-width:900px;margin:auto}.top{background:linear-gradient(135deg,#0b241e,#17483a 52%,#0b2a22);color:#fff;padding:28px 18px 26px;border-bottom:1px solid rgba(176,141,87,.55);box-shadow:0 14px 34px rgba(15,44,35,.16);border-radius:0 0 30px 30px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0 0 5px;font-size:28px}.top small{opacity:.9}.goldbtn{background:linear-gradient(135deg,#b08d57,#d2b37b);color:#16251f}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:-5px 14px 18px}.card{background:rgba(255,255,255,.96);border:1px solid rgba(176,141,87,.18);border-radius:20px;padding:15px;box-shadow:var(--shadow)}.hero{background:linear-gradient(135deg,#fffdf8,#eef5ef);border-color:rgba(176,141,87,.35)}.label{font-size:12px;color:var(--muted);font-weight:650;margin-bottom:6px}.value{font-size:20px;font-weight:850}.section{padding:0 14px;margin:18px auto}.section h2{font-size:21px;margin:8px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{min-height:76px;background:#fff;color:var(--green);border:1px solid rgba(176,141,87,.28);box-shadow:0 6px 18px rgba(36,48,42,.05)}.list{display:flex;flex-direction:column;gap:10px}.row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;justify-content:space-between;gap:10px}.meta{color:var(--muted);font-size:12px;margin-top:4px}.money{font-weight:850;white-space:nowrap}.income{color:#18854e}.expense{color:var(--red)}.notice{background:#edf4ef;color:var(--green);border:1px solid #d7e4dc;border-radius:14px;padding:12px;font-size:13px}.empty{padding:24px;text-align:center;color:var(--muted);background:#fff;border-radius:16px;border:1px dashed var(--line)}.secondary{background:#fff;color:var(--green);border:1px solid #cbd8d3}.danger{background:#fff;color:var(--red);border:1px solid #f0cccc}.mini{padding:8px 10px;border-radius:10px;font-size:12px}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid rgba(176,141,87,.25);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(20,40,32,.06)}.nav button{background:none;color:#39443f;padding:7px 5px;font-size:11px}.nav button.active{color:var(--gold)}.nav span{display:block;font-size:20px}.modal{position:fixed;z-index:50;inset:0;background:#0007;display:flex;align-items:flex-end}.modal.hidden{display:none}.sheet{background:linear-gradient(180deg,#faf8f2,#f2eee5);width:100%;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px}.sheet h3{margin:0 0 14px;color:var(--green)}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:700;color:#17231f}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.cat{background:#fff;color:#000;border:1px solid var(--line);text-align:left;padding:10px}.cat.selected{border:2px solid var(--green);background:#f5fbf7}.balance{display:grid;gap:12px}.balance-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px}.balance-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.balance-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.balance-item{background:#f8faf9;border-radius:13px;padding:11px}.balance-item small{display:block;color:var(--muted);font-size:11px}.balance-item b{display:block;margin-top:4px;font-size:17px}.total{background:var(--mint)}.toolbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}.report-head{background:linear-gradient(135deg,#0b241e,#17483a);color:#fff;padding:22px;border-radius:20px;margin-bottom:14px}.report-head h1{margin:0 0 5px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.summary>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.summary span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.section-divider{height:1px;background:var(--line);margin:16px 0}.small{font-size:12px}.right{text-align:right}.nowrap{white-space:nowrap}@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(4,1fr)}.summary{grid-template-columns:repeat(3,1fr)}.cats{grid-template-columns:repeat(4,1fr)}}
@media print{body{background:#fff;padding:0}.nav,.toolbar,.no-print{display:none!important}.section{page-break-inside:avoid}.card,.row,.summary>div{box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div><div id="modal" class="modal hidden"></div>
<script>
'use strict';
const KEY='my_money_new_v1';
const DB='my_money_new_db';
const EXPENSE_CATS=[['🍔','Food'],['💊','Medicine & Health'],['💨','Cigg'],['🏸','Sports'],['📱','Recharge & Bills'],['💇','Salon & Grooming'],['⛽','Petrol / Transport'],['📦','Others']];
const INCOME_CATS=['Bohra Fashion','Investment','Others'];
const ACCOUNTS=['Bank','Cash','Investment Cash'];
const ALL_BALANCES=['Bank','Cash','Investment Cash','Stocks','Mutual Funds'];
const EMPTY={version:1,month:'',opening:{bank:0,cash:0,investmentCash:0,stocks:0,mfs:0,date:''},income:[],expenses:[],loans:[],transfers:[],history:{}};
let S=null,page='home',dbPromise=null;
const $=id=>document.getElementById(id);
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function money(v){return '₹'+n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function monthKey(d){return String(d||'').slice(0,7)}
function thisMonth(){return monthKey(today())}
function clone(v){return JSON.parse(JSON.stringify(v))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function normalize(s){s={...clone(EMPTY),...(s||{})};s.income=Array.isArray(s.income)?s.income:[];s.expenses=Array.isArray(s.expenses)?s.expenses:[];s.loans=Array.isArray(s.loans)?s.loans:[];s.transfers=Array.isArray(s.transfers)?s.transfers:[];s.history=s.history&&typeof s.history==='object'?s.history:{};s.opening={...clone(EMPTY.opening),...(s.opening||{})};s.month=s.month||thisMonth();s.opening.date=s.opening.date||s.month+'-01';s.income.forEach(x=>{if(!INCOME_CATS.includes(x.category))x.category='Others';x.amount=n(x.amount);x.date=x.date||today();x.account=ACCOUNTS.includes(x.account)?x.account:'Bank'});s.expenses.forEach(x=>{if(!EXPENSE_CATS.some(c=>c[1]===x.category))x.category='Others';x.amount=n(x.amount);x.date=x.date||today();x.account=ACCOUNTS.includes(x.account)?x.account:'Bank';x.expenseName=x.expenseName||'Expense'});return s}
async function openDB(){if(dbPromise)return dbPromise;if(!('indexedDB' in window))return null;dbPromise=new Promise(resolve=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('state'))r.result.createObjectStore('state')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)});return dbPromise}
async function dbGet(){try{const db=await openDB();if(!db)return null;return await new Promise(res=>{const r=db.transaction('state','readonly').objectStore('state').get('main');r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)})}catch(e){return null}}
async function dbPut(data){try{const db=await openDB();if(!db)return;await new Promise(res=>{const r=db.transaction('state','readwrite').objectStore('state').put(data,'main');r.onsuccess=()=>res();r.onerror=()=>res()})}catch(e){}}
function localLoad(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return normalize(null)}}
async function boot(){
  const local=localLoad();
  const stored=await dbGet();
  S=local;
  if(stored&&stored.data&&n(stored.savedAt)>n(local.savedAt)){S=normalize(stored.data);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  rolloverIfNeeded();
  render();
}
async function persist(){S.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}await dbPut({savedAt:S.savedAt,data:S});render()}
function liquidKey(name){return name==='Bank'?'bank':name==='Cash'?'cash':'investmentCash'}
function baseBalances(){return {bank:n(S.opening.bank),cash:n(S.opening.cash),investmentCash:n(S.opening.investmentCash),stocks:n(S.opening.stocks),mfs:n(S.opening.mfs)}}
function applyAll(start,end){
  const b=baseBalances();
  const inRange=d=>String(d||'')>=start&&String(d||'')<=end;
  for(const x of S.income)if(inRange(x.date))b[liquidKey(x.account)]+=n(x.amount);
  for(const x of S.expenses)if(inRange(x.date))b[liquidKey(x.account)]-=n(x.amount);
  for(const x of S.transfers)if(inRange(x.date)){const a=n(x.amount),f=liquidKey(x.from),t=liquidKey(x.to);if(x.from==='Stocks')b.stocks-=a;else if(x.from==='Mutual Funds')b.mfs-=a;else b[f]-=a;if(x.to==='Stocks')b.stocks+=a;else if(x.to==='Mutual Funds')b.mfs+=a;else b[t]+=a}
  for(const x of S.loans){if(inRange(x.date)){const a=n(x.amount),k=liquidKey(x.account);b[k]+=x.type==='lent'?-a:a}for(const r of (x.repayments||[]))if(inRange(r.date)){const a=n(r.amount),k=liquidKey(r.account);b[k]+=x.type==='lent'?a:-a}}
  return b;
}
function currentBalances(){return applyAll(S.opening.date,today())}
function totals(b){return n(b.bank)+n(b.cash)+n(b.investmentCash)+n(b.stocks)+n(b.mfs)}
function receivable(){return S.loans.filter(x=>x.type==='lent').reduce((a,x)=>a+Math.max(0,n(x.amount)-n(x.paid)),0)}
function payable(){return S.loans.filter(x=>x.type==='borrowed').reduce((a,x)=>a+Math.max(0,n(x.amount)-n(x.paid)),0)}
function netWorth(b){return totals(b)+receivable()-payable()}
function rolloverIfNeeded(){
  const now=thisMonth();
  if(S.month===now)return;
  let old=S.month||monthKey(S.opening.date)||now;
  let cursor=old;
  while(cursor<now){
    const end=new Date(Number(cursor.slice(0,4)),Number(cursor.slice(5,7)),0).toISOString().slice(0,10);
    const close=applyAll(S.opening.date,end);
    S.history[cursor]={opening:clone(S.opening),closing:{date:end,...close}};
    const nextDate=new Date(Number(cursor.slice(0,4)),Number(cursor.slice(5,7)),1).toISOString().slice(0,10);
    const next=monthKey(nextDate);
    S.opening={date:next+'-01',bank:close.bank,cash:close.cash,investmentCash:close.investmentCash,stocks:close.stocks,mfs:close.mfs};
    S.month=next;cursor=next;
  }
}
function nav(){const items=[['home','⌂','Home'],['transactions','☷','Transactions'],['loans','◉','Loans'],['reports','▤','Reports'],['settings','⚙','Settings']];return '<nav class="nav">'+items.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')+'</nav>'}
function layout(html){$('app').innerHTML='<div class="wrap">'+html+'</div>'+nav()}
function home(){const b=currentBalances();const m=thisMonth();const inc=S.income.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0);const exp=S.expenses.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0);layout(`<div class="top"><div class="brand"><div><h1>My Money</h1><small>Personal finance · New Edition</small></div><button class="goldbtn" onclick="openBalances()">Balances</button></div></div><div class="cards"><div class="card hero"><div class="label">Net Worth</div><div class="value">${money(netWorth(b))}</div></div>${[['Bank',b.bank],['Cash',b.cash],['Investment Cash',b.investmentCash],['Stocks',b.stocks],['Mutual Funds',b.mfs]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${money(x[1])}</div></div>`).join('')}</div><section class="section"><div class="grid"><button class="action" onclick="openTxn('expense')">−<br>Add Expense</button><button class="action" onclick="openTxn('income')">＋<br>Add Income</button><button class="action" onclick="openTransfer()">⇄<br>Transfer</button><button class="action" onclick="openLoan()">💰<br>Add Loan</button></div></section><section class="section"><h2>This Month</h2><div class="grid"><div class="card"><div class="label">Income</div><div class="value income">${money(inc)}</div></div><div class="card"><div class="label">Spent</div><div class="value expense">${money(exp)}</div></div></div></section><section class="section"><h2>Loans</h2><div class="grid"><div class="card"><div class="label">Loan owed to me</div><div class="value">${money(receivable())}</div></div><div class="card"><div class="label">Loan I owe</div><div class="value">${money(payable())}</div></div></div></section><section class="section"><h2>Recent Transactions</h2>${recentHTML()}</section>`)}
function recentHTML(){const all=[...S.income.map(x=>({...x,k:'income'})),...S.expenses.map(x=>({...x,k:'expense'})),...S.loans.map(x=>({...x,k:'loan'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,8);if(!all.length)return '<div class="empty">No recent entries.</div>';return '<div class="list">'+all.map(x=>{if(x.k==='loan')return `<div class="row"><div><b>Loan · ${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe me':'I owe them'} · ${esc(x.date)}</div></div><div class="money">${money(Math.max(0,n(x.amount)-n(x.paid)))}</div></div>`;return `<div class="row"><div><b>${esc(x.k==='expense'?x.expenseName:(x.incomeName||x.category))}</b><div class="meta">${esc(x.date)} · ${esc(x.account)}</div></div><div class="money ${x.k==='income'?'income':'expense'}">${x.k==='income'?'+':'−'}${money(x.amount)}</div></div>`}).join('')+'</div>'}
function openModal(title,body){$('modal').innerHTML=`<div class="sheet"><h3>${title}</h3>${body}</div>`;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function accountOptions(selected='Bank'){return ACCOUNTS.map(a=>`<option ${a===selected?'selected':''}>${a}</option>`).join('')}
function expenseCats(selected='Others'){return `<div class="cats">${EXPENSE_CATS.map(c=>`<button type="button" class="cat ${c[1]===selected?'selected':''}" data-cat="${esc(c[1])}" onclick="pickCat(this)">${c[0]} ${esc(c[1])}</button>`).join('')}</div><input id="category" type="hidden" value="${esc(selected)}">`}
function incomeCats(selected='Bohra Fashion'){return `<select id="category" onchange="toggleOtherIncome(this)">${INCOME_CATS.map(c=>`<option ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}</select>`}
function toggleOtherIncome(sel){const f=$('otherIncome');if(f)f.classList.toggle('hidden',sel.value!=='Others')}
function pickCat(btn){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');$('category').value=btn.dataset.cat}
function openTxn(type,idv=null){const arr=type==='income'?S.income:S.expenses;const x=idv?arr.find(a=>a.id===idv):null;if(type==='expense'){openModal(x?'Edit Expense':'Add Expense',`<form class="form" onsubmit="saveTxn(event,'expense','${idv||''}')"><label>Expense Name</label><input id="name" required value="${esc(x?.expenseName||'')}"><label>Category</label>${expenseCats(x?.category||'Others')}<label>Amount</label><input id="amount" type="number" step="0.01" min="0.01" required value="${x?.amount??''}"><label>Paid From</label><select id="account">${accountOptions(x?.account||'Bank')}</select><label>Date</label><input id="date" type="date" required value="${x?.date||today()}"><button>${x?'Save Changes':'Save Expense'}</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`);return}openModal(x?'Edit Income':'Add Income',`<form class="form" onsubmit="saveTxn(event,'income','${idv||''}')"><label>Income Name</label><input id="name" value="${esc(x?.incomeName||'')}"><label>Category</label>${incomeCats(x?.category||'Bohra Fashion')}<div id="otherIncome" class="${x?.category==='Others'?'':'hidden'}"><label>Income Name for Others</label><input id="otherName" value="${esc(x?.incomeName||'')}"></div><label>Amount</label><input id="amount" type="number" step="0.01" min="0.01" required value="${x?.amount??''}"><label>Received In</label><select id="account">${accountOptions(x?.account||'Bank')}</select><label>Date</label><input id="date" type="date" required value="${x?.date||today()}"><button>${x?'Save Changes':'Save Income'}</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
async function saveTxn(e,type,idv){e.preventDefault();const f=e.currentTarget;const amount=n(f.querySelector('#amount').value),account=f.querySelector('#account').value,date=f.querySelector('#date').value,category=f.querySelector('#category').value;if(amount<=0||!date)return;const name=f.querySelector('#name')?.value.trim()||'';const item={id:idv||id(),amount,account,date,category};if(type==='expense')item.expenseName=name||'Expense';else item.incomeName=category==='Others'?(f.querySelector('#otherName')?.value.trim()||name):name;if(type==='income'&&category==='Others'&&!item.incomeName){alert('Please enter the Income Name for Others.');return}const arr=type==='income'?S.income:S.expenses;if(idv){const i=arr.findIndex(x=>x.id===idv);if(i>=0)arr[i]=item}else arr.push(item);closeModal();await persist()}
function editTxn(type,idv){openTxn(type,idv)}
async function deleteTxn(type,idv){if(!confirm('Delete this transaction?'))return;const arr=type==='income'?S.income:S.expenses;const i=arr.findIndex(x=>x.id===idv);if(i>=0){arr.splice(i,1);await persist()}}
function openTransfer(){openModal('Transfer Money',`<form class="form" onsubmit="saveTransfer(event)"><label>From</label><select id="from">${ALL_BALANCES.map(a=>`<option>${a}</option>`).join('')}</select><label>To</label><select id="to">${ALL_BALANCES.map(a=>`<option>${a}</option>`).join('')}</select><label>Amount</label><input id="amount" type="number" step="0.01" min="0.01" required><label>Date</label><input id="date" type="date" value="${today()}" required><button>Transfer</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
async function saveTransfer(e){e.preventDefault();const from=$('from').value,to=$('to').value,amount=n($('amount').value),date=$('date').value;if(from===to){alert('Choose different balances.');return}const b=currentBalances(),val={Bank:b.bank,Cash:b.cash,'Investment Cash':b.investmentCash,Stocks:b.stocks,'Mutual Funds':b.mfs};if(val[from]<amount){alert('Insufficient balance.');return}S.transfers.push({id:id(),from,to,amount,date});closeModal();await persist()}
function openLoan(idv=null){const x=idv?S.loans.find(a=>a.id===idv):null;openModal(x?'Edit Loan':'Add Loan',`<form class="form" onsubmit="saveLoan(event,'${idv||''}')">${x?`<label>Change Entry To</label><select id="conversion" onchange="toggleLoanConversion(this)"><option value="loan">Keep as Loan</option><option value="expense">Expense</option><option value="income">Income</option></select><div id="loanIncomeBox" class="hidden"><label>Income Category</label><select id="loanIncomeCategory">${INCOME_CATS.map(c=>`<option>${c}</option>`).join('')}</select><label>Income Name</label><input id="loanIncomeName"></div>`:''}<label>Person</label><input id="person" required value="${esc(x?.person||'')}"><label>Type</label><select id="type"><option value="lent" ${x?.type==='lent'?'selected':''}>I lent money</option><option value="borrowed" ${x?.type==='borrowed'?'selected':''}>I borrowed money</option></select><label>Account</label><select id="account">${accountOptions(x?.account||'Bank')}</select><label>Total Loan Amount</label><input id="amount" type="number" step="0.01" min="0.01" required value="${x?.amount??''}">${x?`<div class="notice">Paid / received: <b>${money(x.paid||0)}</b></div>`:''}<label>Date</label><input id="date" type="date" value="${x?.date||today()}" required><button>Save Loan</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function toggleLoanConversion(sel){$('loanIncomeBox')?.classList.toggle('hidden',sel.value!=='income')}
async function saveLoan(e,idv){e.preventDefault();const old=idv?S.loans.find(x=>x.id===idv):null;const conversion=idv?$('conversion').value:'loan';const person=$('person').value.trim(),type=$('type').value,account=$('account').value,amount=n($('amount').value),date=$('date').value;if(!person||amount<=0||!date)return;if(idv&&conversion!=='loan'&&old){const outstanding=Math.max(0,n(old.amount)-n(old.paid));S.loans=S.loans.filter(x=>x.id!==idv);if(conversion==='expense')S.expenses.push({id:id(),expenseName:person,category:'Others',amount:outstanding,account,date});else{const cat=$('loanIncomeCategory').value;const name=$('loanIncomeName').value.trim();if(cat==='Others'&&!name){alert('Enter an income name.');return}S.income.push({id:id(),incomeName:name,category:cat,amount:outstanding,account,date})}closeModal();await persist();return}const item={id:idv||id(),person,type,account,amount,paid:old?Math.min(n(old.paid),amount):0,date,repayments:old?.repayments||[]};if(idv){const i=S.loans.findIndex(x=>x.id===idv);if(i>=0)S.loans[i]=item}else S.loans.push(item);closeModal();await persist()}
function repayLoan(idv){const x=S.loans.find(a=>a.id===idv);if(!x)return;const outstanding=Math.max(0,n(x.amount)-n(x.paid));openModal(x.type==='lent'?'Receive Repayment':'Repay Loan',`<form class="form" onsubmit="saveRepayment(event,'${idv}')"><div class="notice">Outstanding: ${money(outstanding)}</div><label>Repayment Amount</label><input id="amount" type="number" step="0.01" min="0.01" max="${outstanding}" required><label>Paid by / Received in</label><select id="account">${accountOptions(x.account||'Bank')}</select><label>Payment Date</label><input id="date" type="date" value="${today()}" required><button>Save Repayment</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
async function saveRepayment(e,idv){e.preventDefault();const x=S.loans.find(a=>a.id===idv),amount=n($('amount').value),account=$('account').value,date=$('date').value;if(!x||amount<=0||amount>n(x.amount)-n(x.paid))return;x.paid=n(x.paid)+amount;x.repayments=Array.isArray(x.repayments)?x.repayments:[];x.repayments.push({id:id(),amount,account,date});closeModal();await persist()}
async function deleteLoan(idv){if(!confirm('Delete this loan?'))return;S.loans=S.loans.filter(x=>x.id!==idv);await persist()}
function loans(){const list=S.loans.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));layout(`<section class="section"><h2>Loans</h2><div class="notice">Track money you lend, borrow and repay. Balances are calculated automatically.</div><div style="margin-top:12px"><button onclick="openLoan()">＋ Add Loan</button></div><div class="list" style="margin-top:12px">${list.length?list.map(x=>{const out=Math.max(0,n(x.amount)-n(x.paid));return `<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe you':'You owe them'} · ${esc(x.date)} · ${esc(x.account)}</div><div class="meta">${out<=0?'CLEARED':'Outstanding '+money(out)}${x.repayments?.length?' · Last payment '+esc(x.repayments[x.repayments.length-1].date):''}</div></div><div class="right"><div class="money">${money(out)}</div><div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">${out>0?`<button class="mini" onclick="repayLoan('${x.id}')">${x.type==='lent'?'Receive Repayment':'Repay'}</button>`:''}<button class="mini secondary" onclick="openLoan('${x.id}')">Edit</button><button class="mini danger" onclick="deleteLoan('${x.id}')">Delete</button></div></div></div>`}).join(''):'<div class="empty">No loans.</div>'}</div></section>`)}
function transactions(){const all=[...S.income.map(x=>({...x,k:'income'})),...S.expenses.map(x=>({...x,k:'expense'})),...S.loans.map(x=>({...x,k:'loan'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));layout(`<section class="section"><h2>Transactions</h2><div class="notice">Income, expenses and loans are shown here. Transfers are recorded separately.</div><div class="list" style="margin-top:12px">${all.length?all.map(x=>{if(x.k==='loan')return `<div class="row"><div><b>Loan · ${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe you':'You owe them'} · ${esc(x.date)}</div></div><div class="right"><div class="money">${money(Math.max(0,n(x.amount)-n(x.paid)))}</div><div style="margin-top:7px"><button class="mini secondary" onclick="openLoan('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteLoan('${x.id}')">Delete</button></div></div></div>`;return `<div class="row"><div><b>${esc(x.k==='expense'?x.expenseName:(x.incomeName||x.category))}</b><div class="meta">${esc(x.category)} · ${esc(x.date)} · ${esc(x.account)}</div></div><div class="right"><div class="money ${x.k==='income'?'income':'expense'}">${x.k==='income'?'+':'−'}${money(x.amount)}</div><div style="margin-top:7px"><button class="mini secondary" onclick="openTxn('${x.k}','${x.id}')">Edit</button> <button class="mini danger" onclick="deleteTxn('${x.k}','${x.id}')">Delete</button></div></div></div>`}).join(''):'<div class="empty">No transactions.</div>'}</div></section>`)}
function openBalances(){const b=currentBalances(),o=S.opening;openModal('Opening / Current / Closing',`<div class="balance"><div class="balance-card"><div class="balance-title"><b>Opening Balance</b><button class="mini secondary" onclick="editOpening()">Edit</button></div><div class="meta">${esc(o.date)}</div>${balanceGrid(o)}</div><div class="balance-card"><div class="balance-title"><b>Current Balance</b><span class="small">Automatic</span></div>${balanceGrid(b,true)}</div><div class="balance-card"><div class="balance-title"><b>Closing Balance</b></div>${balanceGrid(b,true)}</div><div class="notice">The previous month's closing balance becomes the next month's opening balance automatically. Stocks and Mutual Funds are total values only.</div><button class="secondary" onclick="closeModal()">Close</button></div>`)}
function balanceGrid(b,current=false){return `<div class="balance-grid">${[['Bank',b.bank],['Cash',b.cash],['Investment Cash',b.investmentCash],['Stocks',b.stocks],['Mutual Funds',b.mfs]].map(x=>`<div class="balance-item"><small>${x[0]}</small><b>${money(x[1])}</b></div>`).join('')}<div class="balance-item total"><small>${current?'Current Total':'Opening Total'}</small><b>${money(totals(b))}</b></div></div>`}
function editOpening(){const o=S.opening;openModal('Edit Opening Balance',`<form class="form" onsubmit="saveOpening(event)"><div class="notice">Enter total opening values. No individual stock or mutual-fund entries are required.</div><label>Opening Date</label><input id="date" type="date" value="${o.date}" required>${[['bank','Bank'],['cash','Cash'],['investmentCash','Investment Cash'],['stocks','Stocks — Total'],['mfs','Mutual Funds — Total']].map(x=>`<label>${x[1]}</label><input id="${x[0]}" type="number" step="0.01" value="${n(o[x[0]])}">`).join('')}<button>Save Opening Balance</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
async function saveOpening(e){e.preventDefault();S.opening={date:$('date').value,bank:n($('bank').value),cash:n($('cash').value),investmentCash:n($('investmentCash').value),stocks:n($('stocks').value),mfs:n($('mfs').value)};S.month=monthKey(S.opening.date);closeModal();await persist()}
function reportRows(){return [...S.income.map(x=>({...x,k:'Income',name:x.incomeName||x.category})),...S.expenses.map(x=>({...x,k:'Expense',name:x.expenseName||'Expense'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function reports(){const b=currentBalances(),rows=reportRows(),m=thisMonth(),inc=S.income.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0),exp=S.expenses.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0);const cats={};S.expenses.filter(x=>monthKey(x.date)===m).forEach(x=>(cats[x.category]??=[]).push(x));layout(`<section class="section"><div class="toolbar"><h2>Reports</h2><button onclick="reportPage()">Open Report Sheet</button></div><div class="summary"><div><span>Income</span><b class="income">${money(inc)}</b></div><div><span>Expenses</span><b class="expense">${money(exp)}</b></div><div><span>Net Worth</span><b>${money(netWorth(b))}</b></div><div><span>Loan owed to you</span><b>${money(receivable())}</b></div><div><span>Loan you owe</span><b>${money(payable())}</b></div><div><span>Current Total</span><b>${money(totals(b))}</b></div></div><h2 style="margin-top:20px">Expense Categories</h2>${Object.keys(cats).length?'<div class="list">'+Object.entries(cats).map(([k,items])=>`<div class="card"><b>${esc(k)}</b><div class="meta">${items.map(x=>esc(x.expenseName)+' · '+money(x.amount)).join('<br>')}</div><div class="money expense" style="margin-top:7px">${money(items.reduce((a,x)=>a+n(x.amount),0))}</div></div>`).join('')+'</div>':'<div class="empty">No expenses this month.</div>'}<h2 style="margin-top:20px">All Transactions</h2><div class="list">${rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="meta">${esc(x.k)} · ${esc(x.category)} · ${esc(x.date)} · ${esc(x.account)}</div></div><div class="money ${x.k==='Income'?'income':'expense'}">${x.k==='Income'?'+':'−'}${money(x.amount)}</div></div>`).join(''):'<div class="empty">No transactions.</div>'}</div><h2 style="margin-top:20px">Balances</h2><div class="card">${balanceGrid(b,true)}</div></section>`)}
function reportPage(){const b=currentBalances(),rows=reportRows();const html=`<section class="section"><div class="toolbar"><button class="secondary" onclick="go('reports')">← Back</button><button onclick="generatePDF()">Generate PDF</button></div><div class="report-head"><h1>My Money</h1><div>Financial Report · ${esc(thisMonth())}</div></div><div class="summary"><div><span>Bank</span><b>${money(b.bank)}</b></div><div><span>Cash</span><b>${money(b.cash)}</b></div><div><span>Investment Cash</span><b>${money(b.investmentCash)}</b></div><div><span>Stocks</span><b>${money(b.stocks)}</b></div><div><span>Mutual Funds</span><b>${money(b.mfs)}</b></div><div><span>Net Worth</span><b>${money(netWorth(b))}</b></div></div><h2>Income & Expenses</h2><div class="list">${rows.length?rows.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="meta">${esc(x.k)} · ${esc(x.category)} · ${esc(x.date)} · ${esc(x.account)}</div></div><div class="money ${x.k==='Income'?'income':'expense'}">${x.k==='Income'?'+':'−'}${money(x.amount)}</div></div>`).join(''):'<div class="empty">No transactions.</div>'}</div><h2>Loans</h2><div class="list">${S.loans.length?S.loans.map(x=>`<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${x.type==='lent'?'Lent':'Borrowed'} · ${esc(x.date)} · ${esc(x.account)}</div></div><div class="money">${money(Math.max(0,n(x.amount)-n(x.paid)))}</div></div>`).join(''):'<div class="empty">No loans.</div>'}</div></section>`;layout(html)}
function pdfEscape(v){return String(v??'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]+/g,' ')}
function makePDF(lines){const chunks=[];for(let i=0;i<lines.length;i+=48)chunks.push(lines.slice(i,i+48));const objs=[];const add=o=>{objs.push(o);return objs.length};const catalog=add(null),pages=add(null),font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'),kids=[];for(const chunk of chunks){const text=['BT','/F1 9 Tf','40 800 Td'];chunk.forEach((line,i)=>{if(i)text.push('0 -15 Td');text.push('('+pdfEscape(line)+') Tj')});text.push('ET');const stream=text.join('\n');const c=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);const p=add(`<< /Type /Page /Parent ${pages} 0 R /MediaBox [0 0 612 842] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${c} 0 R >>`);kids.push(`${p} 0 R`)}objs[catalog-1]=`<< /Type /Catalog /Pages ${pages} 0 R >>`;objs[pages-1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;let out='%PDF-1.4\n%MYMONEY\n',offs=[0];objs.forEach((o,i)=>{offs[i+1]=out.length;out+=`${i+1} 0 obj\n${o}\nendobj\n`});const x=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<=objs.length;i++)out+=String(offs[i]).padStart(10,'0')+' 00000 n \n';out+=`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${x}\n%%EOF`;return new Blob([out],{type:'application/pdf'})}
function generatePDF(){const b=currentBalances(),lines=['MY MONEY','Financial Report - '+thisMonth(),'','BALANCES','Bank: INR '+money(b.bank),'Cash: INR '+money(b.cash),'Investment Cash: INR '+money(b.investmentCash),'Stocks: INR '+money(b.stocks),'Mutual Funds: INR '+money(b.mfs),'Net Worth: INR '+money(netWorth(b)),'','','INCOME & EXPENSES'];reportRows().forEach(x=>lines.push(`${x.date} | ${x.k} | ${x.name} | ${x.category} | ${x.account} | ${x.k==='Income'?'+':'-'}INR ${money(x.amount)}`));lines.push('','','LOANS');S.loans.forEach(x=>lines.push(`${x.date} | ${x.type==='lent'?'Lent':'Borrowed'} | ${x.person} | ${x.account} | INR ${money(Math.max(0,n(x.amount)-n(x.paid)))}`));const blob=makePDF(lines),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-money-report-'+today()+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function settings(){layout(`<section class="section"><h2>Settings</h2><div class="list"><button onclick="openTransfer()">⇄ Transfer Money</button><button class="secondary" onclick="openBalances()">Opening / Current / Closing Balances</button><button class="secondary" onclick="backup()">Backup Data</button><button class="secondary" onclick="$('restore').click()">Restore Backup</button><input id="restore" type="file" accept="application/json" style="display:none" onchange="restoreFile(event)"><button class="danger" onclick="resetApp()">Reset App Data</button></div><div class="notice" style="margin-top:14px">Backup includes income, expenses, loans, transfers, opening balance and monthly history.</div></section>`)}
function backup(){const blob=new Blob([JSON.stringify({app:'My Money',version:1,data:S},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-money-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restoreFile(e){const file=e.target.files?.[0];if(!file)return;try{const raw=await file.text(),j=JSON.parse(raw),data=j.data||j;if(!data||typeof data!=='object')throw Error();S=normalize(data);rolloverIfNeeded();await persist();alert('Backup restored successfully.')}catch(err){alert('Invalid My Money backup file.')}}
async function resetApp(){if(!confirm('Delete all My Money data from this device? This cannot be undone unless you have a backup.'))return;S=normalize(null);localStorage.removeItem(KEY);try{const db=await openDB();if(db)db.transaction('state','readwrite').objectStore('state').delete('main')}catch(e){}render()}
function render(){try{({home,transactions,loans,reports,settings}[page]||home)()}catch(e){console.error(e);$('app').innerHTML='<section class="section"><div class="card"><h2>My Money could not load</h2><p>Please refresh the app. Your saved data has not been deleted.</p></div></section>'+nav()}}
function go(p){page=p;render()}
window.addEventListener('DOMContentLoaded',()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=1').catch(()=>{});boot()});
</script>
</body>
</html>
