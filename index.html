<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="My Money"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>My Money</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111318;--muted:#737780;--line:#e8e9ed;--accent:#111318;--green:#16844b;--red:#d94b4b;--blue:#356df3;--shadow:0 10px 30px rgba(15,18,25,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:calc(18px + env(safe-area-inset-top)) 20px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:24px;letter-spacing:-.8px}.date{font-size:13px;color:var(--muted)}.hero{margin:8px 16px 14px;background:#111318;color:#fff;border-radius:28px;padding:22px;box-shadow:var(--shadow)}.hero .label{color:#aeb2ba;font-size:13px}.net{font-size:38px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 18px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini div{background:rgba(255,255,255,.08);padding:11px;border-radius:16px}.mini b{display:block;font-size:15px}.mini span{font-size:11px;color:#aeb2ba}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 12px}.action{background:var(--card);border:1px solid var(--line);padding:14px;border-radius:18px;text-align:left;box-shadow:0 5px 18px rgba(15,18,25,.04)}.action strong{display:block}.action small{color:var(--muted)}.section{padding:0 16px;margin-top:10px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section-head h2{font-size:18px;margin:0}.link{color:var(--blue);background:none;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}.amount{font-size:22px;font-weight:800}.muted{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#f0f1f4}.txmain{flex:1;min-width:0}.txmain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.txmain small{color:var(--muted)}.pos{color:var(--green)}.neg{color:var(--red)}.groww{background:linear-gradient(135deg,#eafff4,#fff);}.empty{text-align:center;color:var(--muted);padding:20px}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px max(16px,calc((100vw - 560px)/2 + 16px)) calc(8px + env(safe-area-inset-bottom));z-index:10}.nav{display:grid;grid-template-columns:repeat(4,1fr);align-items:center}.nav button{background:none;color:var(--muted);font-size:11px;padding:5px}.nav .plus{background:#111318;color:#fff;width:50px;height:50px;border-radius:18px;margin:auto;font-size:26px;line-height:1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.handle{width:40px;height:4px;background:#d6d7dc;border-radius:5px;margin:0 auto 18px}.sheet h2{margin:0 0 16px}.form{display:grid;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input,.field select{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fafbfc;outline:none}.primary{width:100%;background:#111318;color:#fff;padding:15px;border-radius:15px;font-weight:700}.secondary{width:100%;background:#f0f1f4;color:#111318;padding:14px;border-radius:15px}.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.seg button{padding:11px;border-radius:12px;background:#f0f1f4}.seg .on{background:#111318;color:#fff}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:#111318;color:#fff;padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.install{background:#eef3ff;color:#2457d6;border-radius:16px;padding:13px;font-size:13px;margin:0 16px 12px}.hidden{display:none!important}@media(min-width:700px){.bottom{left:50%;right:auto;width:560px;transform:translateX(-50%)} }
</style></head><body><main class="app"><header class="top"><div class="brand">My Money</div><div class="date" id="today"></div></header><div id="install" class="install hidden">For the best experience on iPhone, tap <b>Share → Add to Home Screen</b>.</div><section class="hero"><div class="label">Total net worth</div><div class="net" id="net">₹0</div><div class="mini"><div><b id="bank">₹0</b><span>Bank</span></div><div><b id="cash">₹0</b><span>Cash</span></div><div><b id="groww">₹0</b><span>Groww</span></div></div></section><div class="actions"><button class="action" onclick="openTx('expense')"><strong>− Add expense</strong><small>Record spending</small></button><button class="action" onclick="openTx('income')"><strong>＋ Add income</strong><small>Record money received</small></button></div><section class="section"><div class="section-head"><h2>This month</h2><button class="link" onclick="openTx('transfer')">Transfer money</button></div><div class="grid"><div class="card"><div class="muted">Spent</div><div class="amount neg" id="monthExp">₹0</div></div><div class="card"><div class="muted">Income</div><div class="amount pos" id="monthInc">₹0</div></div></div></section><section class="section"><div class="section-head"><h2>Groww</h2><button class="link" onclick="editGroww()">Update</button></div><div class="card groww"><div class="muted">Portfolio value</div><div class="amount" id="growwBig">₹0</div><div class="muted" id="growwNote">Manual balance</div></div></section><section class="section"><div class="section-head"><h2>Recent transactions</h2><button class="link" onclick="showAll()">See all</button></div><div class="card" id="recent"></div></section></main><nav class="bottom"><div class="nav"><button onclick="home()">⌂<br>Home</button><button onclick="showAll()">☷<br>Transactions</button><button class="plus" onclick="openTx('expense')">+</button><button onclick="settings()">⚙<br>Settings</button></div></nav><div class="modal" id="modal"><div class="sheet"><div class="handle"></div><h2 id="modalTitle">Add expense</h2><form class="form" id="form"><div id="typeSeg" class="seg"><button type="button" data-type="expense" onclick="setType('expense')">Expense</button><button type="button" data-type="income" onclick="setType('income')">Income</button></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required placeholder="₹ 0"></div><div class="field" id="catField"><label>Category</label><select id="category"><option>Food & Dining</option><option>Shopping</option><option>Travel</option><option>Fuel</option><option>Bills & Recharge</option><option>Entertainment</option><option>Health</option><option>Education</option><option>Business</option><option>Other</option></select></div><div class="field"><label>Account</label><select id="account"><option value="bank">Bank</option><option value="cash">Cash</option><option value="groww">Groww</option></select></div><div class="field"><label>Note</label><input id="note" maxlength="80" placeholder="Optional"></div><div class="field"><label>Date</label><input id="date" type="date"></div><button class="primary" type="submit">Save</button><button class="secondary" type="button" onclick="closeModal()">Cancel</button></form></div></div><div class="modal" id="lockModal" style="z-index:50"><div class="sheet"><div class="handle"></div><h2>🔐 Unlock My Money</h2><div class="field"><label>Enter PIN</label><input id="unlockPin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" autofocus></div><button class="primary" onclick="unlock()">Unlock</button><div class="muted" style="text-align:center;margin-top:10px">Your data stays on this device.</div></div></div><div class="modal" id="securityModal"><div class="sheet"><div class="handle"></div><h2>Security & Backup</h2><div class="form"><button class="primary" type="button" onclick="setPin()">🔐 Set / Change PIN</button><button class="secondary" type="button" onclick="exportData()">⬇️ Backup my data</button><button class="secondary" type="button" onclick="document.getElementById('importFile').click()">⬆️ Restore backup</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"><button class="secondary" type="button" onclick="closeSecurity()">Close</button></div></div></div><div class="toast" id="toast"></div><script>
const KEY='mymoney-v2';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{balances:{bank:0,cash:0,groww:0},tx:[]};let mode='expense';
const ₹=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const today=new Date().toISOString().slice(0,10);document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});document.getElementById('date').value=today;
function render(){let b=db.balances;document.getElementById('bank').textContent=₹(b.bank);document.getElementById('cash').textContent=₹(b.cash);document.getElementById('groww').textContent=₹(b.groww);document.getElementById('growwBig').textContent=₹(b.groww);document.getElementById('net').textContent=₹(b.bank+b.cash+b.groww);let m=new Date().toISOString().slice(0,7),ex=0,inc=0;db.tx.forEach(t=>{if(t.date.slice(0,7)===m){if(t.type==='expense')ex+=t.amount;if(t.type==='income')inc+=t.amount}});document.getElementById('monthExp').textContent=₹(ex);document.getElementById('monthInc').textContent=₹(inc);let r=document.getElementById('recent');let arr=db.tx.slice().sort((a,b)=>b.created-a.created).slice(0,8);r.innerHTML=arr.length?arr.map(t=>`<div class="tx"><div class="ico">${t.type==='expense'?'−':t.type==='income'?'+':'↔'}</div><div class="txmain"><b>${esc(t.note||t.category||t.type)}</b><small>${esc(t.category||'Transfer')} · ${t.date} · ${t.account}</small></div><strong class="${t.type==='expense'?'neg':'pos'}">${t.type==='expense'?'−':'+'}${₹(t.amount)}</strong></div>`).join(''):'<div class="empty">No transactions yet.</div>'}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openTx(t){mode=t;document.getElementById('modal').classList.add('show');document.getElementById('modalTitle').textContent=t==='transfer'?'Transfer money':t==='income'?'Add income':'Add expense';document.getElementById('typeSeg').classList.toggle('hidden',t==='transfer');document.getElementById('catField').classList.toggle('hidden',t==='transfer');document.getElementById('amount').value='';document.getElementById('note').value='';document.getElementById('date').value=today;setType(t==='income'?'income':'expense');if(t==='transfer')document.getElementById('account').innerHTML='<option value="bank">Bank → Cash</option><option value="cash">Cash → Bank</option><option value="bankgroww">Bank → Groww</option><option value="growwbank">Groww → Bank</option>'}function setType(t){if(mode==='transfer')return;mode=t;document.querySelectorAll('#typeSeg button').forEach(x=>x.classList.toggle('on',x.dataset.type===t))}function closeModal(){document.getElementById('modal').classList.remove('show');document.getElementById('account').innerHTML='<option value="bank">Bank</option><option value="cash">Cash</option><option value="groww">Groww</option>'}
document.getElementById('form').onsubmit=e=>{e.preventDefault();let amount=Number(document.getElementById('amount').value),acc=document.getElementById('account').value,date=document.getElementById('date').value,note=document.getElementById('note').value.trim();if(!amount||amount<=0)return; if(mode==='transfer'){let [from,to]=acc==='bank'?["bank","cash"]:acc==='cash'?["cash","bank"]:acc==='bankgroww'?["bank","groww"]:["groww","bank"];if(db.balances[from]<amount){toast('Not enough balance');return}db.balances[from]-=amount;db.balances[to]+=amount;db.tx.push({type:'transfer',amount,date,note:note||`${from} → ${to}`,account:`${from} → ${to}`,created:Date.now()});}else{if(mode==='expense'){if(db.balances[acc]<amount){toast('Not enough balance');return}db.balances[acc]-=amount}else db.balances[acc]+=amount;db.tx.push({type:mode,amount,date,note,category:mode==='expense'?document.getElementById('category').value:'Income',account:acc,created:Date.now()})}save();closeModal();toast('Saved')};
function editGroww(){let v=prompt('Enter your current Groww portfolio value',db.balances.groww);if(v!==null&&!isNaN(Number(v))){db.balances.groww=Number(v);save();toast('Groww balance updated')}}function showAll(){let list=db.tx.slice().sort((a,b)=>b.created-a.created);alert(list.length?list.map(t=>`${t.date}  ${t.type.toUpperCase()}  ${₹(t.amount)}  ${t.note||t.category||''}`).join('\n'):'No transactions yet.')}function settings(){document.getElementById('securityModal').classList.add('show')}
function closeSecurity(){document.getElementById('securityModal').classList.remove('show')}
function setPin(){let p=prompt('Create a 4–6 digit PIN. Leave blank to remove the PIN.');if(p===null)return;if(p===''){delete db.pin;save();toast('PIN removed');return}if(!/^\d{4,6}$/.test(p)){toast('PIN must be 4–6 digits');return}db.pin=p;save();toast('PIN enabled');closeSecurity()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-money-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup created')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.balances||!Array.isArray(x.tx))throw Error();if(confirm('Restore this backup? Your current data will be replaced.')){db=x;save();toast('Backup restored')}}catch(_){toast('Invalid backup file')}e.target.value=''};r.readAsText(f)}
function unlock(){let p=document.getElementById('unlockPin').value;if(p===db.pin){document.getElementById('lockModal').classList.remove('show');document.getElementById('unlockPin').value='';render()}else toast('Incorrect PIN')}function home(){scrollTo({top:0,behavior:'smooth'})}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();document.getElementById('install').classList.remove('hidden')});if(db.pin)document.getElementById('lockModal').classList.add('show');else render();
</script></body></html>
