</style></head><body><div id="app"></div><div id="modal" class="modal hidden"></div><script>
'use strict';
const KEY='mymoney_clean_v1';
const defaults={bank:0,cash:0,investmentCash:0,stocksTotal:0,mfsTotal:0,income:[],expenses:[],loans:[],transfers:[],opening:{},closing:{},_savedAt:0};
let S=null,page='home';
function migrateState(s){s={...structuredClone(defaults),...(s||{})};s.loans=Array.isArray(s.loans)?s.loans:[];s.income=Array.isArray(s.income)?s.income:[];s.income.forEach(normalizeIncome);s.expenses=Array.isArray(s.expenses)?s.expenses:[];s.transfers=Array.isArray(s.transfers)?s.transfers:[];s.opening=s.opening&&typeof s.opening==='object'?s.opening:{};s.closing=s.closing&&typeof s.closing==='object'?s.closing:{};
if(!Number.isFinite(Number(s.stocksTotal))){let a=[...(Array.isArray(s.opening.stocks)?s.opening.stocks:[]),...(Array.isArray(s.stocks)?s.stocks:[])];s.stocksTotal=a.reduce((t,x)=>t+n(x.qty)*n(x.price||x.avg),0)}
if(!Number.isFinite(Number(s.mfsTotal))){let a=[...(Array.isArray(s.opening.mfs)?s.opening.mfs:[]),...(Array.isArray(s.mfs)?s.mfs:[])];s.mfsTotal=a.reduce((t,x)=>t+n(x.units)*n(x.nav||x.avg),0)}
if(!Number.isFinite(Number(s.investmentCash)))s.investmentCash=0;
s.opening.stocksTotal=Number.isFinite(Number(s.opening.stocksTotal))?n(s.opening.stocksTotal):((Array.isArray(s.opening.stocks)?s.opening.stocks:[]).reduce((t,x)=>t+n(x.qty)*n(x.price||x.avg),0));
s.opening.mfsTotal=Number.isFinite(Number(s.opening.mfsTotal))?n(s.opening.mfsTotal):((Array.isArray(s.opening.mfs)?s.opening.mfs:[]).reduce((t,x)=>t+n(x.units)*n(x.nav||x.avg),0));
if(!s.opening.date)s.opening.date=today();
delete s.stocks;delete s.mfs;delete s.investmentTx;delete s.legacyInvestments;delete s.splitwise;return s}
function load(){try{return migrateState(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return migrateState(null)}}
const DB_NAME='mymoney_persistent_v1',DB_STORE='state',DB_KEY='main';let idbPromise=null;
function openDB(){if(!('indexedDB' in window))return Promise.resolve(null);if(idbPromise)return idbPromise;idbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB_STORE))r.result.createObjectStore(DB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}).catch(()=>null);return idbPromise}
async function idbGet(){try{const db=await openDB();if(!db)return null;return await new Promise((res,rej)=>{const r=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).get(DB_KEY);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}catch(e){return null}}
async function idbPut(data){try{const db=await openDB();if(!db)return;await new Promise((res,rej)=>{const r=db.transaction(DB_STORE,'readwrite').objectStore(DB_STORE).put(data,DB_KEY);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}catch(e){}}
async function recoverPersistentState(){const local=load(),saved=await idbGet();if(saved&&saved.data&&n(saved.savedAt)>n(local._savedAt)){S=migrateState(saved.data);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}else{idbPut({savedAt:n(local._savedAt)||Date.now(),data:local})}}
function save(){syncBalances();S._savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}idbPut({savedAt:S._savedAt,data:S});render()}
function persistNow(){S._savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}idbPut({savedAt:S._savedAt,data:S})}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function n(v){return Number.isFinite(Number(v))?Number(v):0}
function money(v){return '₹'+n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
const expenseCategories=[['🍔','Food'],['💊','Medicine & Health'],['💨','Cigg'],['🏸','Sports'],['📱','Recharge & Bills'],['💇','Salon & Grooming'],['⛽','Petrol / Transport'],['📦','Others']];
const coreExpenseNames=new Set(expenseCategories.map(x=>x[1]));
const incomeCategories=['Bohra Fashion','Investment','Others'];
const incomeCategorySet=new Set(incomeCategories);

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function monthKey(d){return String(d||'').slice(0,7)}
function currentMonth(){return new Date().toISOString().slice(0,7)}
function loanReceivable(){return S.loans.filter(x=>x.type==='lent').reduce((a,x)=>a+Math.max(0,n(x.amount)-n(x.paid)),0)}
function loanPayable(){return S.loans.filter(x=>x.type==='borrowed').reduce((a,x)=>a+Math.max(0,n(x.amount)-n(x.paid)),0)}
function netWorth(){return n(S.bank)+n(S.cash)+n(S.investmentCash)+n(S.stocksTotal)+n(S.mfsTotal)+loanReceivable()-loanPayable()}
function thisMonth(){const m=currentMonth();return {income:S.income.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0),expense:S.expenses.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0)}}
function nav(){return `<nav class="nav">${[['home','⌂','Home'],['transactions','☷','Transactions'],['loans','◉','Loans'],['reports','▤','Reports'],['settings','⚙','Settings']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function layout(c){document.getElementById('app').innerHTML=`<div class="wrap">${c}</div>${nav()}`}
function home(){syncBalances();const m=thisMonth();layout(`<div class="top luxury-top"><div class="brand-row"><div><h1>My Money</h1><small>Private wealth & personal finance</small></div><button class="top-balance" onclick="openBalances()">Balances</button></div></div><div class="cards"><div class="card hero-card"><div class="label">Net Worth</div><b>${money(netWorth())}</b></div><div class="card"><div class="label">Bank</div><b>${money(S.bank)}</b></div><div class="card"><div class="label">Cash</div><b>${money(S.cash)}</b></div><div class="card"><div class="label">Investment Cash</div><b>${money(S.investmentCash)}</b></div><div class="card"><div class="label">Stocks</div><b>${money(S.stocksTotal)}</b></div><div class="card"><div class="label">Mutual Funds</div><b>${money(S.mfsTotal)}</b></div></div><section class="section"><div class="grid"><button class="action" onclick="openAdd('expense')">−<br>Add Expense</button><button class="action" onclick="openAdd('income')">＋<br>Add Income</button><button class="action" onclick="openTransfer()">⇄<br>Transfer</button><button class="action" onclick="openLoan()">💰<br>Add Loan</button></div></section><section class="section"><h2>This Month</h2><div class="grid"><div class="card"><div class="label">Income</div><b class="income">${money(m.income)}</b></div><div class="card"><div class="label">Spent</div><b class="expense">${money(m.expense)}</b></div></div></section><section class="section"><h2>Loans</h2><div class="grid"><div class="card"><div class="label">Loan owed to me</div><b>${money(loanReceivable())}</b></div><div class="card"><div class="label">Loan I owe</div><b>${money(loanPayable())}</b></div></div></section><section class="section"><h2>Recent Transactions</h2>${recentHTML()}</section>`) }
function recentHTML(){const a=[...S.income.map(x=>({...x,kind:'Income',sort:x.date})),...S.expenses.map(x=>({...x,kind:'Expense',sort:x.date})),...S.loans.map(x=>({...x,kind:x.type==='lent'?'Loan Lent':'Loan Borrowed',sort:x.date}))].sort((a,b)=>String(b.sort).localeCompare(String(a.sort))).slice(0,8);return a.length?`<div class="list">${a.map(x=>{if(x.kind==='Income'||x.kind==='Expense')return `<div class="row"><div><b>${esc(x.category||x.kind)}</b><div class="meta">${esc(x.date)} · ${esc(x.account||'')}</div></div><div class="money ${x.kind==='Income'?'income':'expense'}">${x.kind==='Income'?'+':'−'}${money(x.amount)}</div></div>`;return `<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${esc(x.kind)} · ${esc(x.date)}</div></div><div class="money">${x.type==='lent'?'+':'−'}${money(Math.max(0,n(x.amount)-n(x.paid)))}</div></div>`}).join('')}</div>`:'<div class="empty">No recent entries.</div>'}
function transactions(){const all=[...S.income.map(x=>({...x,kind:'income'})),...S.expenses.map(x=>({...x,kind:'expense'})),...S.loans.map(x=>({...x,kind:'loan'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));layout(`<section class="section"><h2>Transactions</h2><div class="notice">Income, expenses and loans appear here. Transfers are recorded separately.</div><div class="list" style="margin-top:12px">${all.length?all.map(x=>{if(x.kind==='loan')return `<div class="row"><div><b>Loan · ${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe me':'I owe them'} · ${esc(x.date)} · ${esc(x.account||'')} · ${Math.max(0,n(x.amount)-n(x.paid))<=0?'CLEARED':'Outstanding'}</div></div><div style="text-align:right"><div class="money">${money(Math.max(0,n(x.amount)-n(x.paid)))}</div><div style="margin-top:7px"><button class="mini secondary" onclick="editLoan('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteLoan('${x.id}')">Delete</button></div></div></div>`;return `<div class="row"><div><b>${x.kind==='expense'?(esc(x.expenseName||x.note||'Expense')):esc(x.category||'Income')}</b><div class="meta">${x.kind==='expense'?((expenseCategories.find(c=>c[1]===x.category)?.[0]||'📦')+' '+esc(x.category||'Others')+' · '):''}${esc(x.date)} · ${esc(x.account||'')}</div></div><div style="text-align:right"><div class="money ${x.kind==='income'?'income':'expense'}">${x.kind==='income'?'+':'−'}${money(x.amount)}</div><div style="margin-top:7px"><button class="mini secondary" onclick="editTxn('${x.kind}','${x.id}')">Edit</button> <button class="mini danger" onclick="deleteTxn('${x.kind}','${x.id}')">Delete</button></div></div></div>`}).join(''):'<div class="empty">No transactions.</div>'}</div></section>`)}
function expenseCategorySummary(){const m=currentMonth();const groups={};S.expenses.filter(x=>monthKey(x.date)===m).forEach(x=>{const k=coreExpenseNames.has(x.category)?x.category:'Others';(groups[k]??=[]).push(x)});const entries=Object.entries(groups).sort((a,b)=>b[1].reduce((s,x)=>s+n(x.amount),0)-a[1].reduce((s,x)=>s+n(x.amount),0));return entries.length?`<div class="card" style="margin-bottom:14px"><div class="label">This Month Expenses by Category</div><div class="list" style="margin-top:8px">${entries.map(([k,items])=>{const total=items.reduce((s,x)=>s+n(x.amount),0);const cat=expenseCategories.find(c=>c[1]===k);return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="padding:0;border:0"><div><b>${cat?cat[0]+' ':''}${esc(k)}</b></div><div class="money expense">${money(total)}</div></div><div class="meta" style="margin-top:7px">${items.map(x=>`${esc(x.expenseName||'Expense')} · ${money(x.amount)} · ${esc(x.account||'')}`).join('<br>')}</div></div>`}).join('')}</div></div>`:'<div class="empty">No expenses this month.</div>'}
function incomeCategorySummary(){const m=currentMonth();const groups={};S.income.filter(x=>monthKey(x.date)===m).forEach(x=>{const k=incomeCategorySet.has(x.category)?x.category:'Others';(groups[k]??=[]).push(x)});const entries=Object.entries(groups).sort((a,b)=>b[1].reduce((s,x)=>s+n(x.amount),0)-a[1].reduce((s,x)=>s+n(x.amount),0));return entries.length?`<div class="card" style="margin-bottom:14px"><div class="label">This Month Income by Category</div><div class="list" style="margin-top:8px">${entries.map(([k,items])=>{const total=items.reduce((s,x)=>s+n(x.amount),0);return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="padding:0;border:0"><div><b>${esc(k)}</b></div><div class="money income">${money(total)}</div></div><div class="meta" style="margin-top:7px">${items.map(x=>`${esc(x.incomeName||'Income')} · ${money(x.amount)} · ${esc(x.account||'')}`).join('<br>')}</div></div>`}).join('')}</div></div>`:'<div class="empty">No income this month.</div>'}
function reportTxHTML(){const a=[...S.income.map(x=>({...x,kind:'Income'})),...S.expenses.map(x=>({...x,kind:'Expense'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return a.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${x.kind==='Expense'?esc(x.expenseName||'Expense'):esc(x.incomeName||x.category||'Income')}</b><div class="meta">${x.kind==='Expense'?((expenseCategories.find(c=>c[1]===x.category)?.[0]||'📦')+' '+esc(x.category||'Others')+' · '):esc(x.category||'Others')+' · '}${esc(x.date)} · ${esc(x.account||'')}</div></div><div class="money ${x.kind==='Income'?'income':'expense'}">${x.kind==='Income'?'+':'−'}${money(x.amount)}</div></div>`).join('')}</div>`:'<div class="empty">No transactions.</div>'}

function pdfEscape(v){return String(v??'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[\r\n]+/g,' ')}
function makePdf(lines){const pageLines=44, pages=[];for(let i=0;i<lines.length;i+=pageLines)pages.push(lines.slice(i,i+pageLines));if(!pages.length)pages.push(['My Money Report']);const objs=[];const kids=[];const add=o=>{objs.push(o);return objs.length};const catalog=add(null),pagesObj=add(null),font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');for(const pg of pages){const content=['BT','/F1 10 Tf','40 790 Td'];pg.forEach((line,i)=>{if(i)content.push('0 -16 Td');content.push(`(${pdfEscape(line)}) Tj`)});content.push('ET');const stream=content.join('\n');const c=add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);const page=add(`<< /Type /Page /Parent ${pagesObj} 0 R /MediaBox [0 0 612 842] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${c} 0 R >>`);kids.push(`${page} 0 R`)}objs[catalog-1]=`<< /Type /Catalog /Pages ${pagesObj} 0 R >>`;objs[pagesObj-1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;let out='%PDF-1.4\n%âãÏÓ\n',offsets=[0];objs.forEach((o,i)=>{offsets[i+1]=out.length;out+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=out.length;out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<=objs.length;i++)out+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';out+=`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xref}\n%%EOF`;return new Blob([out],{type:'application/pdf'})}
function generatePdf(){try{const m=thisMonth(),rows=[...S.income.map(x=>({date:x.date,type:'Income',name:x.incomeName||x.category||'Income',cat:x.category||'Others',account:x.account||'',amount:n(x.amount)})),...S.expenses.map(x=>({date:x.date,type:'Expense',name:x.expenseName||'Expense',cat:x.category||'Others',account:x.account||'',amount:-n(x.amount)}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));const lines=['MY MONEY','Financial Report - '+currentMonth(),'','SUMMARY','Income: INR '+money(m.income),'Expenses: INR '+money(m.expense),'Investment Cash: INR '+money(S.investmentCash),'Stocks: INR '+money(S.stocksTotal),'Mutual Funds: INR '+money(S.mfsTotal),'','INCOME & EXPENSES','Date | Type | Name / Category | Account | Amount'];rows.forEach(r=>lines.push(`${r.date} | ${r.type} | ${r.name} / ${r.cat} | ${r.account} | ${r.amount>=0?'+':'-'}INR ${money(Math.abs(r.amount))}`));lines.push('','','LOANS','Date | Type | Person | Account | Outstanding');S.loans.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).forEach(x=>lines.push(`${x.date} | ${x.type==='lent'?'Lent':'Borrowed'} | ${x.person} | ${x.account||''} | INR ${money(Math.max(0,n(x.amount)-n(x.paid)))}`));lines.push('','','BALANCES','Bank: INR '+money(S.bank),'Cash: INR '+money(S.cash),'Investment Cash: INR '+money(S.investmentCash),'Stocks: INR '+money(S.stocksTotal),'Mutual Funds: INR '+money(S.mfsTotal),'Net Worth: INR '+money(netWorth()));const blob=makePdf(lines),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-money-report-'+today()+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);alert('PDF generated successfully. Check your Downloads/Files folder or the Safari download indicator.')}catch(e){alert('Could not generate PDF. Please try again.')}}

function saveTxn(e,type,editId=null){
 e.preventDefault();
 try{
  const form=e.currentTarget||e.target;
  const get=id=>form.querySelector('#'+id);
  const amountEl=get('amount'), accountEl=get('account'), dateEl=get('date');
  const categoryEl=type==='income'?get('incomeCategory'):get('category');
  if(!amountEl||!accountEl||!dateEl||!categoryEl) throw new Error('form');
  let category=String(categoryEl.value||'').trim();
  if(type==='expense'&&!category) category='Others';
  if(type==='income'&&!incomeCategorySet.has(category)) category='Others';
  const expenseName=type==='expense'?(get('expenseName')?.value||'Expense').trim():undefined;
  const incomeName=type==='income'?(get('incomeName')?.value||'').trim():undefined;
  const amount=n(amountEl.value);
  if(!(amount>0)||!accountEl.value||!dateEl.value) throw new Error('fields');
  if(type==='expense'&&!coreExpenseNames.has(category)) category='Others';
  const x={id:editId||id(),amount,category,expenseName,incomeName,account:accountEl.value,date:dateEl.value};
  const arr=type==='income'?S.income:S.expenses;
  if(editId){const i=arr.findIndex(a=>a.id===editId);if(i<0)throw new Error('entry');applyTxnCash(arr[i],type,-1);arr[i]=x;applyTxnCash(x,type,1)}
  else{arr.push(x);applyTxnCash(x,type,1)}
  closeModal();save();
 }catch(err){console.error(err);alert('Could not save this entry. Please check the amount, category, account and date.')}
}

function applyLoanCash(x,dir=1){const delta=loanCashEffect(x)*dir;if(x.account==='Bank')S.bank+=delta;else if(x.account==='Cash')S.cash+=delta;else S.investmentCash+=delta}
function saveLoan(e,editId){e.preventDefault();const old=editId?S.loans.find(a=>a.id===editId):null;const entryType=editId?(document.getElementById('entryType')?.value||'loan'):'loan';const person=document.getElementById('person').value;const type=document.getElementById('type').value;const account=document.getElementById('account').value;const amount=n(document.getElementById('amount').value);const date=document.getElementById('date').value;if(editId&&entryType!=='loan'&&old){const outstanding=Math.max(0,n(old.amount)-n(old.paid));applyLoanCash(old,-1);S.loans=S.loans.filter(a=>a.id!==editId);if(entryType==='expense'){const tx={id:id(),amount:outstanding,category:'Others',expenseName:person||'Expense',account,date};S.expenses.push(tx);applyTxnCash(tx,'expense',1)}else{const cat=document.getElementById('loanIncomeCategory')?.value||'Others';const incomeName=document.getElementById('incomeName-loanIncomeCategory')?.value||'';const tx={id:id(),amount:outstanding,category:incomeCategorySet.has(cat)?cat:'Others',incomeName,account,date};S.income.push(tx);applyTxnCash(tx,'income',1)}closeModal();save();return}const x={id:editId||id(),person,type,account,amount,paid:editId?Math.min(n(old?.paid),amount):0,date};if(editId){const i=S.loans.findIndex(a=>a.id===editId);if(i<0)return;applyLoanCash(old,-1);x.repayments=old.repayments||[];S.loans[i]=x;applyLoanCash(x,1)}else{S.loans.push(x);applyLoanCash(x,1)}closeModal();save()}

function transfer(e){e.preventDefault();const f=document.getElementById('from').value,t=document.getElementById('to').value,a=n(document.getElementById('amount').value);if(f===t){alert('Choose different accounts');return}const vals={Bank:S.bank,Cash:S.cash,'Investment Cash':S.investmentCash,Stocks:S.stocksTotal,'Mutual Funds':S.mfsTotal};if(vals[f]<a){alert('Insufficient balance');return}const key={Bank:'bank',Cash:'cash','Investment Cash':'investmentCash',Stocks:'stocksTotal','Mutual Funds':'mfsTotal'};S[key[f]]-=a;S[key[t]]+=a;S.transfers.push({id:id(),from:f,to:t,amount:a,date:today()});closeModal();save()}
function inPeriod(d,start,end){const x=String(d||'');return !!x&&x>=start&&x<=end}
function calcBalances(start,end,base){const b={bank:n(base.bank),cash:n(base.cash),investmentCash:n(base.investmentCash),stocks:n(base.stocksTotal),mfs:n(base.mfsTotal)};
 for(const x of S.income||[]){if(!inPeriod(x.date,start,end))continue;const a=n(x.amount);if(x.account==='Bank')b.bank+=a;else if(x.account==='Cash')b.cash+=a;else b.investmentCash+=a}
 for(const x of S.expenses||[]){if(!inPeriod(x.date,start,end))continue;const a=n(x.amount);if(x.account==='Bank')b.bank-=a;else if(x.account==='Cash')b.cash-=a;else b.investmentCash-=a}
 for(const x of S.transfers||[]){if(!inPeriod(x.date,start,end))continue;const a=n(x.amount),map={Bank:'bank',Cash:'cash','Investment Cash':'investmentCash',Stocks:'stocks','Mutual Funds':'mfs'};const fk=map[x.from],tk=map[x.to];if(fk)b[fk]-=a;if(tk)b[tk]+=a}
 for(const x of S.loans||[]){if(inPeriod(x.date,start,end)){const a=n(x.amount),k=x.account==='Bank'?'bank':x.account==='Cash'?'cash':'investmentCash';b[k]+=x.type==='lent'?-a:a}
  for(const r of (x.repayments||[])){if(!inPeriod(r.date,start,end))continue;const a=n(r.amount),k=r.account==='Bank'?'bank':r.account==='Cash'?'cash':'investmentCash';b[k]+=x.type==='lent'?a:-a}
 }
 return b}
function syncBalances(){const now=today(),m=monthKey(now);if(!S.opening||!S.opening.date){S.opening={date:m+'-01',bank:n(S.bank),cash:n(S.cash),investmentCash:n(S.investmentCash),stocksTotal:n(S.stocksTotal),mfsTotal:n(S.mfsTotal)}}
 const start=S.opening.date;
 if(monthKey(start)!==m){const prevEnd=new Date(new Date(now+'T00:00:00').getFullYear(),new Date(now+'T00:00:00').getMonth(),0).toISOString().slice(0,10);const prev=calcBalances(start,prevEnd,S.opening);S.closing={date:prevEnd,bank:prev.bank,cash:prev.cash,investmentCash:prev.investmentCash,stocks:prev.stocks,mfs:prev.mfs};S.opening={date:m+'-01',bank:prev.bank,cash:prev.cash,investmentCash:prev.investmentCash,stocksTotal:prev.stocks,mfsTotal:prev.mfs}}
 const cur=calcBalances(S.opening.date,now,S.opening);S.bank=cur.bank;S.cash=cur.cash;S.investmentCash=cur.investmentCash;S.stocksTotal=cur.stocks;S.mfsTotal=cur.mfs;S.closing={date:now,bank:cur.bank,cash:cur.cash,investmentCash:cur.investmentCash,stocks:cur.stocks,mfs:cur.mfs}}

function openBalances(){syncBalances();const o=S.opening||{},c=S.closing||{},hand=n(c.bank)+n(c.cash),liquid=hand+n(c.investmentCash),invest=n(c.stocks)+n(c.mfs),nw=liquid+invest+loanReceivable()-loanPayable();modal('Opening / Closing Balance',`<div class="balance-modal"><div class="balance-card"><div class="balance-title"><div><b>Opening Balance</b><div class="balance-sub">${esc(o.date||'')}</div></div><button class="mini secondary" onclick="editOpeningBalance()">Edit</button></div><div class="balance-grid"><div class="balance-item"><div class="k">Bank</div><div class="v">${money(o.bank)}</div></div><div class="balance-item"><div class="k">Cash</div><div class="v">${money(o.cash)}</div></div><div class="balance-item"><div class="k">Investment Cash</div><div class="v">${money(o.investmentCash)}</div></div><div class="balance-item"><div class="k">Stocks</div><div class="v">${money(o.stocksTotal)}</div></div><div class="balance-item"><div class="k">Mutual Funds</div><div class="v">${money(o.mfsTotal)}</div></div><div class="balance-item highlight"><div class="k">Opening Total</div><div class="v">${money(n(o.bank)+n(o.cash)+n(o.investmentCash)+n(o.stocksTotal)+n(o.mfsTotal))}</div></div></div></div><div class="balance-card live"><div class="balance-title"><div><b>Current Balance</b><div class="balance-sub">Automatically calculated · ${esc(c.date||'')}</div></div><span class="live-badge">CURRENT</span></div><div class="balance-grid"><div class="balance-item"><div class="k">Bank</div><div class="v">${money(c.bank)}</div></div><div class="balance-item"><div class="k">Cash</div><div class="v">${money(c.cash)}</div></div><div class="balance-item"><div class="k">Investment Cash</div><div class="v">${money(c.investmentCash)}</div></div><div class="balance-item"><div class="k">Stocks</div><div class="v">${money(c.stocks)}</div></div><div class="balance-item"><div class="k">Mutual Funds</div><div class="v">${money(c.mfs)}</div></div><div class="balance-item highlight"><div class="k">Current Total</div><div class="v balance-total">${money(liquid+invest)}</div></div></div></div><div class="balance-card"><div class="balance-title"><b>Closing Balance</b></div><div class="balance-grid"><div class="balance-item"><div class="k">Closing Total</div><div class="v">${money(liquid+invest)}</div></div><div class="balance-item highlight"><div class="k">Net Worth</div><div class="v balance-total">${money(nw)}</div></div></div></div><div class="balance-note">The previous month's closing balance automatically becomes the next month's opening balance.</div><button class="secondary" onclick="closeModal()">Close</button></div>`)}
function openPrintReport(){const m=thisMonth();const rows=[...S.income.map(x=>({date:x.date,type:'Income',name:x.incomeName||x.category||'Income',cat:x.category||'Others',account:x.account||'',amount:n(x.amount)})),...S.expenses.map(x=>({date:x.date,type:'Expense',name:x.expenseName||'Expense',cat:x.category||'Others',account:x.account||'',amount:-n(x.amount)}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));const loanRows=[...S.loans].sort((a,b)=>String(b.date).localeCompare(String(a.date)));layout(`<section class="print-sheet"><div class="print-toolbar"><button class="secondary" onclick="go('reports')">← Back</button><button onclick="printReport()">Generate PDF</button></div><div class="print-header"><h1>My Money</h1><div>Financial Report · ${esc(currentMonth())}</div></div><div class="print-summary"><div><span>Income</span><b class="income">${money(m.income)}</b></div><div><span>Expenses</span><b class="expense">${money(m.expense)}</b></div><div><span>Investment Cash</span><b>${money(S.investmentCash)}</b></div><div><span>Stocks</span><b>${money(S.stocksTotal)}</b></div><div><span>Mutual Funds</span><b>${money(S.mfsTotal)}</b></div></div><h2>Income & Expenses</h2><div class="print-table"><div class="tr th"><b>Date</b><b>Type</b><b>Name / Category</b><b>Account</b><b>Amount</b></div>${rows.length?rows.map(r=>`<div class="tr"><span>${esc(r.date)}</span><span>${r.type}</span><span>${esc(r.name)} · ${esc(r.cat)}</span><span>${esc(r.account)}</span><span class="${r.amount>=0?'income':'expense'}">${r.amount>=0?'+':'−'}${money(Math.abs(r.amount))}</span></div>`).join(''):'<div class="empty">No transactions.</div>'}</div><h2>Loans</h2><div class="print-table">${loanRows.length?loanRows.map(x=>`<div class="tr"><span>${esc(x.date)}</span><span>${x.type==='lent'?'Lent':'Borrowed'}</span><span>${esc(x.person)}</span><span>${esc(x.account||'')}</span><span>${money(Math.max(0,n(x.amount)-n(x.paid)))}</span></div>`).join(''):'<div class="empty">No loans.</div>'}</div><h2>Balances</h2><div class="print-summary"><div><span>Bank</span><b>${money(S.bank)}</b></div><div><span>Cash</span><b>${money(S.cash)}</b></div><div><span>Investment Cash</span><b>${money(S.investmentCash)}</b></div><div><span>Stocks</span><b>${money(S.stocksTotal)}</b></div><div><span>Mutual Funds</span><b>${money(S.mfsTotal)}</b></div><div><span>Net Worth</span><b>${money(netWorth())}</b></div></div></section>`)}
function backup(){const blob=new Blob([JSON.stringify({version:2,app:'My Money',data:S},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-money-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{let raw=String(r.result||'').replace(/^\uFEFF/,'').trim();if(!raw)throw Error('empty');const j=JSON.parse(raw);let data=null;if(j&&typeof j==='object'&&!Array.isArray(j)){if(j.data&&typeof j.data==='object')data=j.data;else if(j.state&&typeof j.state==='object')data=j.state;else if(j.app==='My Money'||j.version||('bank' in j)||('cash' in j)||('income' in j)||('expenses' in j))data=j}if(!data||typeof data!=='object')throw Error('format');S={...structuredClone(defaults),...data};S.loans=Array.isArray(S.loans)?S.loans:[];S.income=Array.isArray(S.income)?S.income:[];S.income.forEach(normalizeIncome);S.expenses=Array.isArray(S.expenses)?S.expenses:[];S.expenses.forEach(normalizeExpense);S.transfers=Array.isArray(S.transfers)?S.transfers:[];delete S.stocks;delete S.mfs;delete S.investmentTx;delete S.legacyInvestments;S.opening=S.opening&&typeof S.opening==='object'?S.opening:{};S.closing=S.closing&&typeof S.closing==='object'?S.closing:{};delete S.splitwise;syncBalances();save();alert('Backup restored successfully')}catch(err){alert('Invalid backup file. Please select a My Money backup JSON file.')}};r.onerror=()=>alert('Could not read backup file');r.readAsText(f)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=10.30').catch(()=>{});
S=load();
recoverPersistentState();
render();
