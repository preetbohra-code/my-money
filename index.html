<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d4b3d"><link rel="manifest" href="manifest.webmanifest"><title>My Money V10.3</title><style>
:root{--green:#0d4b3d;--mint:#dff4e9;--cream:#f8f5ec;--ink:#17352e;--muted:#71807b;--red:#c94d4d;--line:#dfe5e1;--blue:#2d75d6}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;padding:12px 15px;background:var(--green);color:#fff;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:80px}.top{background:var(--green);color:white;padding:28px 20px 24px;border-radius:0 0 32px 32px}.top h1{margin:0 0 6px;font-size:28px}.top small{opacity:.8}.wrap{max-width:760px;margin:auto}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:-5px 16px 18px}.card{background:#fff;border:1px solid #e7e9e5;border-radius:20px;padding:16px;box-shadow:0 4px 14px #1231  .04}.card b{font-size:20px}.label{color:var(--muted);font-size:13px;margin-bottom:6px}.section{padding:0 16px;margin:18px auto;max-width:760px}.section h2{font-size:21px;margin:8px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.action{background:#fff;color:var(--blue);border:1px solid #e2e5e8;min-height:76px}.list{display:flex;flex-direction:column;gap:10px}.row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:12px}.row .meta{color:var(--muted);font-size:12px;margin-top:4px}.money{font-weight:800}.income{color:#18854e}.expense{color:var(--red)}.pill{display:inline-block;background:var(--mint);color:var(--green);padding:4px 8px;border-radius:99px;font-size:12px}.danger{background:#fff;color:var(--red);border:1px solid #f0cccc}.secondary{background:#fff;color:var(--green);border:1px solid #cbd8d3}.mini{padding:8px 10px;border-radius:10px;font-size:12px}.hidden{display:none!important}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;color:#7b8581;padding:8px 5px;font-size:11px}.nav button.active{color:var(--green)}.nav span{display:block;font-size:20px}.modal{position:fixed;z-index:30;inset:0;background:#0007;display:flex;align-items:flex-end}.sheet{background:var(--cream);width:100%;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px}.sheet h3{margin:0 0 14px}.form{display:grid;gap:10px}.form label{font-size:12px;color:var(--muted)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.tabs .selected{background:var(--green);color:#fff}.tabs button:not(.selected){background:#fff;color:var(--green);border:1px solid var(--line)}.invest-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.invest-cols>div,.invest-pl>div{display:flex;flex-direction:column;gap:3px}.invest-cols span,.invest-pl span,.invest-cols small,.invest-pl small{font-size:11px;color:var(--muted)}.invest-pl{min-width:150px;display:grid;gap:6px;text-align:right}.actions{white-space:nowrap}.notice{background:#eef7f2;border-radius:14px;padding:12px;color:var(--green);font-size:13px}.empty{padding:24px;text-align:center;color:var(--muted);background:#fff;border-radius:16px;border:1px dashed var(--line)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div id="app"></div><div id="modal" class="modal hidden"></div><script>
'use strict';
const KEY='mymoney_clean_v1';
const defaults={bank:0,cash:0,investmentCash:0,stocks:[],mfs:[],investmentTx:[],income:[],expenses:[],loans:[],transfers:[],opening:{},closing:{},balances:{}};
let S=load(),page='home';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null')||{};const s={...structuredClone(defaults),...x};s.loans=Array.isArray(s.loans)?s.loans:[];s.stocks=Array.isArray(s.stocks)?s.stocks:[];s.mfs=Array.isArray(s.mfs)?s.mfs:[];s.income=Array.isArray(s.income)?s.income:[];s.expenses=Array.isArray(s.expenses)?s.expenses:[];s.transfers=Array.isArray(s.transfers)?s.transfers:[];s.investmentTx=Array.isArray(s.investmentTx)?s.investmentTx:[];s.balances=s.balances&&typeof s.balances==='object'?s.balances:{};if(!s.balances||Object.keys(s.balances).length===0){const om=monthKey(s.opening?.date);if(om)s.balances[om]={opening:{bank:n(s.opening.bank),cash:n(s.opening.cash),investmentCash:n(s.opening.investmentCash),stocks:n(s.opening.stocks),mfs:n(s.opening.mfs)},closing:s.closing?.date?{bank:n(s.closing.bank),cash:n(s.closing.cash),investmentCash:n(s.closing.investmentCash),stocks:n(s.closing.stocks),mfs:n(s.closing.mfs)}:{}}}delete s.splitwise;return s}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function n(v){return Number.isFinite(Number(v))?Number(v):0}
function money(v){return '₹'+n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function monthKey(d){return String(d||'').slice(0,7)}
function currentMonth(){return new Date().toISOString().slice(0,7)}
function prevMonth(m){const [y,mo]=String(m||currentMonth()).split('-').map(Number);const d=new Date(Date.UTC(y,mo-2,1));return d.toISOString().slice(0,7)}
function balanceSnapshot(m=currentMonth()){S.balances=S.balances&&typeof S.balances==='object'?S.balances:{};if(!S.balances[m]){const pm=prevMonth(m),pc=S.balances[pm]?.closing;if(pc){S.balances[m]={opening:{...pc},closing:{}}}else{const om=monthKey(S.opening?.date);const op=om===m?{bank:n(S.opening.bank),cash:n(S.opening.cash),investmentCash:n(S.opening.investmentCash),stocks:n(S.opening.stocks),mfs:n(S.opening.mfs)}:{bank:0,cash:0,investmentCash:0,stocks:0,mfs:0};S.balances[m]={opening:op,closing:{}}}}return S.balances[m]}
function currentBalances(){return {bank:n(S.bank),cash:n(S.cash),investmentCash:n(S.investmentCash),stocks:stockValue(),mfs:mfValue()}}
function liquidMoney(){return n(S.bank)+n(S.cash)}
function balanceRow(label,open,current,close){return `<div class="row"><div><b>${label}</b></div><div style="text-align:right"><div><small>Opening ${money(open)}</small> · <b>${money(current)}</b> · <small>Closing ${money(close)}</small></div></div></div>`}
function balanceStrip(){const b=currentBalances();return `<section class="section"><div class="card"><div class="label">Cash &amp; Bank in Hand · Actual Liquid Money</div><b>${money(liquidMoney())}</b><div class="meta" style="margin-top:5px">Bank ${money(b.bank)} + Cash ${money(b.cash)} · Stocks, Mutual Funds, Investment Cash and loans excluded</div></div></section>`}
function stockValue(){return S.stocks.reduce((a,x)=>a+n(x.qty)*n(x.price||x.avg),0)}
function mfValue(){return S.mfs.reduce((a,x)=>a+n(x.units)*n(x.nav||x.avg),0)}
function loanReceivable(){return S.loans.filter(x=>x.type==='lent').reduce((a,x)=>a+Math.max(0,n(x.amount)-n(x.paid)),0)}
function loanPayable(){return S.loans.filter(x=>x.type==='borrowed').reduce((a,x)=>a+Math.max(0,n(x.amount)-n(x.paid)),0)}
function netWorth(){return n(S.bank)+n(S.cash)+n(S.investmentCash)+stockValue()+mfValue()+loanReceivable()-loanPayable()}
function thisMonth(){const m=currentMonth();return {income:S.income.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0),expense:S.expenses.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0)}}
function nav(){return `<nav class="nav">${[['home','⌂','Home'],['transactions','☷','Transactions'],['invest','↗','Invest'],['loans','◉','Loans'],['balances','▣','Balances'],['reports','▤','Reports'],['settings','⚙','Settings']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function layout(c){document.getElementById('app').innerHTML=`<div class="wrap">${c}</div>${nav()}`}
function home(){const m=thisMonth();layout(`<div class="top"><h1>My Money</h1><small>Simple personal finance · V10.3</small></div><div class="cards"><div class="card"><div class="label">Net Worth</div><b>${money(netWorth())}</b></div><div class="card"><div class="label">Bank</div><b>${money(S.bank)}</b></div><div class="card"><div class="label">Cash</div><b>${money(S.cash)}</b></div><div class="card"><div class="label">Investment Cash</div><b>${money(S.investmentCash)}</b></div><div class="card"><div class="label">Stocks</div><b>${money(stockValue())}</b></div><div class="card"><div class="label">Mutual Funds</div><b>${money(mfValue())}</b></div></div>${balanceStrip()}<section class="section"><div class="grid"><button class="action" onclick="openAdd('expense')">−<br>Add Expense</button><button class="action" onclick="openAdd('income')">＋<br>Add Income</button><button class="action" onclick="openTransfer()">⇄<br>Transfer</button><button class="action" onclick="openLoan()">💰<br>Add Loan</button></div></section><section class="section"><h2>This Month</h2><div class="grid"><div class="card"><div class="label">Income</div><b class="income">${money(m.income)}</b></div><div class="card"><div class="label">Spent</div><b class="expense">${money(m.expense)}</b></div></div></section><section class="section"><h2>Loans</h2><div class="grid"><div class="card"><div class="label">Loan owed to me</div><b>${money(loanReceivable())}</b></div><div class="card"><div class="label">Loan I owe</div><b>${money(loanPayable())}</b></div></div></section><section class="section"><h2>Recent Transactions</h2>${recentHTML()}</section>`)}
function recentHTML(){const a=[...S.income.map(x=>({...x,kind:'Income',sort:x.date})),...S.expenses.map(x=>({...x,kind:'Expense',sort:x.date})),...S.loans.map(x=>({...x,kind:x.type==='lent'?'Loan Lent':'Loan Borrowed',sort:x.date}))].sort((a,b)=>String(b.sort).localeCompare(String(a.sort))).slice(0,8);return a.length?`<div class="list">${a.map(x=>{if(x.kind==='Income'||x.kind==='Expense')return `<div class="row"><div><b>${esc(x.category||x.kind)}</b><div class="meta">${esc(x.date)} · ${esc(x.account||'')}</div></div><div class="money ${x.kind==='Income'?'income':'expense'}">${x.kind==='Income'?'+':'−'}${money(x.amount)}</div></div>`;return `<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${esc(x.kind)} · ${esc(x.date)}</div></div><div class="money">${x.type==='lent'?'+':'−'}${money(Math.max(0,n(x.amount)-n(x.paid)))}</div></div>`}).join('')}</div>`:'<div class="empty">No recent entries.</div>'}
function transactions(){const all=[...S.income.map(x=>({...x,kind:'income'})),...S.expenses.map(x=>({...x,kind:'expense'})),...S.loans.map(x=>({...x,kind:'loan'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));layout(`<section class="section"><h2>Transactions</h2>${balanceStrip()}<div class="notice">Income, expenses and loans appear here. Transfers and investments stay in their own sections.</div><div class="list" style="margin-top:12px">${all.length?all.map(x=>{if(x.kind==='loan')return `<div class="row"><div><b>Loan · ${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe me':'I owe them'} · ${esc(x.date)} · ${esc(x.account||'')}</div></div><div style="text-align:right"><div class="money">${money(Math.max(0,n(x.amount)-n(x.paid)))}</div><div style="margin-top:7px"><button class="mini secondary" onclick="editLoan('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteLoan('${x.id}')">Delete</button></div></div></div>`;return `<div class="row"><div><b>${esc(x.category||(x.kind==='income'?'Income':'Expense'))}</b><div class="meta">${esc(x.date)} · ${esc(x.account||'')} ${x.note?'· '+esc(x.note):''}</div></div><div style="text-align:right"><div class="money ${x.kind==='income'?'income':'expense'}">${x.kind==='income'?'+':'−'}${money(x.amount)}</div><div style="margin-top:7px"><button class="mini secondary" onclick="editTxn('${x.kind}','${x.id}')">Edit</button> <button class="mini danger" onclick="deleteTxn('${x.kind}','${x.id}')">Delete</button></div></div></div>`}).join(''):'<div class="empty">No transactions.</div>'}</div></section>`)}
function invest(){const si=S.stocks.reduce((a,x)=>a+n(x.qty)*n(x.avg),0),sv=stockValue(),sp=sv-si,spp=si?sp/si*100:0;const mi=S.mfs.reduce((a,x)=>a+n(x.units)*n(x.avg),0),mv=mfValue(),mp=mv-mi,mpp=mi?mp/mi*100:0;layout(`<section class="section"><h2>Investments</h2><div class="notice">Stocks and mutual-fund values refresh every 3 minutes while the app is open. Prices/NAVs are the latest available from the data providers.</div><div class="grid" style="margin-top:12px"><button onclick="openStock()">＋ Buy Stock</button><button onclick="openMF()">＋ Buy Mutual Fund</button><button class="secondary" onclick="refreshMarketPrices()">↻ Refresh Prices Now</button></div><h2>Stocks</h2><div class="card" style="margin-bottom:12px"><div class="label">Stocks summary</div><div class="invest-cols"><div><span>Invested</span><b>${money(si)}</b></div><div><span>Current</span><b>${money(sv)}</b></div><div><span>P/L</span><b class="${sp>=0?'income':'expense'}">${sp>=0?'+':''}${money(sp)}</b><small class="${sp>=0?'income':'expense'}">${spp.toFixed(2)}%</small></div></div></div>${S.stocks.length?`<div class="list">${S.stocks.map(x=>{const invested=n(x.qty)*n(x.avg),val=n(x.qty)*n(x.price||x.avg),pl=val-invested,pct=invested?pl/invested*100:0;return `<div class="row"><div><b>${esc(x.name||x.ticker)}</b><div class="meta">${esc(x.ticker||'')} · ${n(x.qty)} shares · Avg ${money(x.avg)} · Latest ${money(x.price||x.avg)} · ${marketLabel(x,'stock')}</div></div><div class="invest-pl"><div><span>Current</span><b>${money(val)}</b></div><div><span>P/L</span><b class="${pl>=0?'income':'expense'}">${pl>=0?'+':''}${money(pl)}</b><small class="${pl>=0?'income':'expense'}">${pct.toFixed(2)}%</small></div><div class="actions"><button class="mini" onclick="openStockSale('${x.id}')">Sell</button> <button class="mini secondary" onclick="editStock('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteStock('${x.id}')">Delete</button></div></div></div>`}).join('')}</div>`:'<div class="empty">No stocks.</div>'}<h2>Mutual Funds</h2><div class="card" style="margin-bottom:12px"><div class="label">Mutual Funds summary</div><div class="invest-cols"><div><span>Invested</span><b>${money(mi)}</b></div><div><span>Current</span><b>${money(mv)}</b></div><div><span>P/L</span><b class="${mp>=0?'income':'expense'}">${mp>=0?'+':''}${money(mp)}</b><small class="${mp>=0?'income':'expense'}">${mpp.toFixed(2)}%</small></div></div></div>${S.mfs.length?`<div class="list">${S.mfs.map(x=>{const invested=n(x.units)*n(x.avg),val=n(x.units)*n(x.nav||x.avg),pl=val-invested,pct=invested?pl/invested*100:0;return `<div class="row"><div><b>${esc(x.name)}</b><div class="meta">${n(x.units)} units · Avg NAV ${money(x.avg)} · Latest ${money(x.nav||x.avg)} · ${marketLabel(x,'mf')}</div></div><div class="invest-pl"><div><span>Current</span><b>${money(val)}</b></div><div><span>P/L</span><b class="${pl>=0?'income':'expense'}">${pl>=0?'+':''}${money(pl)}</b><small class="${pl>=0?'income':'expense'}">${pct.toFixed(2)}%</small></div><div class="actions"><button class="mini" onclick="openMFSale('${x.id}')">Redeem</button> <button class="mini secondary" onclick="editMF('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteMF('${x.id}')">Delete</button></div></div></div>`}).join('')}</div>`:'<div class="empty">No mutual funds.</div>'}<h2>Investment Activity</h2>${investmentActivityHTML()}</section>`)}
function investmentActivityHTML(){const a=[...S.investmentTx].sort((x,y)=>String(y.date).localeCompare(String(x.date))).slice(0,10);return a.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${esc(x.action)} · ${esc(x.name)}</b><div class="meta">${esc(x.date)} · ${x.asset==='stock'?esc(x.ticker||''):'Mutual Fund'} · ${n(x.qty)} ${x.asset==='stock'?'shares':'units'}</div></div><div class="money">${money(x.proceeds||x.amount||0)}</div></div>`).join('')}</div>`:'<div class="empty">No investment activity yet.</div>'}
function loans(){layout(`<section class="section"><h2>Loans</h2><button onclick="openLoan()">＋ Add Loan</button><div class="list" style="margin-top:12px">${S.loans.length?S.loans.map(x=>{const due=Math.max(0,n(x.amount)-n(x.paid));return `<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe me':'I owe them'} · ${esc(x.date)} · ${esc(x.account||'')}</div></div><div style="text-align:right"><div class="money">${money(due)}</div><div style="margin-top:7px"><button class="mini" onclick="repayLoan('${x.id}')">${x.type==='lent'?'Receive Repayment':'Repay'}</button> <button class="mini secondary" onclick="editLoan('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteLoan('${x.id}')">Delete</button></div></div></div>`}).join(''):'<div class="empty">No loans.</div>'}</div></section>`)}
function balances(){const m=currentMonth(),b=balanceSnapshot(m),o=b.opening||{},c=b.closing||{},cur=currentBalances();layout(`<section class="section"><h2>Balances</h2><div class="card"><div class="label">${esc(m)}</div><b>Cash &amp; Bank in Hand ${money(liquidMoney())}</b><div class="meta" style="margin-top:5px">Actual liquid money only · Bank + Cash</div></div><div class="grid" style="margin-top:12px"><div class="card"><div class="label">Opening · Bank</div><b>${money(o.bank)}</b></div><div class="card"><div class="label">Closing · Bank</div><b>${money(c.bank)}</b></div><div class="card"><div class="label">Opening · Cash</div><b>${money(o.cash)}</b></div><div class="card"><div class="label">Closing · Cash</div><b>${money(c.cash)}</b></div><div class="card"><div class="label">Opening · Investment Cash</div><b>${money(o.investmentCash)}</b></div><div class="card"><div class="label">Closing · Investment Cash</div><b>${money(c.investmentCash)}</b></div><div class="card"><div class="label">Opening · Stocks</div><b>${money(o.stocks)}</b></div><div class="card"><div class="label">Closing · Stocks</div><b>${money(c.stocks)}</b></div><div class="card"><div class="label">Opening · Mutual Funds</div><b>${money(o.mfs)}</b></div><div class="card"><div class="label">Closing · Mutual Funds</div><b>${money(c.mfs)}</b></div></div><h2>Current / Live</h2>${balanceRow('Bank',o.bank,cur.bank,c.bank)}${balanceRow('Cash',o.cash,cur.cash,c.cash)}${balanceRow('Investment Cash',o.investmentCash,cur.investmentCash,c.investmentCash)}${balanceRow('Stocks',o.stocks,cur.stocks,c.stocks)}${balanceRow('Mutual Funds',o.mfs,cur.mfs,c.mfs)}<div class="notice" style="margin-top:12px">Next month opening automatically uses this month's closing balance.</div><button style="margin-top:12px" onclick="openBalances('${m}')">Edit Monthly Balances</button></section>`)}
function reports(){const m=thisMonth();layout(`<section class="section"><h2>Reports</h2><div class="grid"><div class="card"><div class="label">This Month Income</div><b class="income">${money(m.income)}</b></div><div class="card"><div class="label">This Month Expenses</div><b class="expense">${money(m.expense)}</b></div><div class="card"><div class="label">Stocks</div><b>${money(stockValue())}</b></div><div class="card"><div class="label">Mutual Funds</div><b>${money(mfValue())}</b></div><div class="card"><div class="label">Loan owed to me</div><b>${money(loanReceivable())}</b></div><div class="card"><div class="label">Loan I owe</div><b>${money(loanPayable())}</b></div></div><h2>Balances</h2>${reportBalancesHTML()}<h2>Transactions</h2>${reportTxHTML()}<h2>Loans</h2>${reportLoansHTML()}<h2>Investment Activity</h2>${investmentActivityHTML()}<div class="notice" style="margin-top:12px">Reports are view-only. Edit and Delete are available in the relevant sections.</div></section>`)}
function reportBalancesHTML(){const m=currentMonth(),b=balanceSnapshot(m),c=b.closing||{},cur=currentBalances();return `<div class="list"><div class="notice">${esc(m)} · Cash &amp; Bank in Hand ${money(liquidMoney())}</div>${balanceRow('Bank',n(b.opening?.bank),cur.bank,n(c.bank))}${balanceRow('Cash',n(b.opening?.cash),cur.cash,n(c.cash))}${balanceRow('Investment Cash',n(b.opening?.investmentCash),cur.investmentCash,n(c.investmentCash))}${balanceRow('Stocks',n(b.opening?.stocks),cur.stocks,n(c.stocks))}${balanceRow('Mutual Funds',n(b.opening?.mfs),cur.mfs,n(c.mfs))}</div>`}
function reportTxHTML(){const a=[...S.income.map(x=>({...x,kind:'Income'})),...S.expenses.map(x=>({...x,kind:'Expense'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,15);return a.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${esc(x.category||x.kind)}</b><div class="meta">${esc(x.date)} · ${esc(x.account||'')}</div></div><div class="money ${x.kind==='Income'?'income':'expense'}">${x.kind==='Income'?'+':'−'}${money(x.amount)}</div></div>`).join('')}</div>`:'<div class="empty">No transactions.</div>'}
function reportLoansHTML(){const a=[...S.loans].sort((x,y)=>String(y.date).localeCompare(String(x.date)));return a.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe me':'I owe them'} · ${esc(x.date)}</div></div><div class="money">${money(Math.max(0,n(x.amount)-n(x.paid)))}</div></div>`).join('')}</div>`:'<div class="empty">No loans.</div>'}
function settings(){layout(`<section class="section"><h2>Settings</h2><div class="list"><button onclick="openTransfer()">⇄ Transfer Money</button><button class="secondary" onclick="openBalances()">Opening / Closing Balances</button><button class="secondary" onclick="backup()">Backup Data</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Restore Backup</button><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="restore(event)"></div><div class="notice" style="margin-top:14px">Backup contains income, expenses, investments, loans, transfers and all five balance snapshots.</div></section>`)}
function render(){({home,transactions,invest,loans,balances,reports,settings}[page])()}
function go(p){page=p;render()}
function modal(title,body){document.getElementById('modal').innerHTML=`<div class="sheet"><h3>${title}</h3>${body}</div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML=''}
function accountOptions(selected='Bank',includeInvest=true){return ['Bank','Cash','Investment Cash'].map(a=>`<option ${selected===a?'selected':''}>${a}</option>`).join('')}
function openAdd(type){modal(type==='income'?'Add Income':'Add Expense',`<form class="form" onsubmit="saveTxn(event,'${type}')"><label>Amount</label><input id="amount" type="number" step="0.01" min="0" required><label>Category</label><input id="category" required placeholder="e.g. Salary / Food"><label>Account</label><select id="account">${accountOptions()}</select><label>Date</label><input id="date" type="date" value="${today()}" required><label>Note</label><textarea id="note"></textarea><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function applyTxnCash(x,type,dir=1){const delta=(type==='income'?1:-1)*n(x.amount)*dir;if(x.account==='Bank')S.bank+=delta;else if(x.account==='Cash')S.cash+=delta;else S.investmentCash+=delta}
function saveTxn(e,type,editId=null){e.preventDefault();const x={id:editId||id(),amount:n(document.getElementById('amount').value),category:document.getElementById('category').value,account:document.getElementById('account').value,date:document.getElementById('date').value,note:document.getElementById('note').value};const arr=type==='income'?S.income:S.expenses;if(editId){const i=arr.findIndex(a=>a.id===editId);if(i<0)return;applyTxnCash(arr[i],type,-1);arr[i]=x;applyTxnCash(x,type,1)}else{arr.push(x);applyTxnCash(x,type,1)}closeModal();save()}
function editTxn(type,i){const x=(type==='income'?S.income:S.expenses).find(a=>a.id===i);if(!x)return;modal(type==='income'?'Edit Income':'Edit Expense',`<form class="form" onsubmit="saveTxn(event,'${type}','${i}')"><label>Amount</label><input id="amount" type="number" step="0.01" value="${x.amount}" required><label>Category</label><input id="category" value="${esc(x.category)}" required><label>Account</label><select id="account">${accountOptions(x.account)}</select><label>Date</label><input id="date" type="date" value="${x.date}" required><label>Note</label><textarea id="note">${esc(x.note)}</textarea><button>Save Changes</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function deleteTxn(type,i){if(!confirm('Delete this transaction?'))return;const arr=type==='income'?S.income:S.expenses;const x=arr.find(a=>a.id===i);if(!x)return;applyTxnCash(x,type,-1);const k=arr.findIndex(a=>a.id===i);if(k>=0)arr.splice(k,1);save()}
function openStock(idv=null){const x=idv?S.stocks.find(a=>a.id===idv):null;modal(x?'Edit Stock':'Buy Stock',`<form class="form" onsubmit="saveStock(event,'${idv||''}')"><label>Ticker</label><input id="ticker" value="${esc(x?.ticker||'')}" required><label>Name</label><input id="name" value="${esc(x?.name||'')}" required><label>Quantity</label><input id="qty" type="number" step="0.0001" min="0.0001" value="${x?.qty||''}" required><label>Average Buy Price</label><input id="avg" type="number" step="0.01" min="0" value="${x?.avg||''}" required><label>Latest Price</label><input id="price" type="number" step="0.01" min="0" value="${x?.price??x?.avg??''}" required><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveStock(e,editId){e.preventDefault();const x={id:editId||id(),ticker:document.getElementById('ticker').value.toUpperCase(),name:document.getElementById('name').value,qty:n(document.getElementById('qty').value),avg:n(document.getElementById('avg').value),price:n(document.getElementById('price').value)};if(editId){const i=S.stocks.findIndex(a=>a.id===editId);if(i<0)return;const old=S.stocks[i];const oldCost=n(old.qty)*n(old.avg),newCost=n(x.qty)*n(x.avg);S.investmentCash+=oldCost-newCost;S.stocks[i]=x}else{const old=S.stocks.find(a=>a.ticker===x.ticker);const cost=x.qty*x.avg;if(old){S.investmentCash-=cost;const total=old.qty+x.qty;old.avg=total?((old.qty*old.avg)+(x.qty*x.avg))/total:0;old.qty=total;old.price=x.price}else{if(S.investmentCash<cost){alert('Insufficient Investment Cash');return}S.investmentCash-=cost;S.stocks.push(x)}S.investmentTx.push({id:id(),asset:'stock',action:'Buy',ticker:x.ticker,name:x.name,qty:x.qty,price:x.avg,amount:cost,date:today()})}closeModal();save()}
function editStock(i){openStock(i)}
function deleteStock(i){if(!confirm('Delete this stock holding?'))return;const x=S.stocks.find(a=>a.id===i);if(!x)return;S.investmentCash+=n(x.qty)*n(x.avg);S.stocks=S.stocks.filter(a=>a.id!==i);save()}
function openMF(idv=null){const x=idv?S.mfs.find(a=>a.id===idv):null;modal(x?'Edit Mutual Fund':'Buy Mutual Fund',`<form class="form" onsubmit="saveMF(event,'${idv||''}')"><label>Fund name</label><input id="name" value="${esc(x?.name||'')}" required><label>AMFI Scheme Code</label><input id="code" value="${esc(x?.code||'')}" required><label>Units</label><input id="units" type="number" step="0.000001" min="0.000001" value="${x?.units||''}" required><label>Average NAV</label><input id="avg" type="number" step="0.0001" min="0" value="${x?.avg||''}" required><label>Latest NAV</label><input id="nav" type="number" step="0.0001" min="0" value="${x?.nav??x?.avg??''}" required><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveMF(e,editId){e.preventDefault();const x={id:editId||id(),name:document.getElementById('name').value,code:document.getElementById('code').value,units:n(document.getElementById('units').value),avg:n(document.getElementById('avg').value),nav:n(document.getElementById('nav').value)};if(editId){const i=S.mfs.findIndex(a=>a.id===editId);if(i<0)return;const old=S.mfs[i];S.investmentCash+=n(old.units)*n(old.avg)-n(x.units)*n(x.avg);S.mfs[i]=x}else{const cost=x.units*x.avg;if(S.investmentCash<cost){alert('Insufficient Investment Cash');return}const old=S.mfs.find(a=>a.code===x.code);S.investmentCash-=cost;if(old){const total=old.units+x.units;old.avg=total?((old.units*old.avg)+(x.units*x.avg))/total:0;old.units=total;old.nav=x.nav}else S.mfs.push(x);S.investmentTx.push({id:id(),asset:'mf',action:'Buy',name:x.name,qty:x.units,price:x.avg,amount:cost,date:today()})}closeModal();save()}
function editMF(i){openMF(i)}
function deleteMF(i){if(!confirm('Delete this mutual fund holding?'))return;const x=S.mfs.find(a=>a.id===i);if(!x)return;S.investmentCash+=n(x.units)*n(x.avg);S.mfs=S.mfs.filter(a=>a.id!==i);save()}
function openStockSale(idv){const x=S.stocks.find(a=>a.id===idv);if(!x)return;modal('Sell Stock',`<form class="form" onsubmit="sellStock(event,'${idv}')"><div class="notice">Available: ${n(x.qty)} shares · Latest price ${money(x.price||x.avg)}</div><label>Quantity</label><input id="sellQty" type="number" step="0.0001" min="0.0001" max="${x.qty}" required><label>Sale Price</label><input id="sellPrice" type="number" step="0.01" min="0" value="${x.price||x.avg}" required><label>Date</label><input id="sellDate" type="date" value="${today()}" required><button>Sell Stock</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function sellStock(e,idv){e.preventDefault();const x=S.stocks.find(a=>a.id===idv),q=n(document.getElementById('sellQty').value),p=n(document.getElementById('sellPrice').value),d=document.getElementById('sellDate').value;if(!x||q<=0||q>x.qty)return;const proceeds=q*p,cost=q*x.avg;x.qty-=q;S.investmentCash+=proceeds;S.investmentTx.push({id:id(),asset:'stock',action:'Sell',ticker:x.ticker,name:x.name,qty:q,price:p,proceeds,costBasis:cost,date:d});if(x.qty===0)S.stocks=S.stocks.filter(a=>a.id!==idv);closeModal();save()}
function openMFSale(idv){const x=S.mfs.find(a=>a.id===idv);if(!x)return;modal('Redeem Mutual Fund',`<form class="form" onsubmit="redeemMF(event,'${idv}')"><div class="notice">Available: ${n(x.units)} units · Latest NAV ${money(x.nav||x.avg)}</div><label>Units</label><input id="sellUnits" type="number" step="0.000001" min="0.000001" max="${x.units}" required><label>Redemption NAV</label><input id="sellNav" type="number" step="0.0001" min="0" value="${x.nav||x.avg}" required><label>Date</label><input id="sellDate" type="date" value="${today()}" required><button>Redeem Mutual Fund</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function redeemMF(e,idv){e.preventDefault();const x=S.mfs.find(a=>a.id===idv),q=n(document.getElementById('sellUnits').value),p=n(document.getElementById('sellNav').value),d=document.getElementById('sellDate').value;if(!x||q<=0||q>x.units)return;const proceeds=q*p,cost=q*x.avg;x.units-=q;S.investmentCash+=proceeds;S.investmentTx.push({id:id(),asset:'mf',action:'Redeem',name:x.name,qty:q,price:p,proceeds,costBasis:cost,date:d});if(x.units===0)S.mfs=S.mfs.filter(a=>a.id!==idv);closeModal();save()}
function loanCashEffect(x){const net=n(x.amount)-n(x.paid);return x.type==='lent'?-net:net}
function openLoan(idv=null){const x=idv?S.loans.find(a=>a.id===idv):null;modal(x?'Edit Loan':'Add Loan',`<form class="form" onsubmit="saveLoan(event,'${idv||''}')"><label>Person</label><input id="person" value="${esc(x?.person||'')}" required><label>Type</label><select id="type"><option value="lent" ${x?.type==='lent'?'selected':''}>I lent money</option><option value="borrowed" ${x?.type==='borrowed'?'selected':''}>I borrowed money</option></select><label>Account</label><select id="account">${accountOptions(x?.account||'Bank')}</select><label>Total Loan Amount</label><input id="amount" type="number" step="0.01" min="0" value="${x?.amount||''}" required><label>Paid / Repaid</label><input id="paid" type="number" step="0.01" min="0" value="${x?.paid||0}" required><label>Date</label><input id="date" type="date" value="${x?.date||today()}" required><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function applyLoanCash(x,dir=1){const delta=loanCashEffect(x)*dir;if(x.account==='Bank')S.bank+=delta;else if(x.account==='Cash')S.cash+=delta;else S.investmentCash+=delta}
function saveLoan(e,editId){e.preventDefault();const x={id:editId||id(),person:document.getElementById('person').value,type:document.getElementById('type').value,account:document.getElementById('account').value,amount:n(document.getElementById('amount').value),paid:Math.min(n(document.getElementById('paid').value),n(document.getElementById('amount').value)),date:document.getElementById('date').value};if(editId){const i=S.loans.findIndex(a=>a.id===editId);if(i<0)return;applyLoanCash(S.loans[i],-1);S.loans[i]=x;applyLoanCash(x,1)}else{S.loans.push(x);applyLoanCash(x,1)}closeModal();save()}
function repayLoan(idv){const x=S.loans.find(a=>a.id===idv);if(!x)return;modal(x.type==='lent'?'Receive Loan Repayment':'Repay Loan',`<form class="form" onsubmit="saveRepayment(event,'${idv}')"><div class="notice">Outstanding: ${money(Math.max(0,n(x.amount)-n(x.paid)))}</div><label>Repayment amount</label><input id="repay" type="number" step="0.01" min="0.01" max="${Math.max(0,n(x.amount)-n(x.paid))}" required><button>Save Repayment</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveRepayment(e,idv){e.preventDefault();const x=S.loans.find(a=>a.id===idv),r=n(document.getElementById('repay').value);if(!x||r<=0||r>n(x.amount)-n(x.paid))return;x.paid+=r;const delta=x.type==='lent'?r:-r;if(x.account==='Bank')S.bank+=delta;else if(x.account==='Cash')S.cash+=delta;else S.investmentCash+=delta;closeModal();save()}
function editLoan(i){openLoan(i)}
function deleteLoan(i){if(!confirm('Delete this loan?'))return;const x=S.loans.find(a=>a.id===i);if(!x)return;applyLoanCash(x,-1);S.loans=S.loans.filter(a=>a.id!==i);save()}
function openTransfer(){modal('Transfer Money',`<form class="form" onsubmit="transfer(event)"><label>From</label><select id="from"><option>Bank</option><option>Cash</option><option>Investment Cash</option><option>Stocks</option><option>Mutual Funds</option></select><label>To</label><select id="to"><option>Bank</option><option>Cash</option><option>Investment Cash</option><option>Stocks</option><option>Mutual Funds</option></select><label>Amount</label><input id="amount" type="number" step="0.01" min="0.01" required><button>Transfer</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function transfer(e){e.preventDefault();const f=document.getElementById('from').value,t=document.getElementById('to').value,a=n(document.getElementById('amount').value);if(f===t){alert('Choose different accounts');return}const vals={Bank:S.bank,Cash:S.cash,'Investment Cash':S.investmentCash,Stocks:stockValue(), 'Mutual Funds':mfValue()};if(vals[f]<a){alert('Insufficient balance');return}if(f==='Stocks'||f==='Mutual Funds'||t==='Stocks'||t==='Mutual Funds'){alert('Use Buy/Sell or Redeem on Investments for stock/mutual-fund movements. Transfers between cash accounts are supported here.');return}const map={'Bank':'bank','Cash':'cash','Investment Cash':'investmentCash'};S[map[f]]-=a;S[map[t]]+=a;S.transfers.push({id:id(),from:f,to:t,amount:a,date:today()});closeModal();save()}
function openBalances(month=currentMonth()){const b=balanceSnapshot(month),o=b.opening||{},c=b.closing||{},cur=currentBalances(),pm=prevMonth(month),pc=S.balances[pm]?.closing;modal('Monthly Balances',`<form class="form" onsubmit="saveBalances(event)"><label>Month</label><input id="bmonth" type="month" value="${month}" onchange="openBalances(this.value)"><div class="notice">Opening automatically comes from the previous month's closing when available.</div><h3>Opening Balance</h3><label>Bank</label><input id="obank" type="number" step="0.01" value="${n(o.bank)}"><label>Cash</label><input id="ocash" type="number" step="0.01" value="${n(o.cash)}"><label>Investment Cash</label><input id="oinvestmentCash" type="number" step="0.01" value="${n(o.investmentCash)}"><label>Stocks</label><input id="ostocks" type="number" step="0.01" value="${n(o.stocks)}"><label>Mutual Funds</label><input id="omfs" type="number" step="0.01" value="${n(o.mfs)}"><hr><h3>Current Balance</h3><div class="notice">Bank ${money(cur.bank)} · Cash ${money(cur.cash)} · Liquid ${money(liquidMoney())}</div><h3>Closing Balance</h3><label>Bank</label><input id="cbank" type="number" step="0.01" value="${c.bank??cur.bank}"><label>Cash</label><input id="ccash" type="number" step="0.01" value="${c.cash??cur.cash}"><label>Investment Cash</label><input id="cinvestmentCash" type="number" step="0.01" value="${c.investmentCash??cur.investmentCash}"><label>Stocks</label><input id="cstocks" type="number" step="0.01" value="${c.stocks??cur.stocks}"><label>Mutual Funds</label><input id="cmfs" type="number" step="0.01" value="${c.mfs??cur.mfs}"><button>Save Monthly Balances</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveBalances(e){e.preventDefault();const m=document.getElementById('bmonth').value||currentMonth(),old=balanceSnapshot(m).opening||{},next={bank:n(document.getElementById('obank').value),cash:n(document.getElementById('ocash').value),investmentCash:n(document.getElementById('oinvestmentCash').value),stocks:n(document.getElementById('ostocks').value),mfs:n(document.getElementById('omfs').value)},cur=currentBalances();if(m===currentMonth()){S.bank+=next.bank-n(old.bank);S.cash+=next.cash-n(old.cash);S.investmentCash+=next.investmentCash-n(old.investmentCash)}S.balances[m]={opening:next,closing:{bank:n(document.getElementById('cbank').value),cash:n(document.getElementById('ccash').value),investmentCash:n(document.getElementById('cinvestmentCash').value),stocks:n(document.getElementById('cstocks').value),mfs:n(document.getElementById('cmfs').value)}};S.opening={...next,date:m+'-01'};S.closing={...S.balances[m].closing,date:m+'-'+new Date(Date.UTC(Number(m.slice(0,4)),Number(m.slice(5,7)),0)).getUTCDate().toString().padStart(2,'0')};const nm=new Date(Date.UTC(Number(m.slice(0,4)),Number(m.slice(5,7)),1)).toISOString().slice(0,7);S.balances[nm]=S.balances[nm]||{opening:{...S.balances[m].closing},closing:{}};S.balances[nm].opening={...S.balances[m].closing};closeModal();save()}
function backup(){const blob=new Blob([JSON.stringify({version:2,app:'My Money',data:S},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-money-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data)throw Error();S={...structuredClone(defaults),...j.data};S.loans=Array.isArray(S.loans)?S.loans:[];S.stocks=Array.isArray(S.stocks)?S.stocks:[];S.mfs=Array.isArray(S.mfs)?S.mfs:[];S.income=Array.isArray(S.income)?S.income:[];S.expenses=Array.isArray(S.expenses)?S.expenses:[];S.transfers=Array.isArray(S.transfers)?S.transfers:[];S.investmentTx=Array.isArray(S.investmentTx)?S.investmentTx:[];delete S.splitwise;save();alert('Backup restored')}catch(err){alert('Invalid backup file')}};r.readAsText(f)}
function stockYahooTicker(t){const v=String(t||'').trim().toUpperCase();if(!v)return '';return v.includes('.')?v:v+'.NS'}
async function fetchStockPrice(ticker){const y=stockYahooTicker(ticker);if(!y)return null;try{const r=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(y)+'?range=1d&interval=5m',{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json(),q=j?.chart?.result?.[0],p=q?.meta?.regularMarketPrice??q?.indicators?.quote?.[0]?.close?.filter(v=>v!=null).pop();return Number.isFinite(Number(p))?Number(p):null}catch(e){return null}}
async function fetchMFNav(code){const c=String(code||'').trim();if(!c)return null;try{const r=await fetch('https://api.mfapi.in/mf/'+encodeURIComponent(c)+'/latest',{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json(),p=Number(j?.data?.[0]?.nav);return Number.isFinite(p)?p:null}catch(e){return null}}
let marketRefreshBusy=false;async function refreshMarketPrices(){if(marketRefreshBusy)return;marketRefreshBusy=true;try{let changed=false;for(const x of S.stocks){const p=await fetchStockPrice(x.ticker);if(p!=null&&p!==x.price){x.price=p;x.priceUpdatedAt=new Date().toISOString();changed=true}}for(const x of S.mfs){const p=await fetchMFNav(x.code);if(p!=null&&p!==x.nav){x.nav=p;x.navUpdatedAt=new Date().toISOString();changed=true}}if(changed){localStorage.setItem(KEY,JSON.stringify(S));if(page==='home'||page==='invest'||page==='reports')render()}}finally{marketRefreshBusy=false}}
function startMarketRefresh(){refreshMarketPrices();setInterval(refreshMarketPrices,180000)}
function marketLabel(x,type){const d=type==='stock'?x.priceUpdatedAt:x.navUpdatedAt;return d?'Updated '+new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'Manual/latest value'}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=10.4').catch(()=>{});startMarketRefresh();render();
</script></body></html>
