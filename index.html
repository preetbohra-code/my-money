<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d4b3d"><link rel="manifest" href="manifest.webmanifest"><title>My Money V10.14</title><style>
:root{--green:#0d4b3d;--mint:#dff4e9;--cream:#f8f5ec;--ink:#0b1f1a;--muted:#1f2a26;--red:#c94d4d;--line:#dfe5e1;--blue:#2d75d6}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;padding:12px 15px;background:var(--green);color:#fff;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:80px}.top{background:var(--green);color:white;padding:28px 20px 24px;border-radius:0 0 32px 32px}.top h1{margin:0 0 6px;font-size:28px}.top small{opacity:.92;font-weight:550}.wrap{max-width:760px;margin:auto}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:-5px 16px 18px}.card{background:#fff;border:1px solid #e7e9e5;border-radius:20px;padding:16px;box-shadow:0 4px 14px #1231  .04}.card b{font-size:20px;color:#0b1f1a;font-weight:800} .label{color:#17231f;font-size:13px;font-weight:650;margin-bottom:6px}.section{padding:0 16px;margin:18px auto;max-width:760px}.section h2{color:#0b1f1a;font-size:21px;margin:8px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.action{background:#fff;color:var(--blue);border:1px solid #e2e5e8;min-height:76px}.list{display:flex;flex-direction:column;gap:10px}.row{color:#0b1f1a;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:12px}.row .meta{color:#202b27;font-size:12px;font-weight:550;margin-top:4px}.money{font-weight:800}.income{color:#18854e}.expense{color:var(--red)}.pill{display:inline-block;background:var(--mint);color:var(--green);padding:4px 8px;border-radius:99px;font-size:12px}.danger{background:#fff;color:var(--red);border:1px solid #f0cccc}.secondary{background:#fff;color:var(--green);border:1px solid #cbd8d3}.mini{padding:8px 10px;border-radius:10px;font-size:12px}.hidden{display:none!important}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;color:#202b27;padding:8px 5px;font-size:11px}.nav button.active{color:var(--green)}.nav span{display:block;font-size:20px}.modal{position:fixed;z-index:30;inset:0;background:#0007;display:flex;align-items:flex-end}.sheet{background:var(--cream);width:100%;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px}.sheet h3{margin:0 0 14px}.form{display:grid;gap:10px}.form label{font-size:12px;color:#17231f;font-weight:650}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.tabs .selected{background:var(--green);color:#fff}.tabs button:not(.selected){background:#fff;color:var(--green);border:1px solid var(--line)}.invest-cols{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.invest-cols>div,.invest-pl>div{display:flex;flex-direction:column;gap:3px}.invest-cols span,.invest-pl span,.invest-cols small,.invest-pl small{font-size:11px;color:#202b27;font-weight:550}.invest-pl{min-width:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:left;align-items:end}.invest-pl .actions{grid-column:1/-1}.actions{white-space:nowrap}.notice{background:#eef7f2;border-radius:14px;padding:12px;color:var(--green);font-size:13px}.empty{padding:24px;text-align:center;color:#202b27;background:#fff;border-radius:16px;border:1px dashed var(--line)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(5,1fr)}.invest-cols{grid-template-columns:repeat(3,1fr)}.invest-pl{grid-template-columns:repeat(3,1fr);text-align:right}.invest-pl .actions{grid-column:auto}}
.card{box-shadow:0 6px 20px rgba(23,53,46,.06)}.balance-modal{display:grid;gap:14px}.balance-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}.balance-card.live{border-color:#cfe5dc;background:linear-gradient(180deg,#f7fcf9,#fff)}.balance-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.balance-title b{font-size:16px;color:#0b1f1a}.balance-sub{font-size:11px;color:#202b27;font-weight:550;margin-top:2px}.live-badge{font-size:10px;font-weight:800;color:#18854e;background:#e5f7ed;border-radius:99px;padding:5px 8px}.balance-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.balance-item{background:#f8faf9;border-radius:14px;padding:12px}.balance-item .k{font-size:11px;color:var(--muted);margin-bottom:5px}.balance-item .v{font-size:18px;font-weight:800}.balance-item.highlight{background:var(--mint)}.balance-total{font-size:22px!important}.balance-note{font-size:12px;color:#17231f;font-weight:550;line-height:1.45}@media(max-width:420px){.balance-grid{grid-template-columns:1fr}}.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:6px 0 10px}.category-btn{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 8px;display:flex;align-items:center;gap:8px;text-align:left}.category-btn span{font-size:21px}.category-btn b{font-size:13px}.category-btn.selected{border:2px solid var(--green);background:#f5fbf7}.category-btn:active{transform:scale(.98)}</style></head><body><div id="app"></div><div id="modal" class="modal hidden"></div><script>
'use strict';
const KEY='mymoney_clean_v1';
const defaults={bank:0,cash:0,investmentCash:0,stocks:[],mfs:[],investmentTx:[],income:[],expenses:[],loans:[],transfers:[],opening:{},closing:{}};
let S=load(),page='home';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null')||{};const s={...structuredClone(defaults),...x};s.loans=Array.isArray(s.loans)?s.loans:[];s.stocks=Array.isArray(s.stocks)?s.stocks:[];s.mfs=Array.isArray(s.mfs)?s.mfs:[];s.income=Array.isArray(s.income)?s.income:[];s.income.forEach(normalizeIncome);s.expenses=Array.isArray(s.expenses)?s.expenses:[];s.transfers=Array.isArray(s.transfers)?s.transfers:[];s.investmentTx=Array.isArray(s.investmentTx)?s.investmentTx:[];delete s.splitwise;return s}catch(e){return structuredClone(defaults)}}
function save(){syncBalances();localStorage.setItem(KEY,JSON.stringify(S));render()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function n(v){return Number.isFinite(Number(v))?Number(v):0}
function money(v){return '₹'+n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function monthKey(d){return String(d||'').slice(0,7)}
function currentMonth(){return new Date().toISOString().slice(0,7)}
function stockValue(){return S.stocks.reduce((a,x)=>a+n(x.qty)*n(x.price||x.avg),0)}
function mfValue(){return S.mfs.reduce((a,x)=>a+n(x.units)*n(x.nav||x.avg),0)}
function loanReceivable(){return S.loans.filter(x=>x.type==='lent').reduce((a,x)=>a+Math.max(0,n(x.amount)-n(x.paid)),0)}
function loanPayable(){return S.loans.filter(x=>x.type==='borrowed').reduce((a,x)=>a+Math.max(0,n(x.amount)-n(x.paid)),0)}
function netWorth(){return n(S.bank)+n(S.cash)+n(S.investmentCash)+stockValue()+mfValue()+loanReceivable()-loanPayable()}
function thisMonth(){const m=currentMonth();return {income:S.income.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0),expense:S.expenses.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0)}}
function nav(){return `<nav class="nav">${[['home','⌂','Home'],['transactions','☷','Transactions'],['invest','↗','Invest'],['loans','◉','Loans'],['reports','▤','Reports'],['settings','⚙','Settings']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function layout(c){document.getElementById('app').innerHTML=`<div class="wrap">${c}</div>${nav()}`}
function home(){const m=thisMonth();layout(`<div class="top"><h1>My Money</h1><small>Simple personal finance · V10.14</small></div><div class="cards"><div class="card"><div class="label">Net Worth</div><b>${money(netWorth())}</b></div><div class="card"><div class="label">Bank</div><b>${money(S.bank)}</b></div><div class="card"><div class="label">Cash</div><b>${money(S.cash)}</b></div><div class="card"><div class="label">Investment Cash</div><b>${money(S.investmentCash)}</b></div><div class="card"><div class="label">Stocks</div><b>${money(stockValue())}</b></div><div class="card"><div class="label">Mutual Funds</div><b>${money(mfValue())}</b></div></div><section class="section"><div class="grid"><button class="action" onclick="openAdd('expense')">−<br>Add Expense</button><button class="action" onclick="openAdd('income')">＋<br>Add Income</button><button class="action" onclick="openTransfer()">⇄<br>Transfer</button><button class="action" onclick="openLoan()">💰<br>Add Loan</button></div></section><section class="section"><h2>This Month</h2><div class="grid"><div class="card"><div class="label">Income</div><b class="income">${money(m.income)}</b></div><div class="card"><div class="label">Spent</div><b class="expense">${money(m.expense)}</b></div></div></section><section class="section"><h2>Loans</h2><div class="grid"><div class="card"><div class="label">Loan owed to me</div><b>${money(loanReceivable())}</b></div><div class="card"><div class="label">Loan I owe</div><b>${money(loanPayable())}</b></div></div></section><section class="section"><h2>Recent Transactions</h2>${recentHTML()}</section>`)}
function recentHTML(){const a=[...S.income.map(x=>({...x,kind:'Income',sort:x.date})),...S.expenses.map(x=>({...x,kind:'Expense',sort:x.date})),...S.loans.map(x=>({...x,kind:x.type==='lent'?'Loan Lent':'Loan Borrowed',sort:x.date}))].sort((a,b)=>String(b.sort).localeCompare(String(a.sort))).slice(0,8);return a.length?`<div class="list">${a.map(x=>{if(x.kind==='Income'||x.kind==='Expense')return `<div class="row"><div><b>${esc(x.category||x.kind)}</b><div class="meta">${esc(x.date)} · ${esc(x.account||'')}</div></div><div class="money ${x.kind==='Income'?'income':'expense'}">${x.kind==='Income'?'+':'−'}${money(x.amount)}</div></div>`;return `<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${esc(x.kind)} · ${esc(x.date)}</div></div><div class="money">${x.type==='lent'?'+':'−'}${money(Math.max(0,n(x.amount)-n(x.paid)))}</div></div>`}).join('')}</div>`:'<div class="empty">No recent entries.</div>'}
function transactions(){const all=[...S.income.map(x=>({...x,kind:'income'})),...S.expenses.map(x=>({...x,kind:'expense'})),...S.loans.map(x=>({...x,kind:'loan'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));layout(`<section class="section"><h2>Transactions</h2><div class="notice">Income, expenses and loans appear here. Transfers and investments stay in their own sections.</div><div class="list" style="margin-top:12px">${all.length?all.map(x=>{if(x.kind==='loan')return `<div class="row"><div><b>Loan · ${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe me':'I owe them'} · ${esc(x.date)} · ${esc(x.account||'')} · ${Math.max(0,n(x.amount)-n(x.paid))<=0?'CLEARED':'Outstanding'}</div></div><div style="text-align:right"><div class="money">${money(Math.max(0,n(x.amount)-n(x.paid)))}</div><div style="margin-top:7px"><button class="mini secondary" onclick="editLoan('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteLoan('${x.id}')">Delete</button></div></div></div>`;return `<div class="row"><div><b>${x.kind==='expense'?(esc(x.expenseName||x.note||'Expense')):esc(x.category||'Income')}</b><div class="meta">${x.kind==='expense'?((expenseCategories.find(c=>c[1]===x.category)?.[0]||'📦')+' '+esc(x.category||'Others')+' · '):''}${esc(x.date)} · ${esc(x.account||'')} ${x.note&&x.kind==='income'?'· '+esc(x.note):''}</div></div><div style="text-align:right"><div class="money ${x.kind==='income'?'income':'expense'}">${x.kind==='income'?'+':'−'}${money(x.amount)}</div><div style="margin-top:7px"><button class="mini secondary" onclick="editTxn('${x.kind}','${x.id}')">Edit</button> <button class="mini danger" onclick="deleteTxn('${x.kind}','${x.id}')">Delete</button></div></div></div>`}).join(''):'<div class="empty">No transactions.</div>'}</div></section>`)}
function invest(){const si=S.stocks.reduce((a,x)=>a+n(x.qty)*n(x.avg),0),sv=stockValue(),sp=sv-si,spp=si?sp/si*100:0;const mi=S.mfs.reduce((a,x)=>a+n(x.units)*n(x.avg),0),mv=mfValue(),mp=mv-mi,mpp=mi?mp/mi*100:0;layout(`<section class="section"><h2>Investments</h2><div class="notice">Stocks and mutual-fund values refresh every 3 minutes while the app is open. Prices/NAVs are the latest available from the data providers.</div><div class="grid" style="margin-top:12px"><button onclick="openStock()">＋ Buy Stock</button><button onclick="openMF()">＋ Buy Mutual Fund</button><button class="secondary" onclick="refreshMarketPrices()">↻ Refresh Prices Now</button></div><h2>Stocks</h2><div class="card" style="margin-bottom:12px"><div class="label">Stocks · Live Value</div><div class="invest-cols"><div><span>Invested</span><b>${money(si)}</b></div><div><span>Current</span><b>${money(sv)}</b></div><div><span>P/L</span><b class="${sp>=0?'income':'expense'}">${sp>=0?'+':''}${money(sp)}</b><small class="${sp>=0?'income':'expense'}">${spp.toFixed(2)}%</small></div></div></div>${S.stocks.length?`<div class="list">${S.stocks.map(x=>{const invested=n(x.qty)*n(x.avg),val=n(x.qty)*n(x.price||x.avg),pl=val-invested,pct=invested?pl/invested*100:0;return `<div class="row"><div><b>${esc(x.name||x.ticker)}</b><div class="meta">${esc(x.ticker||'')} · ${n(x.qty)} shares · Avg ${money(x.avg)} · Latest ${money(x.price||x.avg)} · ${esc(x.date||'')} · ${marketLabel(x,'stock')}</div></div><div class="invest-pl"><div><span>Current</span><b>${money(val)}</b></div><div><span>P/L</span><b class="${pl>=0?'income':'expense'}">${pl>=0?'+':''}${money(pl)}</b><small class="${pl>=0?'income':'expense'}">${pct.toFixed(2)}%</small></div><div class="actions"><button class="mini" onclick="openStockSale('${x.id}')">Sell</button> <button class="mini secondary" onclick="editStock('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteStock('${x.id}')">Delete</button></div></div></div>`}).join('')}</div>`:'<div class="empty">No stocks.</div>'}<h2>Mutual Funds</h2><div class="card" style="margin-bottom:12px"><div class="label">Mutual Funds · Live Value</div><div class="invest-cols"><div><span>Invested</span><b>${money(mi)}</b></div><div><span>Current</span><b>${money(mv)}</b></div><div><span>P/L</span><b class="${mp>=0?'income':'expense'}">${mp>=0?'+':''}${money(mp)}</b><small class="${mp>=0?'income':'expense'}">${mpp.toFixed(2)}%</small></div></div></div>${S.mfs.length?`<div class="list">${S.mfs.map(x=>{const invested=n(x.units)*n(x.avg),val=n(x.units)*n(x.nav||x.avg),pl=val-invested,pct=invested?pl/invested*100:0;return `<div class="row"><div><b>${esc(x.name)}</b><div class="meta">${n(x.units)} units · Avg NAV ${money(x.avg)} · Latest ${money(x.nav||x.avg)} · ${marketLabel(x,'mf')}</div></div><div class="invest-pl"><div><span>Current</span><b>${money(val)}</b></div><div><span>P/L</span><b class="${pl>=0?'income':'expense'}">${pl>=0?'+':''}${money(pl)}</b><small class="${pl>=0?'income':'expense'}">${pct.toFixed(2)}%</small></div><div class="actions"><button class="mini" onclick="openMFSale('${x.id}')">Redeem</button> <button class="mini secondary" onclick="editMF('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteMF('${x.id}')">Delete</button></div></div></div>`}).join('')}</div>`:'<div class="empty">No mutual funds.</div>'}<h2>Investment Activity</h2>${investmentActivityHTML()}</section>`)}
function investmentActivityHTML(){const a=[...S.investmentTx].sort((x,y)=>String(y.date).localeCompare(String(x.date))).slice(0,10);return a.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${esc(x.action)} · ${esc(x.name)}</b><div class="meta">${esc(x.date)} · ${x.asset==='stock'?esc(x.ticker||''):'Mutual Fund'} · ${n(x.qty)} ${x.asset==='stock'?'shares':'units'}</div></div><div style="text-align:right"><div class="money">${money(x.proceeds||x.amount||0)}</div><button class="mini danger" onclick="deleteInvestmentActivity('${x.id}')">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">No investment activity yet.</div>'}
function deleteInvestmentActivity(txId){const tx=S.investmentTx.find(x=>x.id===txId);if(!tx)return;if(!confirm('Delete this investment activity? This will reverse the investment transaction.'))return;if(tx.action==='Buy'){if(tx.asset==='stock'){const h=S.stocks.find(x=>x.id===tx.holdingId||x.ticker===tx.ticker);if(h){if(n(h.qty)<n(tx.qty))return alert('Cannot reverse this activity because the holding quantity has already been reduced.');const remaining=n(h.qty)-n(tx.qty);if(remaining<=0)S.stocks=S.stocks.filter(a=>a.id!==h.id);else h.qty=remaining;}S.investmentCash+=n(tx.amount||tx.qty*tx.price)}else{const h=S.mfs.find(x=>x.id===tx.holdingId||x.code===tx.code||x.name===tx.name);if(h){if(n(h.units)<n(tx.qty))return alert('Cannot reverse this activity because the fund units have already been reduced.');const remaining=n(h.units)-n(tx.qty);if(remaining<=0)S.mfs=S.mfs.filter(a=>a.id!==h.id);else h.units=remaining;}S.investmentCash+=n(tx.amount||tx.qty*tx.price)}}else if(tx.action==='Sell'||tx.action==='Redeem'){S.investmentCash-=n(tx.proceeds||0);let h=tx.asset==='stock'?S.stocks.find(x=>x.id===tx.holdingId||x.ticker===tx.ticker):S.mfs.find(x=>x.id===tx.holdingId||x.name===tx.name);if(!h){h=tx.asset==='stock'?{id:tx.holdingId||id(),ticker:tx.ticker,name:tx.name,qty:0,avg:n(tx.costBasis)/(n(tx.qty)||1),price:n(tx.price),date:tx.date}:{id:tx.holdingId||id(),name:tx.name,code:tx.code||'',units:0,avg:n(tx.costBasis)/(n(tx.qty)||1),nav:n(tx.price),date:tx.date};(tx.asset==='stock'?S.stocks:S.mfs).push(h)}if(tx.asset==='stock')h.qty+=n(tx.qty);else h.units+=n(tx.qty)}S.investmentTx=S.investmentTx.filter(x=>x.id!==txId);save()}

function loans(){layout(`<section class="section"><h2>Loans</h2><button onclick="openLoan()">＋ Add Loan</button><div class="list" style="margin-top:12px">${S.loans.length?S.loans.map(x=>{const due=Math.max(0,n(x.amount)-n(x.paid)),clear=due<=0;return `<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe me':'I owe them'} · Started ${esc(x.date)} · ${esc(x.account||'')}</div>${x.repayments?.length?`<div class="meta">Last payment: ${esc(x.repayments[x.repayments.length-1].date)} · ${esc(x.repayments[x.repayments.length-1].account)}</div>`:''}</div><div style="text-align:right"><div class="money">${clear?'CLEARED':money(due)}</div><div style="margin-top:7px">${clear?'':`<button class="mini" onclick="repayLoan('${x.id}')">${x.type==='lent'?'Receive Repayment':'Repay'}</button>`}  <button class="mini secondary" onclick="editLoan('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteLoan('${x.id}')">Delete</button></div></div></div>`}).join(''):'<div class="empty">No loans.</div>'}</div></section>`)}
function reports(){const m=thisMonth();layout(`<section class="section"><h2>Reports</h2>${expenseCategorySummary()}<div class="grid"><div class="card"><div class="label">This Month Income</div><b class="income">${money(m.income)}</b></div><div class="card"><div class="label">This Month Expenses</div><b class="expense">${money(m.expense)}</b></div><div class="card"><div class="label">Stocks</div><b>${money(stockValue())}</b></div><div class="card"><div class="label">Mutual Funds</div><b>${money(mfValue())}</b></div><div class="card"><div class="label">Loan owed to me</div><b>${money(loanReceivable())}</b></div><div class="card"><div class="label">Loan I owe</div><b>${money(loanPayable())}</b></div></div><h2>Transactions</h2>${reportTxHTML()}<h2>Loans</h2>${reportLoansHTML()}<h2>Investment Activity</h2>${investmentActivityHTML()}<div class="notice" style="margin-top:12px">Reports are view-only. Edit and Delete are available in the relevant sections.</div></section>`)}
function expenseCategorySummary(){const m=currentMonth();const groups={};S.expenses.filter(x=>monthKey(x.date)===m).forEach(x=>{const k=coreExpenseNames.has(x.category)?x.category:'Others';(groups[k]??=[]).push(x)});const entries=Object.entries(groups).sort((a,b)=>b[1].reduce((s,x)=>s+n(x.amount),0)-a[1].reduce((s,x)=>s+n(x.amount),0));return entries.length?`<div class="card" style="margin-bottom:14px"><div class="label">This Month Expenses by Category</div><div class="list" style="margin-top:8px">${entries.map(([k,items])=>{const total=items.reduce((s,x)=>s+n(x.amount),0);const cat=expenseCategories.find(c=>c[1]===k);return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="row" style="padding:0;border:0"><div><b>${cat?cat[0]+' ':''}${esc(k)}</b></div><div class="money expense">${money(total)}</div></div><div class="meta" style="margin-top:7px">${items.map(x=>`${esc(x.expenseName||x.note||'Expense')} · ${money(x.amount)}`).join('<br>')}</div></div>`}).join('')}</div></div>`:'<div class="empty">No expenses this month.</div>'}
function reportTxHTML(){const a=[...S.income.map(x=>({...x,kind:'Income'})),...S.expenses.map(x=>({...x,kind:'Expense'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,15);return a.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${x.kind==='Expense'?esc(x.expenseName||x.note||'Expense'):esc(x.category||x.kind)}</b><div class="meta">${x.kind==='Expense'?((expenseCategories.find(c=>c[1]===x.category)?.[0]||'📦')+' '+esc(x.category||'Others')+' · '):''}${esc(x.date)} · ${esc(x.account||'')}</div></div><div class="money ${x.kind==='Income'?'income':'expense'}">${x.kind==='Income'?'+':'−'}${money(x.amount)}</div></div>`).join('')}</div>`:'<div class="empty">No transactions.</div>'}
function reportLoansHTML(){const a=[...S.loans].sort((x,y)=>String(y.date).localeCompare(String(x.date)));return a.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe me':'I owe them'} · ${esc(x.date)}</div></div><div class="money">${money(Math.max(0,n(x.amount)-n(x.paid)))}</div></div>`).join('')}</div>`:'<div class="empty">No loans.</div>'}
function settings(){layout(`<section class="section"><h2>Settings</h2><div class="list"><button onclick="openTransfer()">⇄ Transfer Money</button><button class="secondary" onclick="openBalances()">Opening / Closing Balances</button><button class="secondary" onclick="backup()">Backup Data</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Restore Backup</button><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="restore(event)"></div><div class="notice" style="margin-top:14px">Backup contains income, expenses, investments, loans, transfers and all five balance snapshots.</div></section>`)}
function render(){({home,transactions,invest,loans,reports,settings}[page])()}
function go(p){page=p;render()}
function modal(title,body){document.getElementById('modal').innerHTML=`<div class="sheet"><h3>${title}</h3>${body}</div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML=''}
function accountOptions(selected='Bank',includeInvest=true){return ['Bank','Cash','Investment Cash'].map(a=>`<option ${selected===a?'selected':''}>${a}</option>`).join('')}
const incomeCategories=['Bohra Fashion','Investment','Others'];
const incomeCategorySet=new Set(incomeCategories);
const expenseCategories=[['🍔','Food'],['💊','Medicine & Health'],['💨','Cigg'],['🏸','Sports'],['📱','Recharge & Bills'],['💇','Salon & Grooming'],['⛽','Petrol / Transport'],['📦','Others']];
const coreExpenseNames=new Set(expenseCategories.map(c=>c[1]));
function normalizeIncome(x){if(!x)return x; if(x.category==='Business') x.category='Bohra Fashion'; else if(!incomeCategorySet.has(x.category)) x.category='Others'; return x}
function normalizeExpense(x){if(!x)return x; if(!coreExpenseNames.has(x.category)) x.category='Others'; if(!x.expenseName) x.expenseName=x.note||x.category||'Expense'; return x}
S.expenses.forEach(normalizeExpense);

function expenseCategoryPicker(selected=''){return `<div class="category-grid">${expenseCategories.map(([icon,name])=>`<button type="button" class="category-btn ${selected===name?'selected':''}" data-cat="${esc(name)}" onclick="pickExpenseCategory(this)"><span>${icon}</span><b>${esc(name)}</b></button>`).join('')}</div><input id="category" type="hidden" value="${esc(selected)}" required>`}
function incomeCategoryPicker(selected=''){return `<select id="category" required>${incomeCategories.map(name=>`<option value="${esc(name)}" ${selected===name?'selected':''}>${esc(name)}</option>`).join('')}</select>`}
function pickExpenseCategory(btn){document.querySelectorAll('.category-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');document.getElementById('category').value=btn.dataset.cat}
function openAdd(type){if(type==='expense'){modal('Add Expense',`<form class="form" onsubmit="saveTxn(event,'expense')"><label>Expense Name</label><input id="expenseName" required placeholder="e.g. Lunch, Petrol, Medicine"><label>Amount</label><input id="amount" type="number" step="0.01" min="0" required><label>Category</label>${expenseCategoryPicker()}<label>Account</label><select id="account">${accountOptions()}</select><label>Date</label><input id="date" type="date" value="${today()}" required><button>Save Expense</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`);return}modal('Add Income',`<form class="form" onsubmit="saveTxn(event,'income')"><label>Amount</label><input id="amount" type="number" step="0.01" min="0" required><label>Category</label>${incomeCategoryPicker()}<label>Account</label><select id="account">${accountOptions()}</select><label>Date</label><input id="date" type="date" value="${today()}" required><button>Save Income</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function applyTxnCash(x,type,dir=1){const delta=(type==='income'?1:-1)*n(x.amount)*dir;if(x.account==='Bank')S.bank+=delta;else if(x.account==='Cash')S.cash+=delta;else S.investmentCash+=delta}
function saveTxn(e,type,editId=null){e.preventDefault();const x={id:editId||id(),amount:n(document.getElementById('amount').value),category:document.getElementById('category').value,expenseName:type==='expense'?(document.getElementById('expenseName')?.value||'Expense'):undefined,account:document.getElementById('account').value,date:document.getElementById('date').value}; if(type==='expense'&&!coreExpenseNames.has(x.category))x.category='Others';if(type==='income'&&!incomeCategorySet.has(x.category))x.category='Others';const arr=type==='income'?S.income:S.expenses;if(editId){const i=arr.findIndex(a=>a.id===editId);if(i<0)return;applyTxnCash(arr[i],type,-1);arr[i]=x;applyTxnCash(x,type,1)}else{arr.push(x);applyTxnCash(x,type,1)}closeModal();save()}
function editTxn(type,i){const x=(type==='income'?S.income:S.expenses).find(a=>a.id===i);if(!x)return;if(type==='expense'){const cat=coreExpenseNames.has(x.category)?x.category:'Others';modal('Edit Expense',`<form class="form" onsubmit="saveTxn(event,'expense','${i}')"><label>Expense Name</label><input id="expenseName" value="${esc(x.expenseName||x.note||x.category||'Expense')}" required><label>Amount</label><input id="amount" type="number" step="0.01" value="${x.amount}" required><label>Category</label>${expenseCategoryPicker(cat)}<label>Account</label><select id="account">${accountOptions(x.account)}</select><label>Date</label><input id="date" type="date" value="${x.date}" required><button>Save Changes</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`);return}modal('Edit Income',`<form class="form" onsubmit="saveTxn(event,'income','${i}')"><label>Amount</label><input id="amount" type="number" step="0.01" value="${x.amount}" required><label>Category</label>${incomeCategoryPicker(incomeCategorySet.has(x.category)?x.category:'Others')}<label>Account</label><select id="account">${accountOptions(x.account)}</select><label>Date</label><input id="date" type="date" value="${x.date}" required><button>Save Changes</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function deleteTxn(type,i){if(!confirm('Delete this transaction?'))return;const arr=type==='income'?S.income:S.expenses;const x=arr.find(a=>a.id===i);if(!x)return;applyTxnCash(x,type,-1);const k=arr.findIndex(a=>a.id===i);if(k>=0)arr.splice(k,1);save()}
function openStock(idv=null){const x=idv?S.stocks.find(a=>a.id===idv):null;modal(x?'Edit Stock':'Buy Stock',`<form class="form" onsubmit="saveStock(event,'${idv||''}')"><label>Ticker</label><input id="ticker" value="${esc(x?.ticker||'')}" required><label>Name</label><input id="name" value="${esc(x?.name||'')}" required><label>Quantity</label><input id="qty" type="number" step="0.0001" min="0.0001" value="${x?.qty||''}" required><label>Average Buy Price</label><input id="avg" type="number" step="0.01" min="0" value="${x?.avg||''}" required><label>Latest Price</label><input id="price" type="number" step="0.01" min="0" value="${x?.price??x?.avg??''}" required><label>Purchase / Entry Date</label><input id="stockDate" type="date" value="${x?.date||today()}" required><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveStock(e,editId){e.preventDefault();const x={id:editId||id(),ticker:document.getElementById('ticker').value.toUpperCase(),name:document.getElementById('name').value,qty:n(document.getElementById('qty').value),avg:n(document.getElementById('avg').value),price:n(document.getElementById('price').value),date:document.getElementById('stockDate').value};if(editId){const i=S.stocks.findIndex(a=>a.id===editId);if(i<0)return;const old=S.stocks[i];const oldCost=n(old.qty)*n(old.avg),newCost=n(x.qty)*n(x.avg);S.investmentCash+=oldCost-newCost;S.stocks[i]=x}else{const old=S.stocks.find(a=>a.ticker===x.ticker);const cost=x.qty*x.avg;if(old){S.investmentCash-=cost;const total=old.qty+x.qty;old.avg=total?((old.qty*old.avg)+(x.qty*x.avg))/total:0;old.qty=total;old.price=x.price}else{if(S.investmentCash<cost){alert('Insufficient Investment Cash');return}S.investmentCash-=cost;S.stocks.push(x)}S.investmentTx.push({id:id(),asset:'stock',action:'Buy',ticker:x.ticker,name:x.name,qty:x.qty,price:x.avg,amount:cost,date:x.date,holdingId:x.id,previousQty:old?old.qty-x.qty:null,previousAvg:old?old.avg:null})}closeModal();save()}
function editStock(i){openStock(i)}
function deleteStock(i){if(!confirm('Delete this stock holding?'))return;const x=S.stocks.find(a=>a.id===i);if(!x)return;S.investmentCash+=n(x.qty)*n(x.avg);S.stocks=S.stocks.filter(a=>a.id!==i);save()}
function openMF(idv=null){const x=idv?S.mfs.find(a=>a.id===idv):null;modal(x?'Edit Mutual Fund':'Buy Mutual Fund',`<form class="form" onsubmit="saveMF(event,'${idv||''}')"><label>Fund name</label><input id="name" value="${esc(x?.name||'')}" required><label>AMFI Scheme Code</label><input id="code" value="${esc(x?.code||'')}" required><label>Units</label><input id="units" type="number" step="0.000001" min="0.000001" value="${x?.units||''}" required><label>Average NAV</label><input id="avg" type="number" step="0.0001" min="0" value="${x?.avg||''}" required><label>Latest NAV</label><input id="nav" type="number" step="0.0001" min="0" value="${x?.nav??x?.avg??''}" required><label>Purchase / Entry Date</label><input id="mfDate" type="date" value="${x?.date||today()}" required><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveMF(e,editId){e.preventDefault();const x={id:editId||id(),name:document.getElementById('name').value,code:document.getElementById('code').value,units:n(document.getElementById('units').value),avg:n(document.getElementById('avg').value),nav:n(document.getElementById('nav').value),date:document.getElementById('mfDate').value};if(editId){const i=S.mfs.findIndex(a=>a.id===editId);if(i<0)return;const old=S.mfs[i];S.investmentCash+=n(old.units)*n(old.avg)-n(x.units)*n(x.avg);S.mfs[i]=x}else{const cost=x.units*x.avg;if(S.investmentCash<cost){alert('Insufficient Investment Cash');return}const old=S.mfs.find(a=>a.code===x.code);S.investmentCash-=cost;if(old){const total=old.units+x.units;old.avg=total?((old.units*old.avg)+(x.units*x.avg))/total:0;old.units=total;old.nav=x.nav}else S.mfs.push(x);S.investmentTx.push({id:id(),asset:'mf',action:'Buy',name:x.name,qty:x.units,price:x.avg,amount:cost,date:x.date,holdingId:x.id,previousQty:old?old.qty-x.qty:null,previousAvg:old?old.avg:null})}closeModal();save()}
function editMF(i){openMF(i)}
function deleteMF(i){if(!confirm('Delete this mutual fund holding?'))return;const x=S.mfs.find(a=>a.id===i);if(!x)return;S.investmentCash+=n(x.units)*n(x.avg);S.mfs=S.mfs.filter(a=>a.id!==i);save()}
function openStockSale(idv){const x=S.stocks.find(a=>a.id===idv);if(!x)return;modal('Sell Stock',`<form class="form" onsubmit="sellStock(event,'${idv}')"><div class="notice">Available: ${n(x.qty)} shares · Latest price ${money(x.price||x.avg)}</div><label>Quantity</label><input id="sellQty" type="number" step="0.0001" min="0.0001" max="${x.qty}" required><label>Sale Price</label><input id="sellPrice" type="number" step="0.01" min="0" value="${x.price||x.avg}" required><label>Date</label><input id="sellDate" type="date" value="${today()}" required><button>Sell Stock</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function sellStock(e,idv){e.preventDefault();const x=S.stocks.find(a=>a.id===idv),q=n(document.getElementById('sellQty').value),p=n(document.getElementById('sellPrice').value),d=document.getElementById('sellDate').value;if(!x||q<=0||q>x.qty)return;const proceeds=q*p,cost=q*x.avg;x.qty-=q;S.investmentCash+=proceeds;S.investmentTx.push({id:id(),asset:'stock',action:'Sell',ticker:x.ticker,name:x.name,qty:q,price:p,proceeds,costBasis:cost,date:d,holdingId:idv});if(x.qty===0)S.stocks=S.stocks.filter(a=>a.id!==idv);closeModal();save()}
function openMFSale(idv){const x=S.mfs.find(a=>a.id===idv);if(!x)return;modal('Redeem Mutual Fund',`<form class="form" onsubmit="redeemMF(event,'${idv}')"><div class="notice">Available: ${n(x.units)} units · Latest NAV ${money(x.nav||x.avg)}</div><label>Units</label><input id="sellUnits" type="number" step="0.000001" min="0.000001" max="${x.units}" required><label>Redemption NAV</label><input id="sellNav" type="number" step="0.0001" min="0" value="${x.nav||x.avg}" required><label>Date</label><input id="sellDate" type="date" value="${today()}" required><button>Redeem Mutual Fund</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function redeemMF(e,idv){e.preventDefault();const x=S.mfs.find(a=>a.id===idv),q=n(document.getElementById('sellUnits').value),p=n(document.getElementById('sellNav').value),d=document.getElementById('sellDate').value;if(!x||q<=0||q>x.units)return;const proceeds=q*p,cost=q*x.avg;x.units-=q;S.investmentCash+=proceeds;S.investmentTx.push({id:id(),asset:'mf',action:'Redeem',name:x.name,qty:q,price:p,proceeds,costBasis:cost,date:d,holdingId:idv});if(x.units===0)S.mfs=S.mfs.filter(a=>a.id!==idv);closeModal();save()}
function loanCashEffect(x){const net=n(x.amount)-n(x.paid);return x.type==='lent'?-net:net}
function openLoan(idv=null){const x=idv?S.loans.find(a=>a.id===idv):null;const convert=x?`<label>Change Entry To</label><select id="entryType"><option value="loan">Keep as Loan</option><option value="expense">Expense</option><option value="income">Income</option></select>${x.paid?`<div class="notice">This loan has repayments of <b>${money(x.paid)}</b>. Converting it will use the remaining outstanding amount.</div>`:''}`:'';modal(x?'Edit Loan':'Add Loan',`<form class="form" onsubmit="saveLoan(event,'${idv||''}')">${convert}<label>Person</label><input id="person" value="${esc(x?.person||'')}" required><label>Type</label><select id="type"><option value="lent" ${x?.type==='lent'?'selected':''}>I lent money</option><option value="borrowed" ${x?.type==='borrowed'?'selected':''}>I borrowed money</option></select><label>Account</label><select id="account">${accountOptions(x?.account||'Bank')}</select><label>Total Loan Amount</label><input id="amount" type="number" step="0.01" min="0" value="${x?.amount||''}" required>${x?`<div class="notice">Paid / received so far: <b>${money(x.paid||0)}</b>${x.repayments?.length?`<br>Payments: ${x.repayments.map(r=>esc(r.date)+' · '+money(r.amount)+' · '+esc(r.account)).join('<br>')}`:''}</div>`:''}<label>Date</label><input id="date" type="date" value="${x?.date||today()}" required><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function applyLoanCash(x,dir=1){const delta=loanCashEffect(x)*dir;if(x.account==='Bank')S.bank+=delta;else if(x.account==='Cash')S.cash+=delta;else S.investmentCash+=delta}
function saveLoan(e,editId){e.preventDefault();const old=editId?S.loans.find(a=>a.id===editId):null;const entryType=editId?(document.getElementById('entryType')?.value||'loan'):'loan';const person=document.getElementById('person').value;const type=document.getElementById('type').value;const account=document.getElementById('account').value;const amount=n(document.getElementById('amount').value);const date=document.getElementById('date').value;if(editId&&entryType!=='loan'&&old){const outstanding=Math.max(0,n(old.amount)-n(old.paid));applyLoanCash(old,-1);S.loans=S.loans.filter(a=>a.id!==editId);if(entryType==='expense'){const tx={id:id(),amount:outstanding,category:'Others',expenseName:person||'Expense',account,date};S.expenses.push(tx);applyTxnCash(tx,'expense',1)}else{const tx={id:id(),amount:outstanding,category:'Others',account,date};S.income.push(tx);applyTxnCash(tx,'income',1)}closeModal();save();return}const x={id:editId||id(),person,type,account,amount,paid:editId?Math.min(n(old?.paid),amount):0,date};if(editId){const i=S.loans.findIndex(a=>a.id===editId);if(i<0)return;applyLoanCash(old,-1);x.repayments=old.repayments||[];S.loans[i]=x;applyLoanCash(x,1)}else{S.loans.push(x);applyLoanCash(x,1)}closeModal();save()}
function repayLoan(idv){const x=S.loans.find(a=>a.id===idv);if(!x)return;modal(x.type==='lent'?'Receive Loan Repayment':'Repay Loan',`<form class="form" onsubmit="saveRepayment(event,'${idv}')"><div class="notice">Outstanding: ${money(Math.max(0,n(x.amount)-n(x.paid)))}</div><label>Repayment amount</label><input id="repay" type="number" step="0.01" min="0.01" max="${Math.max(0,n(x.amount)-n(x.paid))}" required><label>Paid by / received in</label><select id="repayAccount">${accountOptions(x.account||'Bank')}</select><label>Payment date</label><input id="repayDate" type="date" value="${today()}" required><button>Save Repayment</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveRepayment(e,idv){e.preventDefault();const x=S.loans.find(a=>a.id===idv),r=n(document.getElementById('repay').value),acct=document.getElementById('repayAccount').value,d=document.getElementById('repayDate').value;if(!x||r<=0||r>n(x.amount)-n(x.paid))return;x.paid+=r;x.repayments=Array.isArray(x.repayments)?x.repayments:[];x.repayments.push({amount:r,account:acct,date:d});const delta=x.type==='lent'?r:-r;if(acct==='Bank')S.bank+=delta;else if(acct==='Cash')S.cash+=delta;else S.investmentCash+=delta;closeModal();save()}
function editLoan(i){openLoan(i)}
function deleteLoan(i){if(!confirm('Delete this loan?'))return;const x=S.loans.find(a=>a.id===i);if(!x)return;applyLoanCash(x,-1);S.loans=S.loans.filter(a=>a.id!==i);save()}
function openTransfer(){modal('Transfer Money',`<form class="form" onsubmit="transfer(event)"><label>From</label><select id="from"><option>Bank</option><option>Cash</option><option>Investment Cash</option><option>Stocks</option><option>Mutual Funds</option></select><label>To</label><select id="to"><option>Bank</option><option>Cash</option><option>Investment Cash</option><option>Stocks</option><option>Mutual Funds</option></select><label>Amount</label><input id="amount" type="number" step="0.01" min="0.01" required><button>Transfer</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function transfer(e){e.preventDefault();const f=document.getElementById('from').value,t=document.getElementById('to').value,a=n(document.getElementById('amount').value);if(f===t){alert('Choose different accounts');return}const vals={Bank:S.bank,Cash:S.cash,'Investment Cash':S.investmentCash,Stocks:stockValue(), 'Mutual Funds':mfValue()};if(vals[f]<a){alert('Insufficient balance');return}if(f==='Stocks'||f==='Mutual Funds'||t==='Stocks'||t==='Mutual Funds'){alert('Use Buy/Sell or Redeem on Investments for stock/mutual-fund movements. Transfers between cash accounts are supported here.');return}const map={'Bank':'bank','Cash':'cash','Investment Cash':'investmentCash'};S[map[f]]-=a;S[map[t]]+=a;S.transfers.push({id:id(),from:f,to:t,amount:a,date:today()});closeModal();save()}
function syncBalances(){const now=today(),m=monthKey(now);if(!S.opening||!S.opening.date){S.opening={date:now,bank:n(S.bank),cash:n(S.cash),investmentCash:n(S.investmentCash),stocks:stockValue(),mfs:mfValue()}}else if(monthKey(S.opening.date)!==m&&S.closing?.date){S.opening={date:now,bank:n(S.closing.bank),cash:n(S.closing.cash),investmentCash:n(S.closing.investmentCash),stocks:n(S.closing.stocks),mfs:n(S.closing.mfs)}}S.closing={date:now,bank:n(S.bank),cash:n(S.cash),investmentCash:n(S.investmentCash),stocks:stockValue(),mfs:mfValue()}}
function editOpeningBalance(){const o=S.opening||{};modal('Edit Opening Balance',`<form class="form" onsubmit="saveOpeningBalance(event)"><div class="notice">Opening Balance is your starting position. Current and Closing balances are calculated automatically from transactions.</div><label>Opening Date</label><input id="obDate" type="date" value="${o.date||today()}" required><label>Bank</label><input id="obBank" type="number" step="0.01" value="${o.bank??0}"><label>Cash</label><input id="obCash" type="number" step="0.01" value="${o.cash??0}"><label>Investment Cash</label><input id="obInvCash" type="number" step="0.01" value="${o.investmentCash??0}"><label>Stocks</label><input id="obStocks" type="number" step="0.01" value="${o.stocks??0}"><label>Mutual Funds</label><input id="obMFs" type="number" step="0.01" value="${o.mfs??0}"><button>Save Opening Balance</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveOpeningBalance(e){e.preventDefault();S.opening={date:document.getElementById('obDate').value,bank:n(document.getElementById('obBank').value),cash:n(document.getElementById('obCash').value),investmentCash:n(document.getElementById('obInvCash').value),stocks:n(document.getElementById('obStocks').value),mfs:n(document.getElementById('obMFs').value)};closeModal();save()}
function openBalances(){syncBalances();const o=S.opening||{},c=S.closing||{},hand=n(c.bank)+n(c.cash),liquid=hand+n(c.investmentCash),invest=n(c.stocks)+n(c.mfs),nw=liquid+invest+loanReceivable()-loanPayable();modal('Balance',`<div class="balance-modal"><div class="balance-card"><div class="balance-title"><div><b>Opening Balance</b><div class="balance-sub">${esc(o.date||'')}</div></div><button class="mini secondary" onclick="editOpeningBalance()">Edit</button></div><div class="balance-grid"><div class="balance-item"><div class="k">Bank</div><div class="v">${money(o.bank)}</div></div><div class="balance-item"><div class="k">Cash</div><div class="v">${money(o.cash)}</div></div><div class="balance-item highlight"><div class="k">Cash & Bank in Hand</div><div class="v">${money(n(o.bank)+n(o.cash))}</div></div></div></div><div class="balance-card live"><div class="balance-title"><div><b>Current Money</b><div class="balance-sub">Actual money available now · ${esc(c.date||'')}</div></div><span class="live-badge">CURRENT</span></div><div class="balance-grid"><div class="balance-item"><div class="k">Bank</div><div class="v">${money(c.bank)}</div></div><div class="balance-item"><div class="k">Cash</div><div class="v">${money(c.cash)}</div></div><div class="balance-item highlight"><div class="k">Cash & Bank in Hand</div><div class="v balance-total">${money(hand)}</div></div><div class="balance-item"><div class="k">Investment Cash</div><div class="v">${money(c.investmentCash)}</div></div></div></div><div class="balance-card live"><div class="balance-title"><div><b>Live Investments</b><div class="balance-sub">Latest available market / NAV values</div></div><span class="live-badge">LIVE</span></div><div class="balance-grid"><div class="balance-item"><div class="k">Stocks</div><div class="v">${money(c.stocks)}</div></div><div class="balance-item"><div class="k">Mutual Funds</div><div class="v">${money(c.mfs)}</div></div><div class="balance-item highlight"><div class="k">Total Investments</div><div class="v">${money(invest)}</div></div></div></div><div class="balance-card"><div class="balance-title"><b>Overall Summary</b></div><div class="balance-grid"><div class="balance-item"><div class="k">Liquid Money</div><div class="v">${money(liquid)}</div></div><div class="balance-item highlight"><div class="k">Net Worth</div><div class="v balance-total">${money(nw)}</div></div></div></div><div class="balance-note">Cash & Bank in Hand excludes Investment Cash, Stocks and Mutual Funds. Current and Live values update automatically when transactions change and when market/NAV prices refresh.</div><button class="secondary" onclick="closeModal()">Close</button></div>`)}
function backup(){const blob=new Blob([JSON.stringify({version:2,app:'My Money',data:S},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-money-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data)throw Error();S={...structuredClone(defaults),...j.data};S.loans=Array.isArray(S.loans)?S.loans:[];S.stocks=Array.isArray(S.stocks)?S.stocks:[];S.mfs=Array.isArray(S.mfs)?S.mfs:[];S.income=Array.isArray(S.income)?S.income:[];S.income.forEach(normalizeIncome);S.expenses=Array.isArray(S.expenses)?S.expenses:[];S.transfers=Array.isArray(S.transfers)?S.transfers:[];S.investmentTx=Array.isArray(S.investmentTx)?S.investmentTx:[];delete S.splitwise;save();alert('Backup restored')}catch(err){alert('Invalid backup file')}};r.readAsText(f)}
function stockYahooTicker(t){const v=String(t||'').trim().toUpperCase();if(!v)return '';return v.includes('.')?v:v+'.NS'}
async function fetchStockPrice(ticker){const y=stockYahooTicker(ticker);if(!y)return null;try{const r=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(y)+'?range=1d&interval=5m',{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json(),q=j?.chart?.result?.[0],p=q?.meta?.regularMarketPrice??q?.indicators?.quote?.[0]?.close?.filter(v=>v!=null).pop();return Number.isFinite(Number(p))?Number(p):null}catch(e){return null}}
async function fetchMFNav(code){const c=String(code||'').trim();if(!c)return null;try{const r=await fetch('https://api.mfapi.in/mf/'+encodeURIComponent(c)+'/latest',{cache:'no-store'});if(!r.ok)throw Error();const j=await r.json(),p=Number(j?.data?.[0]?.nav);return Number.isFinite(p)?p:null}catch(e){return null}}
let marketRefreshBusy=false;async function refreshMarketPrices(){if(marketRefreshBusy)return;marketRefreshBusy=true;try{let changed=false;for(const x of S.stocks){const p=await fetchStockPrice(x.ticker);if(p!=null&&p!==x.price){x.price=p;x.priceUpdatedAt=new Date().toISOString();changed=true}}for(const x of S.mfs){const p=await fetchMFNav(x.code);if(p!=null&&p!==x.nav){x.nav=p;x.navUpdatedAt=new Date().toISOString();changed=true}}if(changed){syncBalances();localStorage.setItem(KEY,JSON.stringify(S));if(page==='home'||page==='invest'||page==='reports')render()}}finally{marketRefreshBusy=false}}
function startMarketRefresh(){refreshMarketPrices();setInterval(refreshMarketPrices,180000)}
function marketLabel(x,type){const d=type==='stock'?x.priceUpdatedAt:x.navUpdatedAt;return d?'Updated '+new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'Manual/latest value'}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=10.14').catch(()=>{});startMarketRefresh();render();
</script></body></html>
