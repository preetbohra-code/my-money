<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d4b3d"><link rel="manifest" href="manifest.webmanifest"><title>My Money V10.1</title><style>
:root{--green:#0d4b3d;--mint:#dff4e9;--cream:#f8f5ec;--ink:#17352e;--muted:#71807b;--red:#c94d4d;--line:#dfe5e1;--blue:#2d75d6}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:82px}button,input,select,textarea{font:inherit}button{border:0;border-radius:14px;padding:12px 15px;background:var(--green);color:#fff;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}textarea{min-height:80px}.top{background:var(--green);color:white;padding:28px 20px 24px;border-radius:0 0 32px 32px}.top h1{margin:0 0 6px;font-size:28px}.top small{opacity:.8}.wrap{max-width:760px;margin:auto}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:-5px 16px 18px}.card{background:#fff;border:1px solid #e7e9e5;border-radius:20px;padding:16px;box-shadow:0 4px 14px #1231  .04}.card b{font-size:20px}.label{color:var(--muted);font-size:13px;margin-bottom:6px}.section{padding:0 16px;margin:18px auto;max-width:760px}.section h2{font-size:21px;margin:8px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.action{background:#fff;color:var(--blue);border:1px solid #e2e5e8;min-height:76px}.list{display:flex;flex-direction:column;gap:10px}.row{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:12px}.row .meta{color:var(--muted);font-size:12px;margin-top:4px}.money{font-weight:800}.income{color:#18854e}.expense{color:var(--red)}.pill{display:inline-block;background:var(--mint);color:var(--green);padding:4px 8px;border-radius:99px;font-size:12px}.danger{background:#fff;color:var(--red);border:1px solid #f0cccc}.secondary{background:#fff;color:var(--green);border:1px solid #cbd8d3}.mini{padding:8px 10px;border-radius:10px;font-size:12px}.hidden{display:none!important}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;color:#7b8581;padding:8px 5px;font-size:11px}.nav button.active{color:var(--green)}.nav span{display:block;font-size:20px}.modal{position:fixed;z-index:30;inset:0;background:#0007;display:flex;align-items:flex-end}.sheet{background:var(--cream);width:100%;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px}.sheet h3{margin:0 0 14px}.form{display:grid;gap:10px}.form label{font-size:12px;color:var(--muted)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.tabs .selected{background:var(--green);color:#fff}.tabs button:not(.selected){background:#fff;color:var(--green);border:1px solid var(--line)}.notice{background:#eef7f2;border-radius:14px;padding:12px;color:var(--green);font-size:13px}.empty{padding:24px;text-align:center;color:var(--muted);background:#fff;border-radius:16px;border:1px dashed var(--line)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(5,1fr)}}
</style></head><body><div id="app"></div><div id="modal" class="modal hidden"></div><script>
'use strict';
const KEY='mymoney_clean_v1';
const defaults={bank:0,cash:0,investmentCash:0,stocks:[],mfs:[],investmentTx:[],income:[],expenses:[],loans:[],splitwise:[],transfers:[],opening:{},closing:{}};
let S=load();let page='home';let loanTab='loans';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return {...structuredClone(defaults),...(x||{})}}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function n(v){return Number.isFinite(Number(v))?Number(v):0}
function money(v){return '₹'+n(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function monthKey(d){return String(d||'').slice(0,7)}
function currentMonth(){return new Date().toISOString().slice(0,7)}
function stockValue(){return S.stocks.reduce((a,x)=>a+n(x.qty)*n(x.price||x.avg),0)}
function mfValue(){return S.mfs.reduce((a,x)=>a+n(x.units)*n(x.nav||x.avg),0)}
function loanReceivable(){return S.loans.filter(x=>x.type==='lent').reduce((a,x)=>a+n(x.amount)-n(x.paid),0)}
function loanPayable(){return S.loans.filter(x=>x.type==='borrowed').reduce((a,x)=>a+n(x.amount)-n(x.paid),0)}
function splitReceivable(){return S.splitwise.filter(x=>x.type==='owedToMe').reduce((a,x)=>a+n(x.amount)-n(x.paid),0)}
function splitPayable(){return S.splitwise.filter(x=>x.type==='iOwe').reduce((a,x)=>a+n(x.amount)-n(x.paid),0)}
function netWorth(){return n(S.bank)+n(S.cash)+n(S.investmentCash)+stockValue()+mfValue()+loanReceivable()-loanPayable()+splitReceivable()-splitPayable()}
function thisMonth(){const m=currentMonth();return {income:S.income.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0),expense:S.expenses.filter(x=>monthKey(x.date)===m).reduce((a,x)=>a+n(x.amount),0)}}
function nav(){return `<nav class="nav">${[['home','⌂','Home'],['transactions','☷','Transactions'],['invest','↗','Invest'],['loans','◉','Loans'],['reports','▤','Reports'],['settings','⚙','Settings']].map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function layout(content){document.getElementById('app').innerHTML=`<div class="wrap">${content}</div>${nav()}`}
function home(){const m=thisMonth();layout(`<div class="top"><h1>My Money</h1><small>Simple personal finance · V10.1</small></div><div class="cards"><div class="card"><div class="label">Net Worth</div><b>${money(netWorth())}</b></div><div class="card"><div class="label">Bank</div><b>${money(S.bank)}</b></div><div class="card"><div class="label">Cash</div><b>${money(S.cash)}</b></div><div class="card"><div class="label">Investment Cash</div><b>${money(S.investmentCash)}</b></div><div class="card"><div class="label">Investments</div><b>${money(stockValue()+mfValue())}</b></div></div><section class="section"><div class="grid"><button class="action" onclick="openAdd('expense')">−<br>Add Expense</button><button class="action" onclick="openAdd('income')">＋<br>Add Income</button><button class="action" onclick="openTransfer()">⇄<br>Transfer</button></div></section><section class="section"><h2>This Month</h2><div class="grid"><div class="card"><div class="label">Income</div><b class="income">${money(m.income)}</b></div><div class="card"><div class="label">Spent</div><b class="expense">${money(m.expense)}</b></div></div></section><section class="section"><h2>Loans & Splitwise</h2><div class="grid"><div class="card"><div class="label">Loan owed to me</div><b>${money(loanReceivable())}</b></div><div class="card"><div class="label">Loan I owe</div><b>${money(loanPayable())}</b></div><div class="card"><div class="label">Splitwise owed to me</div><b>${money(splitReceivable())}</b></div><div class="card"><div class="label">Splitwise I owe</div><b>${money(splitPayable())}</b></div></div></section><section class="section"><h2>Recent</h2>${recentHTML()}</section>`)}
function recentHTML(){const a=[...S.income.map(x=>({...x,kind:'Income'})),...S.expenses.map(x=>({...x,kind:'Expense'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,5);return a.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${esc(x.category||x.kind)}</b><div class="meta">${esc(x.date)} · ${esc(x.account||'')}</div></div><div class="money ${x.kind==='Income'?'income':'expense'}">${x.kind==='Income'?'+':'−'}${money(x.amount)}</div></div>`).join('')}</div>`:'<div class="empty">No income or expenses yet.</div>'}
function transactions(){const all=[...S.income.map(x=>({...x,type:'income'})),...S.expenses.map(x=>({...x,type:'expense'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));layout(`<section class="section"><h2>Transactions</h2><div class="notice">Only income and expenses appear here.</div><div class="list" style="margin-top:12px">${all.length?all.map(x=>`<div class="row"><div><b>${esc(x.category|| (x.type==='income'?'Income':'Expense'))}</b><div class="meta">${esc(x.date)} · ${esc(x.account||'')} ${x.note?'· '+esc(x.note):''}</div></div><div style="text-align:right"><div class="money ${x.type==='income'?'income':'expense'}">${x.type==='income'?'+':'−'}${money(x.amount)}</div><div style="margin-top:7px"><button class="mini secondary" onclick="editTxn('${x.type}','${x.id}')">Edit</button> <button class="mini danger" onclick="deleteTxn('${x.type}','${x.id}')">Delete</button></div></div></div>`).join(''):'<div class="empty">No transactions.</div>'}</div></section>`)}
function invest(){layout(`<section class="section"><h2>Investments</h2><div class="notice">Market prices refresh automatically every 3 minutes while the app is open. Stocks use the latest available quote; mutual funds use the latest published NAV.</div><div class="grid" style="margin-top:12px"><button onclick="openStock()">＋ Buy Stock</button><button onclick="openMF()">＋ Buy Mutual Fund</button><button class="secondary" onclick="refreshMarketPrices()">↻ Refresh Prices Now</button></div><h2>Stocks</h2>${S.stocks.length?`<div class="list">${S.stocks.map(x=>`<div class="row"><div><b>${esc(x.name||x.ticker)}</b><div class="meta">${esc(x.ticker||'')} · ${n(x.qty)} shares · Avg ${money(x.avg)} · Latest ${money(x.price||x.avg)} · ${marketLabel(x,'stock')}</div></div><div style="text-align:right"><div class="money">${money(n(x.qty)*n(x.price||x.avg))}</div><div style="margin-top:7px"><button class="mini" onclick="openStockSale('${x.id}')">Sell</button> <button class="mini secondary" onclick="editStock('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteStock('${x.id}')">Delete</button></div></div></div>`).join('')}</div>`:'<div class="empty">No stocks.</div>'}<h2>Mutual Funds</h2>${S.mfs.length?`<div class="list">${S.mfs.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="meta">${n(x.units)} units · Avg NAV ${money(x.avg)} · Latest ${money(x.nav||x.avg)}</div></div><div style="text-align:right"><div class="money">${money(n(x.units)*n(x.nav||x.avg))}</div><div style="margin-top:7px"><button class="mini" onclick="openMFSale('${x.id}')">Redeem</button> <button class="mini secondary" onclick="editMF('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteMF('${x.id}')">Delete</button></div></div></div>`).join('')}</div>`:'<div class="empty">No mutual funds.</div>'}<h2>Investment Activity</h2>${investmentActivityHTML()}</section>`)}
function investmentActivityHTML(){const a=[...S.investmentTx].sort((x,y)=>String(y.date).localeCompare(String(x.date))).slice(0,10);return a.length?`<div class="list">${a.map(x=>`<div class="row"><div><b>${esc(x.action)} · ${esc(x.name)}</b><div class="meta">${esc(x.date)} · ${x.asset==='stock'?esc(x.ticker||''):'Mutual Fund'} · ${n(x.qty)} ${x.asset==='stock'?'shares':'units'}</div></div><div class="money">${money(x.proceeds||x.amount)}</div></div>`).join('')}</div>`:'<div class="empty">No investment activity yet.</div>'}
function loans(){const list=S.loans;const sw=S.splitwise;layout(`<section class="section"><h2>Loans & Splitwise</h2><div class="tabs"><button class="${loanTab==='loans'?'selected':''}" onclick="loanTab='loans';render()">Loans</button><button class="${loanTab==='splitwise'?'selected':''}" onclick="loanTab='splitwise';render()">Splitwise</button></div>${loanTab==='loans'?`<button onclick="openLoan()">＋ Add Loan</button><div class="list" style="margin-top:12px">${list.length?list.map(x=>`<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${x.type==='lent'?'They owe me':'I owe them'} · ${esc(x.date)}</div></div><div style="text-align:right"><div class="money">${money(n(x.amount)-n(x.paid))}</div><div style="margin-top:7px"><button class="mini secondary" onclick="editLoan('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteLoan('${x.id}')">Delete</button></div></div></div>`).join(''):'<div class="empty">No loans.</div>'}</div>`:`<button onclick="openSplit()">＋ Add Splitwise</button><div class="list" style="margin-top:12px">${sw.length?sw.map(x=>`<div class="row"><div><b>${esc(x.person)}</b><div class="meta">${x.type==='owedToMe'?'They owe me':'I owe them'} · ${esc(x.date)}</div></div><div style="text-align:right"><div class="money">${money(n(x.amount)-n(x.paid))}</div><div style="margin-top:7px"><button class="mini secondary" onclick="editSplit('${x.id}')">Edit</button> <button class="mini danger" onclick="deleteSplit('${x.id}')">Delete</button></div></div></div>`).join(''):'<div class="empty">No Splitwise entries.</div>'}</div>`}</section>`)}
function reports(){const m=thisMonth();layout(`<section class="section"><h2>Reports</h2><div class="grid"><div class="card"><div class="label">This Month Income</div><b class="income">${money(m.income)}</b></div><div class="card"><div class="label">This Month Expenses</div><b class="expense">${money(m.expense)}</b></div><div class="card"><div class="label">Stocks</div><b>${money(stockValue())}</b></div><div class="card"><div class="label">Mutual Funds</div><b>${money(mfValue())}</b></div><div class="card"><div class="label">Loans Receivable</div><b>${money(loanReceivable())}</b></div><div class="card"><div class="label">Splitwise Receivable</div><b>${money(splitReceivable())}</b></div></div><h2>Transactions</h2>${recentHTML()}<h2>Investment Activity</h2>${investmentActivityHTML()}<div class="notice" style="margin-top:12px">Reports are view-only. Edit and Delete are available in the relevant sections.</div></section>`)}
function settings(){layout(`<section class="section"><h2>Settings</h2><div class="list"><button onclick="openTransfer()">⇄ Transfer Money</button><button class="secondary" onclick="openBalances()">Opening / Closing Balances</button><button class="secondary" onclick="backup()">Backup Data</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Restore Backup</button><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="restore(event)"></div><div class="notice" style="margin-top:14px">Backup contains all income, expenses, investments, loans, Splitwise, transfers and balances.</div></section>`)}
function stockYahooTicker(t){const v=String(t||'').trim().toUpperCase();if(!v)return '';return v.includes('.')?v:v+'.NS'}
async function fetchStockPrice(ticker){const y=stockYahooTicker(ticker);if(!y)return null;try{const r=await fetch('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(y)+'?range=1d&interval=5m',{cache:'no-store'});if(!r.ok)throw Error('quote');const j=await r.json();const q=j?.chart?.result?.[0];const p=q?.meta?.regularMarketPrice??q?.indicators?.quote?.[0]?.close?.filter(v=>v!=null).pop();return Number.isFinite(Number(p))?Number(p):null}catch(e){return null}}
async function fetchMFNav(code){const c=String(code||'').trim();if(!c)return null;try{const r=await fetch('https://api.mfapi.in/mf/'+encodeURIComponent(c)+'/latest',{cache:'no-store'});if(!r.ok)throw Error('nav');const j=await r.json();const p=Number(j?.data?.[0]?.nav);return Number.isFinite(p)?p:null}catch(e){return null}}
let marketRefreshBusy=false;
async function refreshMarketPrices(){if(marketRefreshBusy)return;marketRefreshBusy=true;try{let changed=false;for(const x of S.stocks){const p=await fetchStockPrice(x.ticker);if(p!=null&&p!==x.price){x.price=p;x.priceUpdatedAt=new Date().toISOString();changed=true}}for(const x of S.mfs){const p=await fetchMFNav(x.code);if(p!=null&&p!==x.nav){x.nav=p;x.navUpdatedAt=new Date().toISOString();changed=true}}if(changed){localStorage.setItem(KEY,JSON.stringify(S));if(page==='home'||page==='invest')render()}}finally{marketRefreshBusy=false}}
function startMarketRefresh(){refreshMarketPrices();setInterval(refreshMarketPrices,180000)}
function marketLabel(x,type){const d=type==='stock'?x.priceUpdatedAt:x.navUpdatedAt;return d?'Updated '+new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'Manual/latest value'}
function render(){({home,transactions,invest,loans,reports,settings}[page])()}
function go(p){page=p;render()}
function modal(title,body){document.getElementById('modal').innerHTML=`<div class="sheet"><h3>${title}</h3>${body}</div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML=''}
function openAdd(type){const t=type||'income';modal(t==='income'?'Add Income':'Add Expense',`<form class="form" onsubmit="saveTxn(event,'${t}')"><label>Amount</label><input id="amount" type="number" step="0.01" min="0" required><label>Category</label><input id="category" required placeholder="e.g. Salary / Food"><label>Account</label><select id="account"><option>Bank</option><option>Cash</option></select><label>Date</label><input id="date" type="date" value="${today()}" required><label>Note</label><textarea id="note"></textarea><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveTxn(e,type,editId=null){e.preventDefault();const x={id:editId||id(),amount:n(document.getElementById('amount').value),category:document.getElementById('category').value,account:document.getElementById('account').value,date:document.getElementById('date').value,note:document.getElementById('note').value};if(editId){const arr=type==='income'?S.income:S.expenses;const i=arr.findIndex(a=>a.id===editId);if(i>=0){reverseCash(arr[i],type);arr[i]=x;applyCash(x,type)}}else{(type==='income'?S.income:S.expenses).push(x);applyCash(x,type)}closeModal();save()}
function applyCash(x,type){if(x.account==='Bank')S.bank+=type==='income'?x.amount:-x.amount;else S.cash+=type==='income'?x.amount:-x.amount}
function reverseCash(x,type){if(x.account==='Bank')S.bank-=type==='income'?x.amount:-x.amount;else S.cash-=type==='income'?x.amount:-x.amount}
function editTxn(type,i){const x=(type==='income'?S.income:S.expenses).find(a=>a.id===i);if(!x)return;modal(type==='income'?'Edit Income':'Edit Expense',`<form class="form" onsubmit="saveTxn(event,'${type}','${i}')"><label>Amount</label><input id="amount" type="number" step="0.01" value="${x.amount}" required><label>Category</label><input id="category" value="${esc(x.category)}" required><label>Account</label><select id="account"><option ${x.account==='Bank'?'selected':''}>Bank</option><option ${x.account==='Cash'?'selected':''}>Cash</option></select><label>Date</label><input id="date" type="date" value="${x.date}" required><label>Note</label><textarea id="note">${esc(x.note)}</textarea><button>Save Changes</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function deleteTxn(type,i){if(!confirm('Delete this transaction?'))return;const arr=type==='income'?S.income:S.expenses;const x=arr.find(a=>a.id===i);if(x)reverseCash(x,type);const k=arr.findIndex(a=>a.id===i);if(k>=0)arr.splice(k,1);save()}
function openStock(idv=null){const x=idv?S.stocks.find(a=>a.id===idv):null;modal(x?'Edit Stock':'Buy Stock',`<form class="form" onsubmit="saveStock(event,'${idv||''}')"><label>Ticker</label><input id="ticker" value="${esc(x?.ticker||'')}" required><label>Name</label><input id="name" value="${esc(x?.name||'')}" required><label>Quantity</label><input id="qty" type="number" step="0.0001" value="${x?.qty||''}" required><label>Average Buy Price</label><input id="avg" type="number" step="0.01" value="${x?.avg||''}" required><label>Latest Price</label><input id="price" type="number" step="0.01" value="${x?.price??x?.avg??''}" required><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveStock(e,editId){e.preventDefault();const x={id:editId||id(),ticker:document.getElementById('ticker').value.toUpperCase(),name:document.getElementById('name').value,qty:n(document.getElementById('qty').value),avg:n(document.getElementById('avg').value),price:n(document.getElementById('price').value)};if(editId){const i=S.stocks.findIndex(a=>a.id===editId);if(i>=0)S.stocks[i]=x}else{const old=S.stocks.find(a=>a.ticker===x.ticker);if(old){const total=old.qty+x.qty;old.avg=total?((old.qty*old.avg)+(x.qty*x.avg))/total:0;old.qty=total;old.price=x.price}else S.stocks.push(x);S.investmentCash=Math.max(0,S.investmentCash-x.qty*x.avg)}closeModal();save()}
function editStock(i){openStock(i)}
function deleteStock(i){if(!confirm('Delete this stock holding?'))return;const x=S.stocks.find(a=>a.id===i);if(x)S.investmentCash+=x.qty*x.avg;S.stocks=S.stocks.filter(a=>a.id!==i);save()}
function openMF(idv=null){const x=idv?S.mfs.find(a=>a.id===idv):null;modal(x?'Edit Mutual Fund':'Buy Mutual Fund',`<form class="form" onsubmit="saveMF(event,'${idv||''}')"><label>Fund name</label><input id="name" value="${esc(x?.name||'')}" required><label>AMFI Scheme Code</label><input id="code" value="${esc(x?.code||'')}"><label>Units</label><input id="units" type="number" step="0.000001" value="${x?.units||''}" required><label>Average NAV</label><input id="avg" type="number" step="0.0001" value="${x?.avg||''}" required><label>Latest NAV</label><input id="nav" type="number" step="0.0001" value="${x?.nav??x?.avg??''}" required><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveMF(e,editId){e.preventDefault();const x={id:editId||id(),name:document.getElementById('name').value,code:document.getElementById('code').value,units:n(document.getElementById('units').value),avg:n(document.getElementById('avg').value),nav:n(document.getElementById('nav').value)};if(editId){const i=S.mfs.findIndex(a=>a.id===editId);if(i>=0)S.mfs[i]=x}else{const old=S.mfs.find(a=>a.code&&a.code===x.code&&x.code);if(old){const total=old.units+x.units;old.avg=total?((old.units*old.avg)+(x.units*x.avg))/total:0;old.units=total;old.nav=x.nav}else S.mfs.push(x);S.investmentCash=Math.max(0,S.investmentCash-x.units*x.avg)}closeModal();save()}
function editMF(i){openMF(i)}function deleteMF(i){if(!confirm('Delete this mutual fund holding?'))return;const x=S.mfs.find(a=>a.id===i);if(x)S.investmentCash+=x.units*x.avg;S.mfs=S.mfs.filter(a=>a.id!==i);save()}
function openStockSale(idv){const x=S.stocks.find(a=>a.id===idv);if(!x)return;modal('Sell Stock',`<form class="form" onsubmit="sellStock(event,'${idv}')"><div class="notice">Available: ${n(x.qty)} shares · Latest price ${money(x.price||x.avg)}</div><label>Quantity to sell</label><input id="sellQty" type="number" step="0.0001" min="0.0001" max="${x.qty}" required><label>Sale Price</label><input id="sellPrice" type="number" step="0.01" value="${x.price||x.avg}" required><label>Date</label><input id="sellDate" type="date" value="${today()}" required><button>Sell Stock</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function sellStock(e,idv){e.preventDefault();const x=S.stocks.find(a=>a.id===idv),q=n(document.getElementById('sellQty').value),p=n(document.getElementById('sellPrice').value),d=document.getElementById('sellDate').value;if(!x||q<=0||q>x.qty)return;const proceeds=q*p;x.qty-=q;S.investmentCash+=proceeds;S.investmentTx.push({id:id(),asset:'stock',action:'Sell',ticker:x.ticker,name:x.name,qty:q,price:p,proceeds,date:d,costBasis:q*x.avg});if(x.qty===0)S.stocks=S.stocks.filter(a=>a.id!==idv);closeModal();save()}
function openMFSale(idv){const x=S.mfs.find(a=>a.id===idv);if(!x)return;modal('Redeem Mutual Fund',`<form class="form" onsubmit="redeemMF(event,'${idv}')"><div class="notice">Available: ${n(x.units)} units · Latest NAV ${money(x.nav||x.avg)} · ${marketLabel(x,'mf')}</div><label>Units to redeem</label><input id="sellUnits" type="number" step="0.000001" min="0.000001" max="${x.units}" required><label>Redemption NAV</label><input id="sellNav" type="number" step="0.0001" value="${x.nav||x.avg}" required><label>Date</label><input id="sellDate" type="date" value="${today()}" required><button>Redeem Mutual Fund</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function redeemMF(e,idv){e.preventDefault();const x=S.mfs.find(a=>a.id===idv),q=n(document.getElementById('sellUnits').value),p=n(document.getElementById('sellNav').value),d=document.getElementById('sellDate').value;if(!x||q<=0||q>x.units)return;const proceeds=q*p;x.units-=q;S.investmentCash+=proceeds;S.investmentTx.push({id:id(),asset:'mf',action:'Redeem',name:x.name,qty:q,price:p,proceeds,date:d,costBasis:q*x.avg});if(x.units===0)S.mfs=S.mfs.filter(a=>a.id!==idv);closeModal();save()}
function openLoan(idv=null){const x=idv?S.loans.find(a=>a.id===idv):null;modal(x?'Edit Loan':'Add Loan',`<form class="form" onsubmit="saveLoan(event,'${idv||''}')"><label>Person</label><input id="person" value="${esc(x?.person||'')}" required><label>Type</label><select id="type"><option value="lent" ${x?.type==='lent'?'selected':''}>I lent money</option><option value="borrowed" ${x?.type==='borrowed'?'selected':''}>I borrowed money</option></select><label>Amount</label><input id="amount" type="number" step="0.01" value="${x?.amount||''}" required><label>Paid/Repayments</label><input id="paid" type="number" step="0.01" value="${x?.paid||0}"><label>Date</label><input id="date" type="date" value="${x?.date||today()}"><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveLoan(e,editId){e.preventDefault();const x={id:editId||id(),person:document.getElementById('person').value,type:document.getElementById('type').value,amount:n(document.getElementById('amount').value),paid:n(document.getElementById('paid').value),date:document.getElementById('date').value};if(editId){const i=S.loans.findIndex(a=>a.id===editId);if(i>=0)S.loans[i]=x}else S.loans.push(x);closeModal();save()}
function editLoan(i){openLoan(i)}function deleteLoan(i){if(!confirm('Delete this loan?'))return;S.loans=S.loans.filter(a=>a.id!==i);save()}
function openSplit(idv=null){const x=idv?S.splitwise.find(a=>a.id===idv):null;modal(x?'Edit Splitwise':'Add Splitwise',`<form class="form" onsubmit="saveSplit(event,'${idv||''}')"><label>Person</label><input id="person" value="${esc(x?.person||'')}" required><label>Type</label><select id="type"><option value="owedToMe" ${x?.type==='owedToMe'?'selected':''}>They owe me</option><option value="iOwe" ${x?.type==='iOwe'?'selected':''}>I owe them</option></select><label>Amount</label><input id="amount" type="number" step="0.01" value="${x?.amount||''}" required><label>Paid/Settled</label><input id="paid" type="number" step="0.01" value="${x?.paid||0}"><label>Date</label><input id="date" type="date" value="${x?.date||today()}"><button>Save</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveSplit(e,editId){e.preventDefault();const x={id:editId||id(),person:document.getElementById('person').value,type:document.getElementById('type').value,amount:n(document.getElementById('amount').value),paid:n(document.getElementById('paid').value),date:document.getElementById('date').value};if(editId){const i=S.splitwise.findIndex(a=>a.id===editId);if(i>=0)S.splitwise[i]=x}else S.splitwise.push(x);closeModal();save()}
function editSplit(i){openSplit(i)}function deleteSplit(i){if(!confirm('Delete this Splitwise entry?'))return;S.splitwise=S.splitwise.filter(a=>a.id!==i);save()}
function openTransfer(){modal('Transfer Money',`<form class="form" onsubmit="transfer(event)"><label>From</label><select id="from"><option>Bank</option><option>Cash</option><option>Investment Cash</option></select><label>To</label><select id="to"><option>Bank</option><option>Cash</option><option>Investment Cash</option></select><label>Amount</label><input id="amount" type="number" step="0.01" min="0" required><button>Transfer</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function transfer(e){e.preventDefault();const f=document.getElementById('from').value,t=document.getElementById('to').value,a=n(document.getElementById('amount').value);if(f===t){alert('Choose different accounts');return}const map={'Bank':'bank','Cash':'cash','Investment Cash':'investmentCash'};if(S[map[f]]<a){alert('Insufficient balance');return}S[map[f]]-=a;S[map[t]]+=a;S.transfers.push({id:id(),from:f,to:t,amount:a,date:today()});closeModal();save()}
function openBalances(){modal('Opening / Closing Balances',`<form class="form" onsubmit="saveBalances(event)"><div class="notice">Use this only to record your starting or checking balances. It does not create an income or expense.</div><label>Bank</label><input id="bank" type="number" step="0.01" value="${S.bank}"><label>Cash</label><input id="cash" type="number" step="0.01" value="${S.cash}"><label>Investment Cash</label><input id="investmentCash" type="number" step="0.01" value="${S.investmentCash}"><button>Save Current Balances</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></form>`)}
function saveBalances(e){e.preventDefault();S.bank=n(document.getElementById('bank').value);S.cash=n(document.getElementById('cash').value);S.investmentCash=n(document.getElementById('investmentCash').value);S.closing={date:today(),bank:S.bank,cash:S.cash,investmentCash:S.investmentCash};closeModal();save()}
function backup(){const blob=new Blob([JSON.stringify({version:1,app:'My Money',data:S},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-money-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.data)throw Error();S={...structuredClone(defaults),...j.data};S.investmentTx=Array.isArray(S.investmentTx)?S.investmentTx:[];S.loans=Array.isArray(S.loans)?S.loans:[];S.splitwise=Array.isArray(S.splitwise)?S.splitwise:[];S.income=Array.isArray(S.income)?S.income:[];S.expenses=Array.isArray(S.expenses)?S.expenses:[];S.stocks=Array.isArray(S.stocks)?S.stocks:[];S.mfs=Array.isArray(S.mfs)?S.mfs:[];save();alert('Backup restored');}catch(err){alert('Invalid backup file')}};r.readAsText(f)}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js?v=10.1').catch(()=>{});startMarketRefresh();render();
</script></body></html>
