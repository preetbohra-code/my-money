<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><link rel="manifest" href="manifest.webmanifest"><title>My Money</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111318;--muted:#737780;--line:#e7e8ec;--blue:#2875f0;--green:#16844b;--red:#d94b4b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:100px}.top{padding:calc(20px + env(safe-area-inset-top)) 20px 12px}.brand{font-size:28px;font-weight:800;letter-spacing:-1px}.hero{margin:8px 16px 14px;background:#111318;color:#fff;border-radius:28px;padding:22px}.label{color:#adb1ba;font-size:14px}.net{font-size:40px;font-weight:800;margin:5px 0 18px}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini div{background:#24262b;border-radius:16px;padding:12px}.mini b{display:block;font-size:15px}.mini span{font-size:12px;color:#adb1ba}.actions,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}.action,.card{background:#fff;border:1px solid var(--line);border-radius:20px}.action{padding:16px;text-align:left}.action strong{display:block;color:var(--blue);font-size:18px}.action small,.muted{color:var(--muted)}.section{padding:0 16px;margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}.head h2{font-size:20px;margin:0}.link{background:none;color:var(--blue);padding:8px}.card{padding:16px}.amount{font-size:24px;font-weight:800}.pos{color:var(--green)}.neg{color:var(--red)}.groww{background:#effff7}.tx{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.tx:last-child{border-bottom:0}.ico{width:40px;height:40px;border-radius:14px;background:#f0f1f4;display:grid;place-items:center}.txmain{flex:1;min-width:0}.txmain b,.txmain small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.txmain small{color:var(--muted);font-size:12px}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav{max-width:560px;margin:auto;display:grid;grid-template-columns:1fr 1fr 70px 1fr;align-items:center}.nav button{background:none;color:var(--muted);font-size:11px;padding:6px}.plus{width:54px;height:54px;border-radius:18px!important;background:#111318!important;color:#fff!important;font-size:28px!important;margin:auto}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:30}.modal.show{display:flex}.sheet{width:100%;max-width:560px;margin:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.handle{width:42px;height:4px;background:#d4d5d9;border-radius:10px;margin:0 auto 18px}.form{display:grid;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fafbfc}.primary,.secondary{width:100%;padding:15px;border-radius:15px;font-weight:700}.primary{background:#111318;color:#fff}.secondary{background:#eef0f3;color:#111318}.empty{text-align:center;color:var(--muted);padding:18px}.toast{position:fixed;left:50%;bottom:94px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111318;color:#fff;padding:12px 16px;border-radius:14px;z-index:60;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
</style></head><body><main class="app"><header class="top"><div class="brand">My Money</div></header><section class="hero"><div class="label">Total net worth</div><div class="net" id="net">₹0</div><div class="mini"><div><b id="bank">₹0</b><span>Bank</span></div><div><b id="cash">₹0</b><span>Cash</span></div><div><b id="groww">₹0</b><span>Groww</span></div></div></section><div class="actions"><button class="action" id="addExpense"><strong>− Add expense</strong><small>Record spending</small></button><button class="action" id="addIncome"><strong>＋ Add income</strong><small>Record money received</small></button></div><section class="section"><div class="head"><h2>This month</h2><button class="link" id="transferBtn">Transfer money</button></div><div class="grid"><div class="card"><div class="muted">Spent</div><div class="amount neg" id="monthExp">₹0</div></div><div class="card"><div class="muted">Income</div><div class="amount pos" id="monthInc">₹0</div></div></div></section><section class="section"><div class="head"><h2>Groww</h2><button class="link" id="growwBtn">Update</button></div><div class="card groww"><div class="muted">Portfolio value</div><div class="amount" id="growwBig">₹0</div><div class="muted">Manual balance</div></div></section><section class="section"><div class="head"><h2>Recent transactions</h2><button class="link" id="allBtn">See all</button></div><div class="card" id="recent"></div></section></main><nav class="bottom"><div class="nav"><button id="homeBtn">⌂<br>Home</button><button id="txBtn">☷<br>Transactions</button><button class="plus" id="plusBtn">+</button><button id="settingsBtn">⚙<br>Settings</button></div></nav>
<div class="modal" id="txModal"><div class="sheet"><div class="handle"></div><h2 id="txTitle">Add expense</h2><form class="form" id="txForm"><div class="field"><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></div><div class="field" id="catWrap"><label>Category</label><select id="category"><option>Food & Dining</option><option>Shopping</option><option>Travel</option><option>Fuel</option><option>Bills & Recharge</option><option>Entertainment</option><option>Health</option><option>Education</option><option>Business</option><option>Other</option></select></div><div class="field"><label>Account</label><select id="account"></select></div><div class="field"><label>Note</label><input id="note" maxlength="80" placeholder="Optional"></div><div class="field"><label>Date</label><input id="date" type="date"></div><button class="primary" type="submit">Save</button><button class="secondary" type="button" data-close="txModal">Cancel</button></form></div></div>
<div class="modal" id="growwModal"><div class="sheet"><div class="handle"></div><h2>Update Groww balance</h2><form class="form" id="growwForm"><div class="field"><label>Current portfolio value</label><input id="growwAmount" type="number" min="0" step="0.01" inputmode="decimal" required></div><button class="primary">Save</button><button class="secondary" type="button" data-close="growwModal">Cancel</button></form></div></div>
<div class="modal" id="settingsModal"><div class="sheet"><div class="handle"></div><h2>Settings</h2><div class="form"><button class="primary" id="pinBtn">🔐 Set / Change PIN</button><button class="secondary" id="backupBtn">⬇️ Backup data</button><button class="secondary" id="restoreBtn">⬆️ Restore backup</button><input id="restoreFile" type="file" accept="application/json" class="hidden"><button class="secondary" data-close="settingsModal">Close</button></div></div></div>
<div class="modal" id="lockModal"><div class="sheet"><div class="handle"></div><h2>🔐 Unlock My Money</h2><form class="form" id="unlockForm"><div class="field"><label>PIN</label><input id="unlockPin" type="password" inputmode="numeric" maxlength="6" required></div><button class="primary">Unlock</button></form></div></div>
<div class="modal" id="listModal"><div class="sheet"><div class="handle"></div><h2>Transactions</h2><div id="allList"></div><button class="secondary" data-close="listModal">Close</button></div></div><div class="toast" id="toast"></div>
<script>
const KEY='mymoney-v3';let db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}db=db&&db.balances&&Array.isArray(db.tx)?db:{balances:{bank:0,cash:0,groww:0},tx:[]};let mode='expense';const $=id=>document.getElementById(id);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const today=new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function openModal(id){$(id).classList.add('show')}function closeModal(id){$(id).classList.remove('show')}
function render(){const b=db.balances;$('bank').textContent=money(b.bank);$('cash').textContent=money(b.cash);$('groww').textContent=money(b.groww);$('growwBig').textContent=money(b.groww);$('net').textContent=money(b.bank+b.cash+b.groww);const m=today.slice(0,7);let ex=0,inc=0;db.tx.forEach(t=>{if(t.date?.slice(0,7)===m){if(t.type==='expense')ex+=t.amount;if(t.type==='income')inc+=t.amount}});$('monthExp').textContent=money(ex);$('monthInc').textContent=money(inc);renderList($('recent'),db.tx.slice().sort((a,b)=>b.created-a.created).slice(0,8))}
function renderList(el,list){el.innerHTML=list.length?list.map(t=>`<div class="tx"><div class="ico">${t.type==='expense'?'−':t.type==='income'?'+':'↔'}</div><div class="txmain"><b>${esc(t.note||t.category||t.type)}</b><small>${esc(t.category||'Transfer')} · ${t.date} · ${esc(t.account||'')}</small></div><strong class="${t.type==='expense'?'neg':'pos'}">${t.type==='expense'?'−':'+'}${money(t.amount)}</strong></div>`).join(''):'<div class="empty">No transactions yet.</div>'}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function setAccounts(){if(mode==='transfer'){$('account').innerHTML='<option value="bankcash">Bank → Cash</option><option value="cashbank">Cash → Bank</option><option value="bankgroww">Bank → Groww</option><option value="growwbank">Groww → Bank</option>'}else $('account').innerHTML='<option value="bank">Bank</option><option value="cash">Cash</option><option value="groww">Groww</option>'}
function openTx(type){mode=type;$('txTitle').textContent=type==='transfer'?'Transfer money':type==='income'?'Add income':'Add expense';$('catWrap').classList.toggle('hidden',type==='transfer');$('amount').value='';$('note').value='';$('date').value=today;setAccounts();openModal('txModal')}
$('addExpense').onclick=()=>openTx('expense');$('addIncome').onclick=()=>openTx('income');$('plusBtn').onclick=()=>openTx('expense');$('transferBtn').onclick=()=>openTx('transfer');$('growwBtn').onclick=()=>{$('growwAmount').value=db.balances.groww;openModal('growwModal')};$('settingsBtn').onclick=()=>openModal('settingsModal');$('homeBtn').onclick=()=>scrollTo({top:0,behavior:'smooth'});$('txBtn').onclick=()=>showAll();$('allBtn').onclick=()=>showAll();
$('txForm').onsubmit=e=>{e.preventDefault();const amount=Number($('amount').value),acc=$('account').value,date=$('date').value,note=$('note').value.trim();if(!(amount>0))return;if(mode==='transfer'){let from,to;if(acc==='bankcash'){from='bank';to='cash'}else if(acc==='cashbank'){from='cash';to='bank'}else if(acc==='bankgroww'){from='bank';to='groww'}else{from='groww';to='bank'}if(db.balances[from]<amount){toast('Not enough balance');return}db.balances[from]-=amount;db.balances[to]+=amount;db.tx.push({type:'transfer',amount,date,note:note||`${from} → ${to}`,account:`${from} → ${to}`,created:Date.now()})}else{if(mode==='expense'){if(db.balances[acc]<amount){toast('Not enough balance');return}db.balances[acc]-=amount}else db.balances[acc]+=amount;db.tx.push({type:mode,amount,date,note,category:mode==='expense'?$('category').value:'Income',account:acc,created:Date.now()})}save();closeModal('txModal');toast('Saved')};
$('growwForm').onsubmit=e=>{e.preventDefault();const v=Number($('growwAmount').value);if(v<0)return;db.balances.groww=v;save();closeModal('growwModal');toast('Groww updated')};
function showAll(){renderList($('allList'),db.tx.slice().sort((a,b)=>b.created-a.created));openModal('listModal')}
$('pinBtn').onclick=()=>{const p=window.prompt('Create a 4–6 digit PIN. Leave blank to remove it.');if(p===null)return;if(p===''){delete db.pin;save();toast('PIN removed');return}if(!/^\d{4,6}$/.test(p)){toast('PIN must be 4–6 digits');return}db.pin=p;save();toast('PIN enabled')};
$('backupBtn').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-money-backup-'+today+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup created')};
$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.balances||!Array.isArray(x.tx))throw 0;db=x;save();toast('Backup restored')}catch(_){toast('Invalid backup')}};r.readAsText(f);e.target.value=''};
$('unlockForm').onsubmit=e=>{e.preventDefault();if($('unlockPin').value===db.pin){closeModal('lockModal');$('unlockPin').value=''}else toast('Incorrect PIN')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
render();if(db.pin)openModal('lockModal');if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
